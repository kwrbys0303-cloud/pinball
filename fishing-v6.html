/* ============================================================
   14. パワーアップ / かけひき画面
   ============================================================ */
const puBtn=$('puBtn'), puFill=$('puFill'), puSub=$('puSub'), modal=$('modal'),
      cardsEl=$('cards'), slotArea=$('slotArea'), elArea=$('elArea'),
      puMoney=$('puMoney'), puTitle=$('puTitle'), passBtn=$('passBtn'),
      tdBtn=$('tdBtn'), tdSub=$('tdSub'),
      synPop=$('synPop'), legendBox=$('legend'), flyEl=$('fly'), maxPop=$('maxPop');
let curScale = 1;

{ const g=$('puGauge'); for (const p of [66.6,100]){
    const d=document.createElement('div'); d.className='tick'; d.style.left=p+'%'; g.appendChild(d); } }

function updateBtns(){
  const c = puCost();
  puFill.style.width = Math.min(1, st.money/(c*3))*100 + '%';
  if (st.money >= c){
    puBtn.classList.add('ready');
    puSub.textContent = '¥'+c+'　' + (st.money>=c*3 ? '★★' : st.money>=c*2 ? '★' : 'ためると ★');
  } else { puBtn.classList.remove('ready'); puSub.textContent = 'あと ¥'+(c-st.money); }
  const ok = st.tickets > 0 && tradePool().length > 0;
  if (phase==='aim') setTimeout(checkTut, 0);
  tdBtn.classList.toggle('ready', ok);
  tdSub.textContent = st.tickets > 0
      ? (tradePool().length ? '券 ' + '🎫'.repeat(Math.min(3,st.tickets)) : '枠がいっぱい')
      : 'レア魚か たからばこ から';
}
const updatePUBtn = updateBtns;
function synAfter(c){
  const t = { ...st.tag }; t[st.elem[c.id]] += 1;
  return SYNS.filter(s=>synHas(t,s) && !st.syn.has(s.id));
}
function canTake(c){
  if (lv(c.id) >= c.max) return false;
  if (lv(c.id) > 0) return true;
  if (c.slot === null) return true;
  return usedIn(c.slot) < capOf(c.slot);
}
const tradePool = ()=>CARDS.filter(c=>c.t==='t' && canTake(c));

function rollChoices(){
  const cost = puCost();
  // 2プレイに1回ほど出会える量。龍神を釣ると しばらく確率が上がる
  let wN=74, wR=10, wL=1.4;
  if (st.legendBoost > 0){ wL *= 3.5; st.legendBoost--; }
  if (st.money >= cost*3){ wR*=3.0; wL*=1.8; }
  else if (st.money >= cost*2){ wR*=2.0; wL*=1.35; }
  const perm = CARDS.filter(c=>(c.t==='n'||c.t==='r'||c.t==='l') && canTake(c));
  const temp = CARDS.filter(c=>c.t==='x');
  const nCards = lv('pricey') ? 4 : 3;
  const out = [];
  const wantPerm = st.puCount < 2 ? nCards : Math.max(out.length, nCards-1);
  for (let i=out.length; i<wantPerm && out.length<nCards; i++){
    const pool = perm.filter(c=>!out.includes(c));
    if (!pool.length) break;
    const tot = wN+wR+wL;
    let r = Math.random()*tot, tier;
    if ((r-=wN)<=0) tier='n'; else if ((r-=wR)<=0) tier='r'; else tier='l';
    let sub = [];
    for (const tr of TIER_FALL[tier]){ sub = pool.filter(c=>c.t===tr); if (sub.length) break; }
    if (!sub.length) break;
    out.push(sub[(Math.random()*sub.length)|0]);
  }
  while (out.length < nCards){
    const pool = temp.filter(c=>!out.includes(c));
    if (!pool.length) break;
    out.push(pool[(Math.random()*pool.length)|0]);
  }
  for (let i=out.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [out[i],out[j]]=[out[j],out[i]]; }
  return out;
}

function openPU(free){
  phase = 'powerup';
  const list = rollChoices();
  const legend = list.find(c=>c.t==='l');
  const show = ()=>buildSheet(list, { free, trade:false });
  if (legend){ st.legendSeen++; playLegend(legend, show); } else show();
}
function openTrade(){
  phase = 'powerup';
  const pool = tradePool().slice();
  for (let i=pool.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [pool[i],pool[j]]=[pool[j],pool[i]]; }
  buildSheet(pool.slice(0,3), { free:true, trade:true });
  sfx.rare();
}
function playLegend(c, done){
  legendBox.querySelector('.li').textContent = c.ic;
  legendBox.querySelector('.ln').textContent = c.nm;
  legendBox.querySelector('.ld').textContent = c.ds;
  legendBox.classList.add('show'); sfx.legend();
  setTimeout(()=>{ legendBox.classList.remove('show'); done(); }, 1900);
}
function dotsHTML(n, max){
  let h = '<span class="lvd">';
  for (let i=0;i<max;i++) h += `<i class="${i<n?'on':''}"></i>`;
  return h + '</span>';
}

let curSheet = { free:false, trade:false };
function buildSheet(list, opt){
  const free = opt.free, trade = opt.trade;
  curSheet = opt;
  puTitle.textContent = trade ? 'かけひきタイム' : 'パワーアップ';
  puMoney.textContent = '¥' + st.money.toLocaleString();
  cardsEl.innerHTML = '';
  for (const c of list){
    const el = EL[st.elem[c.id]], gain = synAfter(c);
    const d = document.createElement('div');
    d.className = 'card ' + TIER[c.t];
    const price = free ? 'ムリョウ' : '¥' + cardCost(c).toLocaleString();
    d.innerHTML =
      `<div class="ic">${c.ic}</div><div class="tx">
         <div class="l1"><span class="nm">${c.nm}</span><span class="el">${el.ic}</span>
           ${(c.t==='x'||c.max===1) ? '' : dotsHTML(lv(c.id)+1, c.max)}
           <span class="pr">${price}${c.t==='x'&&!free?'<span class="cheap">やすい</span>':''}</span></div>
         <div class="ds">${cardDesc(c)}</div>
         ${gain.length ? `<div class="syn">◆ ${gain.map(g=>g.nm+'　'+g.d).join('／')}</div>` : ''}
       </div>`;
    d.onclick = ()=>choose(c, free, d);
    cardsEl.appendChild(d);
  }
  passBtn.style.display = 'none';   // 効果がおいしすぎて断る理由がないので 見おくるは廃止
  renderSlots(); renderElGauge();
  modal.classList.add('show');
  if (trade && !st.tut.tdPick){ st.tut.tdPick = 1;
    showTut('よいこと と わるいこと。<br>どれか 1つ えらぼう', 0, 44, false); }
  else if (!trade && !st.tut.puPick){ st.tut.puPick = 1;
    showTut('3つから 1つ えらぼう！', 0, 44, false); }
}

function renderSlots(){
  let h = '';
  for (const key of ['b','l','t']){
    const S = SLOT_STYLE[key], own = CARDS.filter(c=>c.slot===key && lv(c.id)>0), cap = capOf(key);
    h += `<div class="slotRow" style="color:${S.c}"><div class="lb">${S.nm}</div>`;
    for (let i=0;i<cap;i++){
      const c = own[i];
      if (c){
        let dd = '';
        if (c.max > 1){ dd = '<div class="sd">';
          for (let j=0;j<c.max;j++) dd += `<i class="${j<lv(c.id)?'on':''}"></i>`; dd += '</div>'; }
        h += `<div class="slot full" style="border-color:${S.c};background:${S.c}22"
                data-slot="${c.id}"><div class="si">${c.ic}</div>${dd}</div>`;
      } else {
        h += `<div class="slot empty" style="border-color:${S.c}" data-empty="${key}">＋</div>`;
      }
    }
    h += '</div>';
  }
  slotArea.innerHTML = h;
}

function renderElGauge(popEl, popTo){
  let h = '';
  for (const k of ELS){
    const v = (popEl===k && popTo!==undefined) ? popTo : st.tag[k], c = EL[k].c;
    let dots = '<span class="dots">';
    for (let i=0;i<6;i++){
      const on = v > i, pop = (popEl===k && v === i+1) ? ' pop' : '';
      dots += `<i class="${on?'on':''}${pop}"></i>`;
      if (i===2) dots += '<span class="sep"></span>';
    }
    dots += '</span>';
    const s3 = SYNS.find(s=>s.el===k && s.need===3), s6 = SYNS.find(s=>s.el===k && s.need===6);
    const stx = v>=6 ? `<b>${s6.nm}</b>　${s6.d}`
              : v>=3 ? `あと${6-v} → <b>${s6.nm}</b>　${s6.d}`
                     : `あと${3-v} → <b>${s3.nm}</b>　${s3.d}`;
    h += `<div class="elg" data-el="${k}" style="color:${c}"><span class="ei">${EL[k].ic}</span>${dots}
          <span class="st">${stx}</span></div>`;
  }
  const mn = Math.min(...ELS.map(k=>st.tag[k]));
  const sA = mn>=3 ? SYNS.find(s=>s.id==='all3') : SYNS.find(s=>s.id==='all2');
  const need = mn>=3 ? 0 : (mn>=2 ? 3 : 2);
  h += `<div class="elg" style="color:#e8b4ff"><span class="ei">🌈</span>
        <span class="st">${need===0 ? `<b>${sA.nm}</b>　${sA.d}`
          : `ぜんぶ${need}こで <b>${sA.nm}</b>　${sA.d}`}</span></div>`;
  elArea.innerHTML = h;
}

function localRect(el){
  const sr = stage.getBoundingClientRect(), r = el.getBoundingClientRect();
  return { x:(r.left-sr.left)/curScale, y:(r.top-sr.top)/curScale,
           w:r.width/curScale, h:r.height/curScale };
}
function slamInto(cardEl, card, done){
  const target = slotArea.querySelector(`[data-slot="${card.id}"]`)
              || slotArea.querySelector(`[data-empty="${card.slot}"]`);
  if (!target || !cardEl){ done(); return; }
  const a = localRect(cardEl), b = localRect(target);
  for (const el of cardsEl.children) if (el !== cardEl) el.style.opacity = '0';
  passBtn.style.display = 'none';
  cardEl.style.visibility = 'hidden';
  const fx = document.createElement('div');
  fx.className = 'flyCard ' + TIER[card.t];
  fx.style.cssText += `left:${a.x}px;top:${a.y}px;width:${a.w}px;height:${a.h}px;`;
  fx.textContent = card.ic;
  flyEl.appendChild(fx);
  requestAnimationFrame(()=>{
    fx.style.transform =
      `translate(${b.x-a.x + (b.w-a.w)/2}px, ${b.y-a.y + (b.h-a.h)/2}px) scale(${b.w/a.w},${b.h/a.h})`;
  });
  setTimeout(()=>{ fx.remove(); shake = Math.max(shake, 9); sfx.slot(); done(); }, 275);
}

function choose(card, free, cardEl){
  if (phase !== 'powerup') return;
  hideTut();
  if (!canTake(card)) return;          // 枠が埋まったあとの多重クリック対策
  phase = 'slam';
  // ①タグが大きく光る → ②枠へ飛んで着地、の順で見せる
  const el = st.elem[card.id];
  renderElGauge(el, st.tag[el] + 1);
  const row = elArea.querySelector(`[data-el="${el}"]`);
  if (row) row.classList.add('hit');
  sfx.zap1();
  setTimeout(()=>slamInto(cardEl, card, ()=>applyPick(card, free)), 260);
}

function applyPick(c, free){
  if (!free){ st.money -= cardCost(c); sfx.buy(); }
  // かけひきタイムは 決まった回数しか来ない催しなので 値段カーブには数えない
  if (!curSheet.trade) st.puCount++; else st.tradeUsed++;
  const wasMax = isMaxed(c);
  st.lvl[c.id] = lv(c.id) + 1;
  const elKey = st.elem[c.id];
  st.tag[elKey] += 1;
  st.picks.push(c.nm);
  if (c.t === 'x'){
    const P = st.pend;
    if (c.id==='tFish')  P.fish     = Math.min(PEND_CAP.fish, P.fish+20);
    if (c.id==='tRing')  P.ring     = Math.min(PEND_CAP.ring, P.ring+40);
    if (c.id==='tScore') P.scoreAdd = Math.min(PEND_CAP.scoreAdd, P.scoreAdd+0.8);
    if (c.id==='tChest') P.chest   += 3;
    if (c.id==='tPull')  P.pull     = Math.min(PEND_CAP.pull, P.pull+3);
    st.lvl[c.id] = 0; st.rec.temp++;
  }
  let slotBorn = false;
  // 枠は増えるが 際限なくは増やさない（終盤に何でも取れると 選ぶ意味が消える）
  if (c.slot==='b' && !wasMax && isMaxed(c) && st.slotMax < 7){ st.slotMax++; slotBorn = true; }
  if (c.id==='fish')    addFish(18);
  if (c.id==='fishBig') addFish(60);
  if (c.id==='umi')     addFish(40);
  if (c.id==='chibi')   addFish(Math.round(aliveFish()*0.6));
  if (c.id==='scatter') addFish(50);

  const fresh = recompute();
  applySynBurst(fresh); recompute();
  checkFishUp();
  renderSlots(); renderElGauge();
  const tgt = slotArea.querySelector(`[data-slot="${c.id}"]`);
  if (tgt) tgt.classList.add('hit');
  if (slotBorn){
    maxPop.classList.add('show'); sfx.max();
    const e = slotArea.querySelector('[data-empty="b"]');
    if (e) e.classList.add('born');
    setTimeout(()=>maxPop.classList.remove('show'), 1000);
  }
  flushPendSpawns(); updatePUBtn();

  setTimeout(()=>{
    modal.classList.remove('show');
    for (const el of cardsEl.children){ el.style.opacity = ''; el.style.visibility = ''; }
    fresh.forEach((id,i)=>setTimeout(()=>showSyn(SYNS.find(s=>s.id===id)), i*2100));
    // beginCast なら「無料パワーアップの直後にかけひきタイム」も取りこぼさない
    if (st.castsLeft <= 0) gameOver(); else beginCast();
  }, slotBorn ? 1100 : 350);
}

/* --- 魚のパワーアップ告知（順番に出す） --- */
const fishPop = $('fishPop'), tutEl = $('tut');
let fishPopBusy = false;
function pushFishPop(ic, title, sub, rare){
  if (!st) return;
  st.fishQueue.push({ ic, title, sub, rare });
  drainFishPop();
}
function drainFishPop(){
  if (fishPopBusy || !st || !st.fishQueue.length) return;
  const q = st.fishQueue.shift();
  fishPopBusy = true;
  let sub = q.sub;
  if (!st.tut.fish){ st.tut.fish = 1;
    sub = 'きみが 3回 パワーアップ するたびに<br>魚も 1つ つよくなる！';
  }
  fishPop.className = 'ov show' + (q.rare ? ' rare' : '');
  fishPop.innerHTML = `<div class="fpBox"><div class="fpI">${q.ic}</div>
    <div class="fpT">${q.title}</div>${sub?`<div class="fpS">${sub}</div>`:''}</div>`;
  if (q.rare){ sfx.legend(); } else { sfx.syn(); }
  shake = Math.max(shake, q.rare ? 12 : 6);
  setTimeout(()=>{ fishPop.className='ov'; fishPopBusy=false;
                   setTimeout(drainFishPop, 200); }, q.rare ? 2400 : 1800);
}

/* --- チュートリアル（毎プレイ 初回のみ・タップで消える） --- */
function showTut(msg, x, y, up){
  tutEl.style.left = '0px'; tutEl.style.right = '0px'; tutEl.style.top = y + 'px';
  tutEl.innerHTML = up
    ? `<div class="tMsg">${msg}</div><div class="tArrow">▼</div>`
    : `<div class="tArrow" style="transform:rotate(180deg)">▼</div><div class="tMsg">${msg}</div>`;
  tutEl.classList.add('show');
}
const hideTut = ()=>tutEl.classList.remove('show');
function checkTut(){
  if (!st || phase!=='aim'){ return; }
  if (!st.tut.pu && st.money >= puCost()){
    showTut('おかねが たまった！<br>ここを おそう', 0, 610, true); return;
  }
  if (!st.tut.td && st.tickets > 0 && tradePool().length){
    showTut('かけひき券！<br>ここを おそう', 0, 610, true); return;
  }
  hideTut();
}

function showSyn(s){
  synPop.querySelector('.n').textContent = '◆ ' + s.nm + ' はつどう！';
  synPop.querySelector('.d').textContent = s.d;
  synPop.querySelector('.big').textContent = s.big || '大はば アップ！';
  synPop.style.transition='none'; synPop.style.opacity='1';
  sfx.syn(); flash = Math.max(flash, .3); shake = Math.max(shake, 10);
  setTimeout(()=>{ synPop.style.transition='opacity .8s'; synPop.style.opacity='0'; }, 1500);
}
puBtn.addEventListener('pointerdown', e=>{
  e.stopPropagation(); audioUnlock();
  if (st && phase==='aim' && st.money >= puCost()){ st.tut.pu = 1; hideTut(); openPU(false); }
});
tdBtn.addEventListener('pointerdown', e=>{
  e.stopPropagation(); audioUnlock();
  if (st && phase==='aim' && st.tickets > 0 && tradePool().length){
    st.tut.td = 1; hideTut(); st.tickets--; openTrade();
  }
});

/* ============================================================
   15. ステータス画面
   ============================================================ */
const statusSheet=$('status'), stBody=$('stBody'), stSub=$('stSub');
function openStatus(){
  const s = st; let h = '';
  h += `<div class="stSec">ステージ　${s.stage.ic} ${s.stage.nm}</div>
        <div style="font-size:12px;opacity:.8">${s.stage.note}</div>`;
  h += `<div class="stSec">さかな市場　${s.market.nm}</div><div class="statGrid">`;
  RANKS.forEach((R,i)=>{
    const tag = i===s.market.star ? '<b>★ たかい</b>' : i===s.market.dull ? '▼ やすい' : 'ふつう';
    h += `<div><span>${R.e} ${R.n}</span><span>${tag}</span></div>`;
  });
  h += '</div>';
  h += '<div class="stSec">シナジー</div>';
  for (const sy of SYNS){
    const on = s.syn.has(sy.id);
    let cond;
    if (on) cond = '✅ はつどう中';
    else if (sy.el==='all') cond = 'あと ' + ELS.filter(e=>s.tag[e]<sy.need)
                                  .map(e=>EL[e].n+(sy.need-s.tag[e])).join(' ');
    else cond = `あと ${EL[sy.el].n} ${sy.need - s.tag[sy.el]}`;
    h += `<div class="synLine ${on?'on':''}"><div class="sn">${sy.nm}</div>
      <div class="sc">${synShort(sy)}</div><div class="se">${on?sy.d:cond+' → '+sy.d}</div></div>`;
  }
  h += '<div class="stSec">いまのビルド</div>';
  const owned = CARDS.filter(c=>c.slot && lv(c.id)>0);
  if (!owned.length) h += '<div class="bRow"><div class="bn" style="opacity:.6">まだ なにも ありません</div></div>';
  for (const c of owned){
    const el = EL[s.elem[c.id]];
    h += `<div class="bRow"><div class="bi">${c.ic}</div>
      <div class="bn">${c.nm}${isMaxed(c)&&c.max>1?' <span style="color:#ffe27a">★</span>':''}</div>
      <div class="bl" style="color:${el.c}">${el.ic}</div>
      <div class="bl">${c.max>1?('Lv '+lv(c.id)+'/'+c.max):''}</div></div>`;
  }
  h += '<div class="stSec">いまの つよさ</div><div class="statGrid">';
  const rows = [
    ['ワッカ', Math.round(s.radius)], ['ヨコ帯', s.hlineH?('±'+Math.round(s.hlineH)):'なし'],
    ['タテ帯', s.vlineW?('±'+Math.round(s.vlineW)):'なし'],
    ['ナナメ帯', s.xlineW?('±'+Math.round(s.xlineW)):'なし'],
    ['引きよせ', s.pull+'匹'], ['ルアー', s.dual?'2本':'1本'],
    ['海の魚', aliveFish()+'匹'], ['毎投の わき', '+'+s.regen+'匹'],
    ['たからばこ', s.chestTarget+'こ'], ['たから効果', s.chestTimes+'回'],
    ['スコア倍率', '×'+s.scoreMult.toFixed(2)], ['デカ魚率', '+'+Math.round(s.rankP*100)+'%'],
  ];
  h += rows.map(([a,b])=>`<div><span>${a}</span><b>${b}</b></div>`).join('') + '</div>';
  h += '<div class="stSec">この海の ぞくせい</div><div class="poolGrid">';
  for (const k of ELS){
    const list = CARDS.filter(c=>s.elem[c.id]===k);
    h += `<div class="poolBox" style="border-color:${EL[k].c}">
      <div class="ph" style="color:${EL[k].c}">${EL[k].ic} ${EL[k].n}　${EL[k].dir}</div>
      <div class="pn">${list.map(c=>c.ic+' '+c.nm).join('<br>')}</div></div>`;
  }
  h += '</div>';
  stSub.textContent = `${castNo()} / ${CASTS} 投目`;
  stBody.innerHTML = h; stBody.scrollTop = 0;
  statusSheet.classList.add('show');
}
$('stBtn').addEventListener('pointerdown', e=>{
  e.stopPropagation();
  if (st && (phase==='aim' || phase==='powerup')) openStatus();
});
$('stClose').addEventListener('pointerdown', e=>{ e.stopPropagation(); statusSheet.classList.remove('show'); });
$('muBtn').addEventListener('pointerdown', e=>{
  e.stopPropagation(); audioUnlock();
  muted = !muted; $('muBtn').textContent = muted ? '🔇' : '🔊';
  $('muBtn').style.opacity = muted ? '.5' : '1';
  if (!muted) sfx.buy();
});

/* ============================================================
   16. 開始画面（ステージ・市場・属性を一括ストップ）
   ============================================================ */
const rollScreen=$('roll'), rollGo=$('rollGo'), rollTap=$('rollTap'),
      seaPrev=$('seaPrev'), seaCtx=seaPrev.getContext('2d');
let rollTimer = null, rollLocked = false;

function drawStagePrev(sg){
  seaCtx.clearRect(0,0,104,86);
  seaCtx.fillStyle='#08202f'; seaCtx.fillRect(0,0,104,86);
  seaPathOn(seaCtx, sg.k, false, 6, 5, 92, 76);
  const g = seaCtx.createLinearGradient(0,5,0,81);
  g.addColorStop(0, sg.col[0]); g.addColorStop(1, sg.col[2]);
  seaCtx.fillStyle = g; seaCtx.fill();
  seaCtx.strokeStyle='#8fd8ff'; seaCtx.lineWidth=2; seaCtx.stroke();
}
function renderMarket(mk){
  $('mkNm').textContent = mk.nm;
  $('mkRow').innerHTML = RANKS.map((R,i)=>{
    const cls = i===mk.star ? 'star' : i===mk.dull ? 'dull' : '';
    const lb  = i===mk.star ? '★ たかい' : i===mk.dull ? '▼ やすい' : 'ふつう';
    return `<div class="${cls}"><span class="f">${R.e}</span>${R.n}<br>${lb}</div>`;
  }).join('');
}
function renderFoeBox(show){
  const B = st.bossType, R = st.rareType;
  const one = (col, ic, nm, tale, prize)=>
    `<div class="foeLine" style="color:${col}"><span class="fi">${ic}</span><div>
       <div class="fn">${show?nm:'‥‥'}</div>
       <div class="ft">${show?tale:''}</div>
       <div class="fp">${show?prize:''}</div></div></div>`;
  $('foeBox').innerHTML =
    one('#ffb36a', B.ic, B.nm, B.tale, B.prize) +
    one('#b4e8ff', R.ic, R.nm, R.tale, RARE_PRIZE);
}
function renderElBox(showCards){
  $('elBox').innerHTML = ELS.map(k=>{
    const s3 = SYNS.find(x=>x.el===k && x.need===3), s6 = SYNS.find(x=>x.el===k && x.need===6);
    const cards = showCards
      ? CARDS.filter(c=>st.elem[c.id]===k).map(c=>`<span class="ec">${c.ic}${c.nm}</span>`).join('')
      : '‥‥';
    return `<div class="elBlk" style="color:${EL[k].c}">
      <div class="eh">${EL[k].ic} ${EL[k].n}　${EL[k].dir}</div>
      <div class="ee">3こで <b>${s3.d}</b>　／　6こで <b>${s6.d}</b></div>
      <div class="el">${cards}</div></div>`;
  }).join('');
}
function pickMarket(sg){
  const ok = MARKETS.filter(m=>MARKET_OK[sg.depth].includes(m.star));
  return ok[(Math.random()*ok.length)|0];
}

function startRoll(){
  dealElements();
  rollScreen.classList.add('show');
  rollGo.style.display='none'; rollTap.style.display='block';
  rollLocked = false;
  for (const el of rollScreen.querySelectorAll('.rSec')) el.classList.add('spin');
  rollTimer = setInterval(()=>{
    st.stage = STAGES[(Math.random()*STAGES.length)|0];
    st.market = pickMarket(st.stage);
    st.bossType = BOSSES[(Math.random()*BOSSES.length)|0];
    st.rareType = RARES[(Math.random()*RARES.length)|0];
    drawStagePrev(st.stage);
    $('stageNm').textContent = st.stage.ic + ' ' + st.stage.nm;
    $('stageNote').innerHTML = '';
    renderMarket(st.market);
    renderFoeBox(false); renderElBox(false);
  }, 65);
}
function stopRoll(){
  if (rollLocked) return;
  rollLocked = true;
  clearInterval(rollTimer); rollTimer = null;
  st.stage = STAGES[(Math.random()*STAGES.length)|0];
  st.market = pickMarket(st.stage);
  st.bossType = BOSSES[(Math.random()*BOSSES.length)|0];
  st.rareType = RARES[(Math.random()*RARES.length)|0];
  drawStagePrev(st.stage);
  $('stageNm').textContent = st.stage.ic + ' ' + st.stage.nm;
  $('stageNote').innerHTML = st.stage.note;
  renderMarket(st.market);
  renderFoeBox(true); renderElBox(true);
  for (const el of rollScreen.querySelectorAll('.rSec')) el.classList.remove('spin');
  rollTap.style.display='none'; rollGo.style.display='block';
  recompute(); sfx.syn();
}
rollScreen.addEventListener('pointerdown', e=>{
  if (e.target === rollGo) return;
  e.preventDefault(); e.stopPropagation(); audioUnlock(); stopRoll();
});
rollGo.addEventListener('pointerdown', e=>{
  e.stopPropagation();
  rollScreen.classList.remove('show');
  for (const f of fishPool)  f.alive=false;
  for (const c of chestPool) c.alive=false;
  recompute();
  addFish(Math.round(BASE_FISH * st.fishScale));
  beginCast();
});

/* ============================================================
   17. タイトル / リザルト（ランクと称号）
   ============================================================ */
const screen=$('screen'), scTtl=$('scTtl'), scBody=$('scBody'),
      scBtn=$('scBtn'), hsTxt=$('hsTxt'), buildList=$('buildList');

/* 自動プレイ（12投完走）の実測分布から決めた。
   適当に投げて 9〜11万、狙って投げて 20〜53万 あたりに落ちる */
/* 難易度を上げた v6 の実測分布から。適当に投げて D〜B、
   狙って S、うまく噛み合った最終投が爆発すると SSS */
const RANK_TH = [
  [700000,'SSS','#ff7ad0'], [380000,'SS','#ffd76a'], [190000,'S','#ffe9a8'],
  [110000,'A','#8fe0a0'], [55000,'B','#7fd0ff'], [26000,'C','#9fb8d0'],
  [10000,'D','#a0a8b0'], [0,'E','#8a8f96'],
];
function rankOf(sc){ for (const r of RANK_TH) if (sc >= r[0]) return r; return RANK_TH[RANK_TH.length-1]; }

/* 称号は「ヌシ」「できごと」「遊びかた」の3カテゴリから1つずつ選ぶ。
   ひとつの表から上から2つ取ると、毎回おなじ組み合わせになってしまう */
function titlesOf(){
  const s = st, out = [];
  const maxedN = CARDS.filter(c=>c.slot==='b' && c.max>1 && isMaxed(c)).length;
  const tradeN = usedIn('t'), legN = usedIn('l');
  const topEl  = Math.max(...ELS.map(k=>s.tag[k]));
  const topKey = ELS.find(k=>s.tag[k]===topEl);
  const minEl  = Math.min(...ELS.map(k=>s.tag[k]));

  const nushi = [
    [s.bossGot,                '🐉 ヌシハンター'],
    [s.bossSeen && !s.bossGot, '😭 ヌシに にげられた人'],
  ];
  const event = [                                   // できごと（めずらしい順）
    [s.rec.rare>=6,            '✨ 星をつかんだ人'],
    [s.rec.maxCatch>=120,      '🕸 一網打尽の達人'],
    [s.rec.tuna>=15,           '🐋 マグロ漁師'],
    [s.rec.chest>=12,          '🏴‍☠️ トレジャーハンター'],
    [legN>=2,                  '🍀 もってる人'],
    [s.score>0 && s.rec.lastScore/s.score>=0.45, '🚀 ラストスパート'],
    [s.rec.maxCatch>=60,       '🎏 大漁ずき'],
    [s.money>=20000,           '💰 ためこみ屋'],
  ];
  const style = [                                   // 遊びかた
    [minEl>=3,                 '🌈 オールラウンダー'],
    [topEl>=6,                 `${EL[topKey].ic} ${EL[topKey].n}の申し子`],
    [maxedN>=3,                '🔨 一点集中の職人'],
    [Math.round(s.radius)>=220,'🌊 海をのみこむ者'],
    [s.pull>=6,                '🧲 引きよせマスター'],
    [s.rec.temp>=5,            '⏱ その場しのぎの天才'],
    [tradeN>=3,                '😈 かけひきの鬼'],
    [tradeN===0,               '🛡 安全運転'],
    [s.dual,                   '🎣 二刀流の使い手'],
  ];
  for (const list of [nushi, event, style]){
    const hit = list.find(x=>x[0]);
    if (hit) out.push(hit[1]);
  }
  if (!out.length) out.push('🎣 つりびと');
  return out;
}

function showTitle(){
  phase='title'; screen.classList.remove('hide');
  scTtl.innerHTML = 'ツリツリバースト<small>さ か な の 逆 襲</small>';
  scBody.innerHTML = 'おした しゅんかんに <b>ヨコ</b>、おしっぱなしで <b>フカさ</b>。<br>'
    + '魚は みんな 逃げる。しかも <b>だんだん つよくなる</b>。<br>'
    + '<b>12投</b>で どこまで いけるか。<br>'
    + '<span style="opacity:.6;font-size:12px">タップ ／ スペースキー</span>';
  buildList.innerHTML=''; scBtn.textContent='はじめる';
  hsTxt.textContent = hiScore ? 'ハイスコア '+hiScore.toLocaleString() : '';
}
function gameOver(){
  phase='over'; sfx.over();
  if (st.score > hiScore) hiScore = st.score;
  screen.classList.remove('hide');
  scTtl.innerHTML = 'つりおわり！<small>お つ か れ さ ま</small>';
  const [,rk,col] = rankOf(st.score);
  scBody.innerHTML =
    `<div id="rankBig" style="color:${col}">${rk}</div>
     <div style="font-size:38px;font-weight:bold;color:#ffe27a;margin-top:4px">${st.score.toLocaleString()}</div>
     <div style="margin-top:6px">${titlesOf().map(t=>`<span class="titleChip">${t}</span>`).join('')}</div>
     <div style="font-size:12px;opacity:.65;margin-top:6px">${st.stage.ic} ${st.stage.nm}　${st.market.nm}</div>`;
  const seen = [...new Set(st.picks)];
  buildList.innerHTML = seen.map(p=>`<span>${p}</span>`).join('')
    + (st.syn.size ? '<br>' + [...st.syn].map(id=>
        `<span style="background:rgba(232,180,255,.25)">◆${SYNS.find(s=>s.id===id).nm}</span>`).join('') : '');
  scBtn.textContent='もう1回'; hsTxt.textContent='ハイスコア '+hiScore.toLocaleString();
}
function newGame(){
  audioUnlock();
  st = newState(); fishPopBusy = false;
  for (const f of fishPool)  f.alive=false;
  for (const c of chestPool) c.alive=false;
  for (const p of parPool)   p.alive=false;
  recompute();
  screen.classList.add('hide');
  modal.classList.remove('show'); statusSheet.classList.remove('show');
  updatePUBtn();
  phase = 'roll'; startRoll();
}
scBtn.addEventListener('pointerdown', e=>{ e.stopPropagation(); newGame(); });

/* ============================================================
   18. 入力・ループ
   ============================================================ */
const stage = $('stage');
const inUI = e => [puBtn,tdBtn,$('stBtn'),$('muBtn'),modal,statusSheet,screen,rollScreen,legendBox,flyEl]
                    .some(el=>el===e.target || el.contains(e.target));
stage.addEventListener('pointerdown', e=>{ if(inUI(e)) return; e.preventDefault(); onPress(); });
window.addEventListener('pointerup',     ()=>onRelease());
window.addEventListener('pointercancel', ()=>onRelease());
window.addEventListener('blur',          ()=>onRelease());
window.addEventListener('keydown', e=>{
  if (e.code!=='Space' && e.code!=='Enter') return;
  e.preventDefault(); audioUnlock();
  if (phase==='title'||phase==='over'){ newGame(); return; }
  if (phase==='roll'){ rollLocked ? rollGo.dispatchEvent(new Event('pointerdown')) : stopRoll(); return; }
  if (!e.repeat) onPress();
});
window.addEventListener('keyup', e=>{ if(e.code==='Space'||e.code==='Enter') onRelease(); });
document.addEventListener('touchmove', e=>e.preventDefault(), { passive:false });

function resize(){
  const iw=window.innerWidth, ih=window.innerHeight;
  curScale = Math.min(iw/W, ih/H);
  stage.style.transform =
    `translate(${(iw-W*curScale)/2}px, ${(ih-H*curScale)/2}px) scale(${curScale})`;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', ()=>setTimeout(resize,120));
resize();

st = newState(); dealElements(); recompute(); showTitle();

let last = performance.now();
function loop(now){
  const dt = Math.min(0.05,(now-last)/1000); last = now;
  if (phase!=='title' && phase!=='over' && phase!=='powerup' && phase!=='slam' && phase!=='roll')
    update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>

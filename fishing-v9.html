<!DOCTYPE html>
<!--
  ツリツリバースト 〜さかなの逆襲〜  v8
  ============================================================
  v7 → v8 で変えたこと
  - 告知ウィンドウを 1本の待ち行列に統一。シナジーと魚の強化が
    かさなって読めなくなる問題を解消（タップで飛ばせる）
  - シナジーは 4個／7個 の2段階に。名前と効果を「大幅強化！」中心の
    見せ方に変え、開始画面でも 4こ・7こ で何が起きるかを大きく出す
  - さかなの逆襲を全面改稿。「マグロの にげ足 パワーアップ！」のように
    魚の名前＋何が強くなったかを一目で。超パワーアップとして
    岩かくれ／点めつ（3秒見えて2秒消える無敵）／しゅんかん移動 を追加。
    そのかわり 強くなったランクは 点数が 1.4倍（上限2.0倍）
  - 海の中に かくれ岩と かざり を追加。岩のうしろの魚は ワッカでも帯でも
    釣れない。ただし 引きよせ だけは 岩ごしに とどく
  - 海の形が 毎プレイ変わるようになった（ふとさ・でこぼこ・深さをランダム化）。
    さらに 4・7・10投目に 深いところの形だけが なめらかに動く
  - ルアーは 底と水面で 折り返して 離すまで上下する。折り返すたび
    1.2倍ずつ速くなり 色が 黄→橙→赤 に変わる
  - 海がにごる効果を 魚より手前に描くよう修正（本当に見えなくなる）
  - 開始画面は 2回まで引きなおせる。属性の説明は全部スクロールできる
  ------------------------------------------------------------
  v6 → v7 で変えたこと
  - 背景に絵をいれた。タイトル／開始画面／リザルトは月夜の風景、
    プレイ中は海中の渓谷。海中の絵は「海の形の内側だけ」に描き、
    ステージごとの色を55%かぶせるので 形も色の個性も残る
    （毎フレーム描くと重いので ステージ確定時に一度だけ焼きつけて使う）
  - チュートリアルの吹き出しが 常に画面中央を指していたのを、
    ボタンの実際の位置を見て指すように修正
  - 魚のパワーアップを グッと強く。トリガーは「プレイヤーの強化3回」だけに。
    最終投では起こさない。1ランクにつき最大2回まで。
    ただし イワシ（最低ランク）への強化は効果を半分にして 逃げ道を残す
  - 超パワーアップ（20%）に「むれの王」を追加。数も逃げ足も跳ね上がる
  - 表示の色の言語を統一。プレイヤー＝青と金／魚＝赤と黒。
    画面フラッシュも 白金／赤 で塗り分ける
  ------------------------------------------------------------
  v5 → v6 で変えたこと
  - 難易度の作り直し。初期ワッカ52、逃げ足を大幅アップ、察知距離も拡大。
    何も考えずに落とすと ほぼ釣れない。狙って1〜3匹がスタートライン
  - 「気づくまでのラグ」を新設。イワシ0.30秒〜マグロ0.03秒。
    素早く深く落とせば 気づかれる前に取れる＝腕の勝負になる
  - 「今日の日当」¥25/投。釣れなくても ビルドは組める（スコアには入らない）
  - ★魚もパワーアップする。プレイヤーの強化3回 か 4投経過 の早いほうで発動。
    毎回1ランクだけ・最大6回。3回たまると「魚のかけひきタイム」で全体強化
  - ヌシ 240/430・息つぎ0.45秒（0.8秒前から光って予告）。レア魚 212〜230
  - ステージ・ヌシ・レア魚の説明を 情景と憧れを煽る文に書きかえ
  - 開始画面の属性ブロックに 効果の数字とカード名を入れ、スクロール可に
  - パワーアップ画面で タグゲージをカード直下・枠を最下部に入れかえ。
    タグ点灯を大きく光らせ、シナジー成立を大きく告知
  - パワーアップ名を全面的に付けかえ
  - はじめてのパワーアップ／かけひき／魚の強化に チュートリアル
  - レアパワーアップの抽選を半分に
  ------------------------------------------------------------
  v4 → v5 で変えたこと
  - 全ランクの魚が ルアーから逃げるようになった。逃げ足と察知距離は
    ランクごとに大きく差をつけ、イワシは追いつける／マグロは逃げ切る
  - カーソルを高速化（330→420）。初期ワッカ70・初回¥30で序盤を底上げ
  - 指を離した瞬間に その一投のスコアを計算し、
    自分のこれまでの平均との比で ルアーがキラリ／画面がフラッシュ
  - パワーアップとかけひきを 手動ボタンに。自動で開かない
  - かけひきタイムは「かけひき券」で発動。券はレア魚と宝箱から。持ち越せる
  - 宝箱の無料パワーアップを廃止（かけひき券に置きかえ）
  - ヌシ3種（ヌシザメ／ヌシダコ／ヌシリュウ）。超高速。レジェンド確定は廃止
  - レア魚3種（ニジダコ／ニジエイ／ニジフグ）。七色に光り 高速で規則的に動く
  - レジェンドの遭遇率を上げ、2プレイに1回ほど出会えるように
  ------------------------------------------------------------
  v3 → v4 で変えたこと
  - 海を「ステージ」に。7種それぞれ 名前・背景・水の色・雰囲気が変わる
  - さかな市場（時価）5種。★の魚はキラキラ光り ▼の魚はくすむ。
    浅いステージに深海の市場が来ないよう ステージと相性で抽選をしぼる
  - 開始画面を一括ストップ → ステージ名・市場・属性の方向性を一覧
  - イベントを偶数投に固定
      2/6/10 = キラキラ魚（決まったコースを周回）＋ かけひきタイム
      4 = 魚群 ／ 8 = ヌシ ／ 12 = 大漁タイム
  - かけひきタイム：3枚ともトレードオフ。無料。「見おくる」でお金にできる
  - 枠を3本立てに分離：ビルド4（MAXごとに+1）／おたから2／かけひき3
  - MAXにすると「レベルMAX！ わく+1！」を大きく出して 枠が生まれる
  - 上限より先の点線枠は描かない（空き枠には ＋ を表示）
  - 宝箱の効果を かけ算から 足し算へ（上限つき）。たまり具合をHUDに常時表示
  - 宝箱の移動を高速化。ヌシは最速＋たまに休む
  - 結果画面に SSS〜E ランクと 称号
-->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ツリツリバースト 〜さかなの逆襲〜</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#05121f;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif; color:#fff;
    user-select:none; touch-action:none; }
  #wrap  { position:fixed; inset:0; overflow:hidden; }
  #stage { position:absolute; left:0; top:0; width:480px; height:920px; transform-origin:top left; }
  canvas#cv { position:absolute; inset:0; width:480px; height:920px; border-radius:14px; }
  .ov { position:absolute; }
  #puBtn { z-index:10; }
  #modal { z-index:30; }
  #stBtn,#muBtn { z-index:40; }
  #status { z-index:50; }
  #note { z-index:56; }
  #fly   { z-index:58; }
  #legend,#roll,#screen { z-index:60; }

  /* ---------- 下部ボタン ---------- */
  #stBtn,#muBtn,#puBtn { border-radius:14px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; font-weight:bold; transition:.12s; }
  #stBtn:active,#muBtn:active,#puBtn:active { transform:scale(.95); }
  #stBtn { left:14px;  top:796px; width:74px;  height:76px; font-size:10px;
    background:#16324a; border:2px solid #2f5a7c; color:#9fd0e8; }
  #muBtn { left:92px;  top:796px; width:44px;  height:76px; font-size:20px;
    background:#16324a; border:2px solid #2f5a7c; color:#9fd0e8; }
  #stBtn .ic { font-size:18px; margin-bottom:2px; }
  #puBtn { left:142px; top:796px; width:160px; height:76px; font-size:14px;
    background:#1b3346; border:2px solid #2c4d68; color:#5c7a92; }
  /* しょじきん は パワーアップボタンの 中の いちばん上。ねだんは そのすぐ下 */
  #puWallet { font-size:15px; font-weight:bold; color:#ffd76a; letter-spacing:.5px;
    line-height:1.1; margin-bottom:1px; }
  #puBtn.ready #puWallet { color:#4a2c00; }
  #puBtn > div:nth-child(2) { font-size:12.5px; opacity:.9; }
  #tdBtn { left:308px; top:796px; width:158px; height:76px; font-size:14px; border-radius:14px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-weight:bold; transition:.12s;
    background:#241d31; border:2px solid #4a3a5c; color:#6b5c80; }
  #tdBtn:active { transform:scale(.95); }
  #puBtn.ready { background:linear-gradient(180deg,#ffd76a,#f2a63b); border-color:#fff3c4;
    color:#4a2c00; box-shadow:0 0 22px rgba(255,200,80,.75); animation:pulse 1.1s infinite; }
  #tdBtn.ready { background:linear-gradient(115deg,#40300a,#a07a18,#e0bb4a,#a07a18,#40300a);
    background-size:280% 280%; animation:shimmer 4s linear infinite, pulse 1.1s infinite;
    border-color:#ffeec2; color:#fff6d8; box-shadow:0 0 22px rgba(220,180,70,.8); }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.04)} }
  #puGauge { width:126px; height:6px; background:#0d2033; border-radius:4px; margin-top:3px;
    overflow:hidden; position:relative; }
  #puFill { height:100%; width:0%; background:#4fd1ff; transition:width .25s; }
  .tick { position:absolute; top:0; width:2px; height:100%; background:rgba(255,255,255,.55); }
  #puSub,#tdSub { font-size:10px; margin-top:3px; font-weight:normal; opacity:.92; }

  /* ---------- パワーアップ / かけひき画面 ---------- */
  #modal { inset:0; background:#050f19; display:none; flex-direction:column;
    align-items:stretch; justify-content:center; border-radius:14px;
    padding:12px 14px 10px; overflow-y:auto; }
  #modal.show { display:flex; }
  #puHead { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:8px; }
  #puHead .t { font-size:19px; font-weight:bold; letter-spacing:2px; }
  #puHead .m { font-size:13px; color:#8fe0a0; }
  #puHead .m b { font-size:25px; }
  #cards { display:flex; flex-direction:column; gap:8px; }
  #passBtn { display:none; margin:9px auto 0; padding:9px 26px; border-radius:22px;
    font-size:13px; font-weight:bold; background:#20364a; color:#9fd0e8;
    border:2px solid #35566f; }

  .card { border-radius:14px; border:2px solid; padding:9px 11px; display:flex;
    align-items:center; gap:10px; position:relative; overflow:hidden; }
  .card:active { transform:scale(.985); }
  .card .ic { font-size:30px; width:42px; text-align:center; flex:none;
    filter:drop-shadow(0 1px 1px rgba(0,0,0,.35)); }
  .card .tx { flex:1; min-width:0; }
  .card .l1 { display:flex; align-items:center; gap:7px; margin-bottom:3px; }
  .card .nm { font-size:18px; font-weight:bold; letter-spacing:.5px; }
  /* 属性タグは 左のイラストと おなじくらい 大きく。色つきの まるで かこう */
  .card .elBig { flex:none; width:44px; height:44px; border-radius:12px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:color-mix(in srgb, var(--ec) 26%, transparent);
    border:2px solid var(--ec); box-shadow:0 0 10px color-mix(in srgb, var(--ec) 45%, transparent); }
  .card .elBig span { font-size:22px; line-height:1; }
  .card .elBig i { font-size:9px; font-style:normal; font-weight:bold; color:var(--ec);
    line-height:1; margin-top:1px; }
  .card .lvd { display:flex; gap:3px; }
  .card .lvd i { width:7px; height:7px; border-radius:50%; display:block;
    background:currentColor; opacity:.25; }
  .card .lvd i.on { opacity:1; }
  .card .pr { margin-left:auto; font-size:20px; font-weight:bold; white-space:nowrap; }
  .card .ds { font-size:12.5px; line-height:1.35; opacity:.92; }
  .card .bad { opacity:.8; }
  .card .syn { font-size:12.5px; font-weight:bold; margin-top:4px;
    padding:2px 7px; border-radius:7px; display:inline-block; }
  .card .cheap { font-size:11px; font-weight:bold; margin-left:6px;
    padding:1px 6px; border-radius:6px; background:rgba(0,0,0,.16); }

  .r-n { background:#fdf4c8; border-color:#d4b845; color:#3f3300; }
  .r-r { background:#ffd6a0; border-color:#e8913a; color:#4a2600; }
  .r-x { background:#dbe2e8; border-color:#8fa2b2; color:#25313d; }
  .r-t { border-color:#e6c465; color:#ffeec2;
         background:linear-gradient(115deg,#40300a,#7d5f12,#c9a23a,#7d5f12,#40300a);
         background-size:280% 280%; animation:shimmer 5s linear infinite;
         box-shadow:0 0 22px rgba(210,170,70,.55); }
  @keyframes shimmer { 0%{background-position:0% 50%} 100%{background-position:280% 50%} }
  .r-l { border-color:#fff6cf; color:#2b1d00;
         background:linear-gradient(115deg,#ff9fb0,#ffd36a,#a8f08a,#7fdcff,#c4a6ff,#ff9fb0);
         background-size:320% 320%; animation:rainbow 4s linear infinite;
         box-shadow:0 0 30px rgba(255,235,160,.85); }
  @keyframes rainbow { 0%{background-position:0% 50%} 100%{background-position:320% 50%} }
  .r-n .syn,.r-r .syn,.r-l .syn,.r-x .syn { background:rgba(120,40,160,.16); color:#5b1f7a; }
  .r-t .syn { background:rgba(255,235,190,.2); color:#ffeec2; }

  /* ---------- 枠 ---------- */
  #slotArea { margin-top:12px; }
  .slotRow { display:flex; align-items:center; gap:6px; margin-bottom:5px; }
  .slotRow .lb { font-size:10px; width:50px; flex:none; }
  .slot { width:48px; height:48px; border-radius:11px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; flex:none; transition:.2s; }
  .slot.empty { border:2px dashed; background:rgba(255,255,255,.04);
    font-size:19px; font-weight:bold; opacity:.55; }
  .slot.full  { border:2px solid; }
  .slot .si { font-size:21px; line-height:1; }
  .slot .sd { display:flex; gap:2px; margin-top:3px; height:5px; }
  .slot .sd i { width:5px; height:5px; border-radius:50%; background:currentColor; opacity:.3; }
  .slot .sd i.on { opacity:1; }
  .slot.hit { animation:slotHit .42s cubic-bezier(.2,1.7,.4,1); }
  @keyframes slotHit { 0%{transform:scale(1)} 22%{transform:scale(1.45); filter:brightness(2.6)}
    100%{transform:scale(1); filter:brightness(1)} }
  .slot.born { animation:slotBorn .55s ease-out; }
  @keyframes slotBorn { 0%{transform:scale(0) rotate(-25deg); opacity:0}
    65%{transform:scale(1.35) rotate(6deg)} 100%{transform:scale(1) rotate(0)} }

  /* ---------- 属性ゲージ ---------- */
  #elArea { margin-top:11px; }
  .elg { display:flex; align-items:center; gap:8px; height:34px; padding:0 4px;
    border-radius:9px; }
  .elg.near { background:rgba(255,215,106,.14); box-shadow:0 0 0 2px rgba(255,215,106,.55) inset;
    animation:nearPulse 1s infinite; }
  @keyframes nearPulse { 0%,100%{filter:brightness(1)} 50%{filter:brightness(1.5)} }
  .elg .ei { font-size:21px; width:26px; text-align:center; flex:none; }
  .elg .dots { display:flex; align-items:center; gap:4px; flex:none; }
  .elg .dots i { width:16px; height:16px; border-radius:50%; display:block;
    border:2px solid currentColor; opacity:.32; }
  .elg .dots i.on { background:currentColor; opacity:1; box-shadow:0 0 7px currentColor; }
  .elg .dots i.pop { animation:dotPop .6s cubic-bezier(.2,1.8,.4,1); }
  @keyframes dotPop { 0%{transform:scale(0); box-shadow:0 0 0 0 currentColor}
    45%{transform:scale(3.1); box-shadow:0 0 34px 14px currentColor; filter:brightness(2.4)}
    100%{transform:scale(1)} }
  .elg.hit { animation:elgHit .6s ease-out; }
  @keyframes elgHit { 0%{filter:brightness(1)} 30%{filter:brightness(2.2)} 100%{filter:brightness(1)} }
  .elg .sep { width:3px; height:18px; background:currentColor; opacity:.6; border-radius:2px; }
  .elg .st { font-size:11.5px; margin-left:4px; line-height:1.25; overflow:hidden; }
  .elg .st b { font-size:13px; }
  .elg .st .nx { color:#ffe27a; font-weight:bold; font-size:15px; }

  #fly { pointer-events:none; }
  .flyCard { position:absolute; border-radius:14px; border:2px solid; display:flex;
    align-items:center; justify-content:center; font-size:30px;
    transition:transform .27s cubic-bezier(.5,-0.25,.6,1); }

  /* ---------- MAX 演出 ---------- */
  /* すべての告知は この1枚に 順番に出す（重なりを構造的になくす） */
  #note { left:0; right:0; top:300px; text-align:center; pointer-events:none;
    display:none; z-index:56; }
  #note.show { display:block; }
  #note .nBox { display:inline-block; max-width:406px; padding:13px 24px; border-radius:16px;
    border:3px solid; animation:maxIn .4s cubic-bezier(.2,1.7,.4,1); }
  #note .nW { font-size:11px; letter-spacing:3px; }
  #note .nI { font-size:38px; line-height:1.05; }
  /* 魚のパワーアップは その魚の 絵を 出す */
  #note .nP { position:relative; display:inline-block; margin:2px 0 1px; }
  #note .nP img { height:52px; max-width:180px; object-fit:contain;
    filter:drop-shadow(0 0 10px rgba(255,90,90,.85)) saturate(1.15); }
  #note .nP b { position:absolute; right:-6px; bottom:-4px; font-size:24px;
    text-shadow:0 0 6px #000; }
  #note .nT { font-size:21px; font-weight:bold; margin-top:2px; color:#fff;
    text-shadow:0 2px 8px rgba(0,0,0,.85); line-height:1.3; }
  #note .nS { font-size:12.5px; margin-top:3px; opacity:.92; }
  #note .nB { font-size:16px; font-weight:bold; margin-top:5px; }
  #note.syn .nBox { background:linear-gradient(135deg,#0f5f9e,#31b6e6); border-color:#ffd76a;
    box-shadow:0 0 34px rgba(80,190,255,.7), 0 0 18px rgba(255,215,106,.6); }
  #note.syn .nS { color:#dff2ff; } #note.syn .nB { color:#fff2b0; }
  #note.max .nBox { background:linear-gradient(135deg,#7a5a10,#d8a52c); border-color:#fff3c4;
    box-shadow:0 0 36px rgba(255,200,80,.85); }
  #note.max .nB { color:#fff6d0; }
  #note.fish .nBox { background:linear-gradient(135deg,#5a0d16,#8c1420); border-color:#ff5c5c;
    box-shadow:0 0 32px rgba(255,60,60,.6), inset 0 0 24px rgba(0,0,0,.55); }
  #note.mega .nBox { background:linear-gradient(135deg,#3a0030,#7a0a4a); border-color:#ff3ca0;
    box-shadow:0 0 42px rgba(255,60,160,.85), inset 0 0 26px rgba(0,0,0,.6);
    animation:maxIn .4s cubic-bezier(.2,1.7,.4,1), megaShake .11s 6; }
  #note.trade .nBox { background:linear-gradient(135deg,#2a0000,#7a0a0a); border-color:#ff2020;
    border-width:4px; padding:16px 30px;
    box-shadow:0 0 48px rgba(255,30,30,.9), inset 0 0 30px rgba(0,0,0,.7); }
  #note.fish .nW,#note.mega .nW,#note.trade .nW { color:#ffb0b0; }
  #note.fish .nS,#note.mega .nS,#note.trade .nS { color:#ffd0d0; }
  #note.fish .nB,#note.mega .nB,#note.trade .nB { color:#ffe27a; }
  @keyframes megaShake { 0%,100%{transform:translateX(0)} 50%{transform:translateX(4px)} }
  #note.info .nBox { background:linear-gradient(135deg,#0b3a52,#1c6f8c); border-color:#7fe0ff;
    box-shadow:0 0 30px rgba(90,210,255,.6); }
  #note.info .nS { color:#d6f2ff; } #note.info .nB { color:#ffe27a; }
  /* チュートリアル */
  #tut { display:none; text-align:center; pointer-events:none; z-index:57; }
  #tut.show { display:block; }
  #tut .tMsg { display:inline-block; padding:10px 18px; border-radius:13px; font-size:15px;
    font-weight:bold; background:#fffbe8; color:#3a2a00; border:2px solid #ffd76a;
    box-shadow:0 0 22px rgba(255,215,106,.8); }

/* ============================================================
   4. 海の形（深さ t=0..1 ごとの 左右の端）
   ============================================================ */
function nb(k, t, wide){
  const last = k[k.length-1][0];
  if (t < 0 || t > last) return null;
  let a = k[0];
  for (let i=1;i<k.length;i++){
    const b = k[i];
    if (t <= b[0]){
      const span = b[0]-a[0], u = span>0 ? (t-a[0])/span : 1;
      let xl = a[1] + (b[1]-a[1])*u, xr = a[2] + (b[2]-a[2])*u;
      if (wide){ xl = 0.5-(0.5-xl)*1.3; xr = 0.5+(xr-0.5)*1.3; }
      return [clamp(xl,0,1), clamp(xr,0,1)];
    }
    a = b;
  }
  return null;
}
function bounds(t){
  const r = nb(st.k, t, lv('umi')>0);
  return r ? [WATER_L + r[0]*SEA_W, WATER_L + r[1]*SEA_W] : null;
}
const maxT = ()=>st.k[st.k.length-1][0];
const yToT = y => (y - WATER_T) / WATER_H;
const tToY = t => WATER_T + t * WATER_H;
function inSea(x, y){
  const b = bounds(yToT(y));
  return !!b && x >= b[0]+8 && x <= b[1]-8;
}
function seaArea(k, wide){
  let a = 0;
  for (let t=0; t<1; t+=0.01){ const b = nb(k,t,wide); if (b) a += (b[1]-b[0])*0.01; }
  return a;
}
function floorT(x){
  const last = maxT();
  for (let t=0; t<=last; t+=0.012){
    const b = bounds(t);
    if (!b || x < b[0]+6 || x > b[1]-6) return Math.max(0, t-0.012);
  }
  return last;
}

/* --- 海の形は 毎プレイ ちがう。ステージの形を たねにして
       ふくらませ・しぼり・左右ずらし・波うち を ランダムに かける --- */
function varyShape(k){
  const out = k.map(a=>a.slice()), last = out[out.length-1][0];
  const swell  = 0.55 + Math.random()*1.05;      // でこぼこの ふかさ
  const shift  = (Math.random()-0.5)*0.20;       // 全体の 左右ずれ
  const squash = 0.70 + Math.random()*0.55;      // 全体の ふとさ
  const ph = Math.random()*6.28, freq = 1 + ((Math.random()*3)|0);
  for (const a of out){
    const t = last>0 ? a[0]/last : 0;
    const c = (a[1]+a[2])/2, hw = (a[2]-a[1])/2;
    const nc = c + shift + Math.sin(ph + t*6.28*freq)*0.09*swell;
    let  nh = hw * squash * (1 + Math.sin(ph*1.7 + t*6.28*freq)*0.28*swell);
    nh = Math.max(0.058, nh);
    a[1] = clamp(nc-nh, 0, 1); a[2] = clamp(nc+nh, 0, 1);
    if (a[2]-a[1] < 0.11){ const m = clamp((a[1]+a[2])/2, 0.056, 0.944);
                           a[1] = m-0.055; a[2] = m+0.055; }
  }
  const dz = 0.86 + Math.random()*0.28;          // 浅い海 / 深い海
  for (const a of out) a[0] = Math.min(1, a[0]*dz);
  return out;
}
/* --- 3投ごとに 深いところの 形だけが 動く --- */
let seaMorph = null;
function startMorph(){
  const from = st.k.map(a=>a.slice()), to = st.k.map(a=>a.slice());
  const last = to[to.length-1][0];
  const mode = (Math.random()*3)|0;              // 0 ひろがる / 1 せまくなる / 2 よこにずれる
  const amt  = 0.11 + Math.random()*0.15, sgn = Math.random()<0.5 ? -1 : 1;
  for (const a of to){
    const t = last>0 ? a[0]/last : 0;
    if (t <= 0.45) continue;
    const u = (t-0.45)/0.55;
    let c = (a[1]+a[2])/2, hw = (a[2]-a[1])/2;
    if (mode===0)      hw = hw + amt*u;
    else if (mode===1) hw = Math.max(0.058, hw - amt*u);
    else               c  = c + sgn*amt*u;
    a[1] = clamp(c-hw, 0, 1); a[2] = clamp(c+hw, 0, 1);
    if (a[2]-a[1] < 0.11){ const m = clamp((a[1]+a[2])/2, 0.056, 0.944);
                           a[1] = m-0.055; a[2] = m+0.055; }
  }
  seaMorph = { from, to, t:0, dur:0.8 };
  seaGlow = 1.6;
  notify({ kind:'info', ic:'🌊', title:'海の形が かわった！',
    sub: mode===0 ? '深いところが ひろがった' : mode===1 ? '深いところが せまくなった'
                                              : '深いところが よこに ずれた',
    snd: sfx.slot, shake:6, dur:1400 });
}
let seaGlow = 0;
function stepMorph(dt){
  if (seaGlow > 0) seaGlow = Math.max(0, seaGlow - dt);
  if (!seaMorph) return;
  seaMorph.t += dt;
  const u = clamp(seaMorph.t / seaMorph.dur, 0, 1), e = u*u*(3-2*u);
  st.k = seaMorph.from.map((a,i)=>{
    const b = seaMorph.to[i];
    return [a[0], a[1]+(b[1]-a[1])*e, a[2]+(b[2]-a[2])*e];
  });
  if (u >= 1){
    st.k = seaMorph.to; seaMorph = null;
    st.stageArea = seaArea(st.k, lv('umi')>0);
    buildObjs();
    for (const f of fishPool) if (f.alive) pushIntoSea(f);
    for (const c of chestPool) if (c.alive) pushIntoSea(c);
  }
}
function pushIntoSea(o){
  const b = bounds(yToT(o.y));
  if (b && b[1]-b[0] > 26){ o.x = clamp(o.x, b[0]+12, b[1]-12); return; }
  for (let t = maxT()*0.5, i=0; i<20; i++, t = Math.random()*maxT()){
    const bb = bounds(t);
    if (bb && bb[1]-bb[0] > 30){
      o.y = tToY(t); if (o.homeY !== undefined) o.homeY = o.y;
      o.x = bb[0]+14 + Math.random()*(bb[1]-bb[0]-28); return;
    }
  }
}

/* ============================================================
   4.5 海の中の オブジェクト
   かくれ岩（solid）＝ うしろの魚は ワッカでも 帯でも 釣れない。
                      ただし「引きよせ」だけは 岩ごしに とどく。
   かざり        ＝ 見た目だけ。海藻・サンゴ・雲
   ============================================================ */
/* 岩と かざりは 絵をそのまま 貼るので、たて幅は 絵の比率から 決める。
   むりに 引きのばすと 岩に 見えなくなるため */
const OBJ_SET = {
  shore : { rock:'rockC', rw:78, deco:'weed',  dw:30, nr:5, nd:8 },
  abyss : { rock:'rockB', rw:92, deco:'coral', dw:34, nr:6, nd:5 },
  cloud : { rock:'cloud', rw:104,deco:'cloud', dw:46, nr:5, nd:7 },
  dragon: { rock:'rockB', rw:84, deco:'weed',  dw:28, nr:6, nd:4 },
  twin  : { rock:'rockA', rw:82, deco:'coral', dw:32, nr:5, nd:6 },
  ruin  : { rock:'rockC', rw:88, deco:'coral', dw:30, nr:6, nd:5 },
  moon  : { rock:'rockA', rw:84, deco:'coral', dw:34, nr:5, nd:7 },
};
function buildObjs(){
  st.objs = [];
  const K = OBJ_SET[st.stage.id] || OBJ_SET.shore;
  const szK = [0,1,2,3,4].some(r=>st.fmod.rock[r]) ? 1.3 : 1;      // 岩かくれを おぼえたら 岩も大きく
  const nr  = K.nr + (st.fmod.murky ? 3 : 0);                      // にごったら 岩も ふえる
  const maxArea = st.stageArea * SEA_W * WATER_H * 0.18;           // 海の18%まで
  const rAsp = sprAspect(K.rock), dAsp = sprAspect(K.deco);
  let used = 0;
  for (let made=0, guard=0; made<nr && guard<220; guard++){
    const sc = (0.78 + Math.random()*0.5) * szK;
    const w = K.rw*sc, h = w*rAsp;
    const t = 0.14 + Math.random()*Math.max(0.01, maxT()-0.22);
    const y = tToY(t), b = bounds(t);
    if (!b || b[1]-b[0] < w + 72) continue;
    const x = b[0] + w/2 + 26 + Math.random()*(b[1]-b[0]-w-52);
    if (st.objs.some(o=>o.solid && Math.abs(o.x-x) < (o.w+w)*0.58
                                && Math.abs(o.y-y) < (o.h+h)*0.58)) continue;
    const a = Math.PI*w*h/4;
    if (used + a > maxArea) break;
    used += a; made++;
    st.objs.push({ x, y, w, h, solid:1, spr:K.rock, sd:Math.random()*6.28 });
  }
  for (let i=0;i<K.nd;i++){                                        // かざり＝海底ぞい
    const t = maxT()*(0.55 + Math.random()*0.43), b = bounds(t);
    if (!b || b[1]-b[0] < 40) continue;
    const w = K.dw*(0.8+Math.random()*0.55), h = w*dAsp;
    st.objs.push({ x:b[0]+12+Math.random()*(b[1]-b[0]-24), y:tToY(t)-h*0.28,
                   w, h, solid:0, spr:K.deco, sd:Math.random()*6.28 });
  }
}
/* いちばん近い 岩（range内） */
function nearestRock(x, y, range){
  let best = null, bd = range*range;
  for (const o of (st.objs||[])){
    if (!o.solid) continue;
    const d = (o.x-x)*(o.x-x) + (o.y-y)*(o.y-y);
    if (d < bd){ bd = d; best = o; }
  }
  return best;
}
/* この座標は 岩のうしろか？ */
function hiddenBy(x, y){
  const O = st.objs; if (!O) return null;
  for (const o of O){
    if (!o.solid) continue;
    const dx = (x-o.x)/(o.w*0.5), dy = (y-o.y)/(o.h*0.5);
    if (dx*dx + dy*dy <= 1) return o;
  }
  return null;
}

function newFmod(){
  return { fsp:[1,1,1,1,1], det:[1,1,1,1,1], lag:[1,1,1,1,1], mult:[1,1,1,1,1],
           nos:[0,0,0,0,0], deep:[0,0,0,0,0], tele:[0,0,0,0,0], clone:[0,0,0,0,0],
           king:[0,0,0,0,0], rock:[0,0,0,0,0], blink:[0,0,0,0,0],
           allFsp:1, watch:0, murky:0, done:[[],[],[],[],[]] };
}
function doFishUp(){
  const m = st.fmod;
  // まだ強くなっていないランクを優先。1ランクにつき最大3回まで
  let cand = [0,1,2,3,4].filter(r=>m.done[r].length===0);
  if (!cand.length) cand = [0,1,2,3,4].filter(r=>m.done[r].length < 3);
  if (!cand.length) return;
  const r = cand[(Math.random()*cand.length)|0];
  const ok = u => (u.min===undefined || r >= u.min) && !m.done[r].includes(u.k);
  const isRare = r >= 2 && Math.random() < 0.30;
  let pool = FISH_UPS.filter(u=>u.rare===(isRare?1:0) && ok(u));
  if (!pool.length) pool = FISH_UPS.filter(ok);
  if (!pool.length) return;
  const u = pool[(Math.random()*pool.length)|0];
  const mega = !!u.rare;
  u.ap(m, r, r===0 ? 0.5 : 1);            // イワシは 効果半分
  m.done[r].push(u.k);
  if (u.k === 'rock') buildObjs();         // 岩かくれ＝岩が 大きくなる
  m.mult[r] = Math.min(FISH_MULT_CAP, m.mult[r] * FISH_MULT);   // 強い魚ほど おいしい（上限つき）
  notify({ kind: mega ? 'mega' : 'fish', w:'さかなの ぎゃくしゅう',
    img: FISH_SPR[r], ic: u.ic, title: u.t(r), sub: u.s(r),
    big: `💰 そのかわり ${RANKS[r].n}の 点数 ${FISH_MULT}ばい！`,
    snd: ()=>sfx.danger(mega ? 3 : 1), shake: mega ? 9 : 5,
    dur: mega ? 2300 : 2000 });
}
function doFishTrade(){
  const m = st.fmod;
  const pool = FISH_TRADES.filter(x=>!m.tdone || !m.tdone.includes(x.t));
  const u = pool.length ? pool[(Math.random()*pool.length)|0] : null;
  if (!u) return;
  m.tdone = (m.tdone||[]).concat(u.t);
  u.ap(m);
  if (m.murky) buildObjs();                // にごり＝岩も ふえる
  notify({ kind:'trade', w:'魚の かけひきタイム', ic:u.ic, title:u.t, sub:u.d,
    snd: ()=>sfx.danger(3), shake:11, dur:2300 });
}
function checkFishUp(){
  if (!st || st.castsLeft <= 1) return;          // 最終投では もう強くならない
  const want = Math.min(FISH_UP_MAX, Math.floor(st.puCount/3));
  while (st.fishUpDone < want){ st.fishUpDone++; doFishUp(); }
  const wt = Math.min(2, Math.floor(st.fishUpDone/3));
  while (st.fishTradeDone < wt){ st.fishTradeDone++; doFishTrade(); }
}

let actx = null, muted = false;
function audioUnlock(){ if (actx) return;
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ actx=null; } }
function snd(freq, dur, type, vol, slideTo){
  if (muted || !actx) return;
  const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol || 0.14, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + 0.03);
}

function recompute(){
  const s = st, before = new Set(s.syn);
  s.syn = new Set(SYNS.filter(x=>synHas(s.tag,x)).map(x=>x.id));
  const on = id=>s.syn.has(id);
  const fireM  = on('fire6') ? 2.10 : on('fire3') ? 1.40 : 1;
  const windA  = on('wind6') ? 60   : on('wind3') ? 34   : 0;
  const waterR = on('water6') ? 26  : on('water3') ? 9    : 0;
  const earthC = on('earth6') ? 3 : on('earth3') ? 3 : 0;
  const allM   = on('all3') ? 1.35 : on('all2') ? 1.13 : 1;

  s.dual = lv('dual') > 0;
  s.stageArea = seaArea(s.k, lv('umi')>0);

  let r = BASE_R + lv('radius')*20 + windA + s.pend.ring
        + (lv('net') ? 45 : 0) + (lv('ring') ? 70 : 0) + (lv('scatter') ? 20 : 0);
  r *= (lv('focus') ? 0.72 : 1) * allM;
  s.radius = r;

  const bm = on('wind6') ? 1.7 : 1;
  s.hlineH = lv('hline') ? (16 + 16*(lv('hline')-1)) * bm : 0;
  s.vlineW = lv('vline') ? (16 + 16*(lv('vline')-1)) * bm : 0;
  s.xlineW = lv('xline') ? (17 + 15*(lv('xline')-1)) * bm : 0;

  s.pull = Math.min(PULL_CAP,
    lv('pull') + lv('pullBig')*2 + (on('wind6') ? 1 : 0) + s.pend.pull);

  const ak = Math.max(0.25, s.stageArea);
  s.regen = lv('desper') ? 0
          : Math.round((FISH_REGEN + lv('fish')*3 + (lv('fishBig')?10:0) + waterR)
                       * allM * (lv('chibi') ? 1.8 : 1) * ak);

  s.chestTarget = Math.min(16, Math.round((BASE_CHEST + lv('chest') + earthC + (lv('wildBox')?3:0))
                  * (lv('chest3') ? 3 : 1) * allM));
  s.chestTimes = 1 + lv('lucky') + (on('earth6') ? 1 : 0) + (lv('wildBox') ? 1 : 0);
  s.coinMult   = (earthC ? 2.5 : 1) * (on('earth6') ? 1.2 : 1);

  // トレードオフのスコア倍率は 3枠ぶん掛け合わさると ×7 を超えるので合計に上限
  let tMul = 1;
  if (lv('focus'))  tMul *= 1.9;
  if (lv('desper')) tMul *= 2.2;
  if (lv('chibi'))  tMul *= 1.5;
  if (lv('wild'))   tMul *= 1.8;
  if (lv('quick'))  tMul *= 1.7;
  s.tradeMul = Math.min(3.0, tMul);
  s.scoreMult = (1 + lv('score')*0.18) * fireM * allM * (1 + s.pend.scoreAdd)
              * (lv('rich')?2:1) * s.tradeMul;

  s.rankP = lv('rank')*0.12 + lv('deep')*0.05 + (on('earth6') ? 0.40 : 0) + (lv('sink') ? 0.20 : 0);
  s.fishScale = ak * (lv('chibi') ? 1.8 : 1);
  s.cursorSpd = CURSOR_SPD * (lv('quick') ? 1.8 : 1);
  s.dropSpd   = DROP_SPD   * (lv('sink')  ? 1.5 : 1);
  return [...s.syn].filter(id=>!before.has(id));
}
function applySynBurst(ids){
  for (const id of ids){
    if (id === 'water3') addFish(60);
    if (id === 'water6') addFish(180);
  }
}
// 初回を¥30にして序盤を底上げしつつ、カーブは1.8で 総回数を12〜14に絞る
function puCost(){ return Math.round(30 * Math.pow(1.8, st.puCount) * (lv('pricey') ? 1.6 : 1)); }
const cardCost = c => c.t==='x' ? Math.round(puCost()*0.55) : puCost();

/* ============================================================
   9. スポーン
   ============================================================ */
function pickRank(){
  let w = [40,26,18,11,5];
  if (lv('deep')) { w[3] += 7*lv('deep'); w[4] += 5*lv('deep'); }
  if (lv('sink')) { w[3] += 9; w[4] += 7; }
  w[st.market.star] *= 0.55; w[st.market.dull] *= 1.8;
  for (let i=0;i<5;i++) if (st.fmod.king[i]) w[i] *= 1.6;
  const tot = w.reduce((a,b)=>a+b,0);
  let x = Math.random()*tot, k = 0;
  for (; k<5; k++){ x -= w[k]; if (x<=0) break; }
  k = Math.min(4,k);
  if (Math.random() < st.rankP) k = Math.min(4, k+1);
  if (lv('chibi')) k = Math.max(0, k-1);
  return k;
}

function spawnFishAt(rank, cx, cy, spread){
  const f = fishPool.find(o=>!o.alive); if (!f) return null;
  const R = RANKS[rank];
  let x = cx + (Math.random()-0.5)*spread, y = cy + (Math.random()-0.5)*spread*0.55;
  y = clamp(y, WATER_T+14, WATER_B-14);
  const b = bounds(yToT(y));
  if (!b || b[1]-b[0] < 26) return null;
  x = clamp(x, b[0]+12, b[1]-12);
  f.alive=true; f.boss=false; f.rare=false; f.rank=rank; f.x=x; f.y=y; f.homeY=y;
  f.dir = Math.random()<0.5 ? -1 : 1;
  f.spd = R.sp * (0.75 + Math.random()*0.5);
  f.wob = Math.random()*6.28; f.tmr = Math.random()*2; f.burst = 0; f.rest = 0;
  f.caught=false; f.byBand=false; f.byCircle=false; f.miss=0; f.ty0=null; f.grow=0;
  f.alert=0; f.teled=0; f.spread=0; f.clone=0;
  return f;
}
function spawnSchool(limit, forceRank, atX, atY){
  const r = (forceRank !== undefined) ? forceRank : pickRank();
  const M = st.fmod;
  const schoolP = (lv('scatter') || M.nos[r]) ? 0 : RANKS[r].school;
  let n = (schoolP>0 && Math.random()<schoolP) ? 2+((Math.random()*4)|0) : 1;
  n = Math.min(n, limit);
  let cy, cx;
  if (atY !== undefined){ cy = atY; cx = atX; }
  else {
    let d = DEPTH_PREF[r] * maxT() + (Math.random()-0.5)*0.24;
    if (M.deep[r]) d = Math.min(maxT()-0.05, d + 0.18*maxT());   // 深くもぐった
    cy = tToY(clamp(d, 0.03, maxT()-0.03));
    const b = bounds(yToT(cy)); if (!b) return 0;
    cx = b[0] + 16 + Math.random()*Math.max(1, b[1]-b[0]-32);
  }
  let made = 0;
  for (let i=0;i<n;i++) if (spawnFishAt(r, cx, cy, n>1 ? 58 : 0)) made++;
  if (M.clone[r] && made){                                       // 分身（点数は半分）
    const g = spawnFishAt(r, cx, cy, 46);
    if (g){ g.clone = 1; made++; }
  }
  return made;
}
const aliveFish = ()=>fishPool.reduce((a,f)=>a+(f.alive&&!f.boss&&!f.rare?1:0),0);
/* 魚の密度が どのステージでも同じになるよう 面積に比例させる。
   （0.45+0.55×面積 では せまい海が2倍以上 濃くなり、
     大きなワッカで 海ごと さらう形になっていた） */
const areaK   = ()=>Math.max(0.25, st.stageArea);
const fishCap = ()=>Math.round(FISH_CAP * areaK());
function addFish(n, atX, atY){
  let room = Math.min(n, fishCap() - aliveFish()), guard = 0;
  while (room > 0 && guard++ < 600){
    const made = spawnSchool(room, undefined, atX, atY);
    if (!made) { if (guard > 60) break; continue; }
    room -= made;
  }
}

/* ヌシ：とにかく速い。ただし ときどき息つぎで止まる（そこが唯一のスキ） */
function spawnBoss(){
  const f = fishPool.find(o=>!o.alive); if (!f) return;
  const B = st.bossType;
  const t = clamp(0.55*maxT(), 0.1, maxT()-0.08), b = bounds(t);
  f.alive=true; f.boss=true; f.rare=false; f.rank=4;
  f.x = b ? (b[0]+b[1])/2 : W/2; f.y = tToY(t); f.homeY = f.y;
  f.cx = f.x; f.ang = 0;
  f.dir = Math.random()<0.5?-1:1; f.spd = B.spd; f.wob=0; f.tmr=2.6; f.rest=0; f.burst=0;
  f.caught=false; f.byBand=false; f.byCircle=false; f.miss=0; f.ty0=null; f.grow=0;
  st.bossSeen = 1;
  banner(B.ic + ' ' + B.nm, '休んで 光った すきを ねらえ');
  sfx.boss();
}
const bossFish = ()=>fishPool.find(f=>f.alive && f.boss);

/* レア魚：七色に光る。速いが 規則のある動きなので 先まわりできる（1投かぎり） */
function spawnRare(n){
  const R = st.rareType;
  for (let i=0;i<n;i++){
    const f = fishPool.find(o=>!o.alive); if (!f) return;
    const t = clamp(0.22 + Math.random()*0.5, 0.08, maxT()-0.06);
    const b = bounds(t); if (!b) continue;
    f.alive=true; f.boss=false; f.rare=true; f.rank=4;
    f.homeY = tToY(t); f.y = f.homeY; f.x = b[0]+20+Math.random()*(b[1]-b[0]-40);
    f.dir = Math.random()<0.5?-1:1; f.spd = R.spd; f.wob = Math.random()*6.28;
    f.amp = 26 + Math.random()*22;
    f.cx = (b[0]+b[1])/2; f.rad = Math.min(120, (b[1]-b[0])*0.32); f.ang = Math.random()*6.28;
    f.puff = 0; f.tmr=0; f.burst=0; f.rest=0;
    f.caught=false; f.byBand=false; f.byCircle=false; f.miss=0; f.ty0=null; f.grow=0;
  }
  banner('🌈 ' + R.nm + ' とうじょう！', RARE_PRIZE);
  sfx.rare();
}

function spawnChest(){
  const c = chestPool.find(o=>!o.alive); if (!c) return;
  const t = 0.08 + Math.random()*(maxT()-0.14), b = bounds(t);
  if (!b || b[1]-b[0] < 40) return;
  c.alive=true; c.caught=false; c.grow=0; c.ty0=null;
  c.x = b[0]+20 + Math.random()*(b[1]-b[0]-40); c.y = tToY(t);
  c.vx = (Math.random()<0.5?-1:1)*(45+Math.random()*26);
  c.vy = (Math.random()-0.5)*40;
  c.tmr = 1.0 + Math.random()*1.2; c.warn = 0; c.dash = 0;
  c.kind = ['coin','ticket','swarm','storm','flag','coin'][(Math.random()*6)|0];
}

/* かけひき券。枠が埋まっていれば お金に変わる（ムダにならない） */
function gainTicket(){
  if (usedIn('t') + st.tickets < st.tradeMax){ st.tickets++; updateBtns(); return '🎫 かけひき券！'; }
  // あまった券は お金に。ただし値段カーブ（指数）に連動させると
  // 終盤に1枚数百万円になってしまうので、小判と同じ頭打ちの式にする
  const g = Math.round(200 * Math.min(st.scoreMult,5) * st.coinMult);
  st.money += g; return '¥'+g;
}

function flushPendSpawns(){
  if (st.pend.fish > 0){
    const t = 0.15 + Math.random()*(maxT()-0.3), b = bounds(t);
    if (b) addFish(st.pend.fish, b[0]+40+Math.random()*Math.max(1,b[1]-b[0]-80), tToY(t));
    else addFish(st.pend.fish);
    st.pend.fish = 0;
  }
  while (st.pend.chest > 0){ spawnChest(); st.pend.chest--; }
  recompute();
}

/* その投かぎりのイベント。1投につき1回だけ走らせる。
   （パワーアップを買うたびに startCast が呼ばれるので、
     ここを分けないと 魚群も大漁タイムも 何度でも湧いてしまう） */
function runCastEvents(n){
  const ev = CHANCE[n];
  if (RARE_CASTS.includes(n)) spawnRare(2);
  if (ev === 'school'){
    const t = 0.2 + Math.random()*(maxT()-0.4), b = bounds(t);
    if (b) addFish(46, b[0]+40+Math.random()*Math.max(1,b[1]-b[0]-80), tToY(t));
    banner('魚群 チャンス！', 'ここを ねらえ'); sfx.chest();
  } else if (ev === 'boss'){
    if (!st.bossGot && !bossFish()) spawnBoss();
  } else if (ev === 'rush'){
    st.pend.ring = Math.min(PEND_CAP.ring, st.pend.ring + 40);
    const base = aliveFish();
    for (let i=0;i<3;i++){
      const t = 0.2 + Math.random()*(maxT()-0.35), b = bounds(t);
      if (b) addFish(Math.round(base*0.5)+30,
                     b[0]+40+Math.random()*Math.max(1,b[1]-b[0]-80), tToY(t));
    }
    banner('さいごの 大漁タイム！', ''); sfx.boss();
  }
}
/* 毎回やってよい ならし（何度呼ばれても増えつづけない） */
function topUpOcean(){
  let m = aliveFish();
  if (m < FISH_FLOOR){ addFish(FISH_FLOOR-m); banner('潮が かわった','魚が もどってきた'); }
  let ch = chestPool.reduce((a,c)=>a+(c.alive?1:0),0);
  while (ch < st.chestTarget){ spawnChest(); ch++; }
  flushPendSpawns();
}

/* ============================================================
   10. ルアー・入力
   ============================================================ */
let cursor = { x:W/2, dir:1 };
let lure   = { active:false, x:0, y:0, dir:1, vk:1, laps:0 };
let reel   = { t:0, dur:1.15, fish:[], chests:[], from:0, tallied:true, played:0 };
let held = false, resultTxt = null;

/* 投の開始。かけひきタイムなら先にそれを出す */
function beginCast(){
  const n = castNo();
  // かけひきタイムは 自動では開かない。券をためて 自分でボタンを押す
  if (!st.evtDone[n]){ st.evtDone[n] = 1; runCastEvents(n); }
  startCast();
}
function startCast(){
  phase='aim'; lure.active=false;
  const b = bounds(0) || [WATER_L, WATER_R];
  cursor.x = (b[0]+b[1])/2; cursor.dir = 1;
  topUpOcean(); updateBtns(); checkTut();
}
function onPress(){
  audioUnlock();
  if (phase==='result' && resultTxt && resultTxt.t>0.3){ resultTxt.t = 1.2; return; }
  if (phase !== 'aim') return;
  lure.active = true; lure.x = cursor.x; lure.y = WATER_T - 6;
  lure.dir = 1; lure.vk = 1; lure.laps = 0;     // 底と水面で 折り返しながら 上下する
  phase = 'drop'; held = true; sfx.drop();
}
function onRelease(){ if (phase==='drop' && held){ held=false; resolveCatch(); } }
function lurePoints(){
  if (!st.dual) return [{ x:lure.x, y:lure.y, band:true }];
  const b = bounds(yToT(lure.y)) || [WATER_L, WATER_R];
  return [ { x:clamp(lure.x-58, b[0]+10, b[1]-10), y:lure.y, band:true },
           { x:clamp(lure.x+58, b[0]+10, b[1]-10), y:lure.y, band:true } ];
}

/* ============================================================
   11. 捕獲
   ============================================================ */
const inCircle = (x,y,lx,ly)=>{ const dx=x-lx, dy=y-ly; return dx*dx+dy*dy <= st.radius*st.radius; };
function inBands(x,y,lx,ly){
  if (st.hlineH && Math.abs(y-ly) <= st.hlineH) return true;
  if (st.vlineW && Math.abs(x-lx) <= st.vlineW) return true;
  if (st.xlineW){
    const dx=x-lx, dy=y-ly, K=0.70710678;
    if (Math.abs((dx+dy)*K) <= st.xlineW || Math.abs((dx-dy)*K) <= st.xlineW) return true;
  }
  return false;
}
/* 点めつ：3秒 見える → 0.5秒 チカチカ予告 → 2秒 すがたが消えて つかまらない。
   0=ふつう 1=予告 2=消えている（この間は ワッカも 引きよせも 効かない） */
function blinkPh(f){
  if (f.boss || f.rare || !st.fmod.blink[f.rank]) return 0;
  const p = (performance.now()/1000 + f.wob) % 5.5;
  return p < 3 ? 0 : p < 3.5 ? 1 : 2;
}
function resolveCatch(){
  const pts = lurePoints(), got = [], gotC = [];
  for (const f of fishPool){
    if (!f.alive || f.caught || blinkPh(f)===2) continue;
    // ★岩の うしろの 魚には ワッカも 帯も とどかない（引きよせ だけは とどく）
    if (hiddenBy(f.x, f.y)){ f.miss = 0.9; continue; }
    for (const p of pts){
      const c = inCircle(f.x,f.y,p.x,p.y), b = p.band && inBands(f.x,f.y,p.x,p.y);
      if (c || b){ f.caught=true; f.byCircle=c; f.byBand=(!c&&b); f.tx=p.x; f.ty=p.y; got.push(f); break; }
    }
    if (!f.caught){
      const p = pts[0], d = Math.hypot(f.x-p.x, f.y-p.y);
      if (d < st.radius + 34){ f.miss = 0.9; f.dir = (f.x < p.x) ? -1 : 1; }
    }
  }
  if (st.pull > 0){
    const p = pts[0];
    fishPool.filter(f=>f.alive && !f.caught && blinkPh(f)!==2)
      .map(f=>({ f, d:Math.hypot(f.x-p.x, f.y-p.y) }))
      .filter(o=>o.d < st.radius + PULL_RING)
      .sort((a,b)=>a.d-b.d).slice(0, st.pull)
      .forEach(o=>{ o.f.caught=true; o.f.miss=0; o.f.tx=p.x; o.f.ty=p.y; got.push(o.f); });
  }
  for (const c of chestPool){
    if (!c.alive || c.caught) continue;
    for (const p of pts){
      if (inCircle(c.x,c.y,p.x,p.y) || (p.band && inBands(c.x,c.y,p.x,p.y))){
        c.caught=true; c.tx=p.x; c.ty=p.y; gotC.push(c); break;
      }
    }
  }
  releaseFlash(got);                       // ★離した その瞬間に手ごたえを返す
  reel = { t:0, dur:1.15, fish:got, chests:gotC, from:lure.y, tallied:false, played:0 };
  phase = 'reel';
}
/* その一投の点数を すぐ出す。離した瞬間の演出と 集計の両方で使う */
function catchValue(list){
  let sc = 0, mo = 0;
  for (const f of list){
    let v;
    if (f.boss)      v = Math.round(st.bossType.score * st.scoreMult);
    else if (f.rare) v = Math.round(st.rareType.score * st.scoreMult);
    else {
      let m = st.scoreMult * mkMul(f.rank) * st.fmod.mult[f.rank];  // 強い魚ほど おいしい
      if (lv('net') && f.rank >= 3) m *= 0.6;
      if (f.clone) m *= 0.5;                    // 分身は半分
      v = Math.round(RANKS[f.rank].sc * m);
    }
    sc += v;
    mo += Math.round(v * MONEY_RATE * (f.boss ? st.bossType.coin : 1));
  }
  const n = list.length;
  const combo = n>=25 ? 2.0 : n>=15 ? 1.6 : n>=8 ? 1.3 : n>=4 ? 1.15 : 1;
  return { sc:Math.round(sc*combo), mo:Math.round(mo*combo), combo };
}

/* 指を離した その瞬間に「会心の一投だったか」を返す。
   絶対値では 序盤に光らず終盤に光りっぱなしになるので
   これまでの1投あたり平均との比で判定する */
let zap = { t:0, lvl:0, x:0, y:0 };
function releaseFlash(list){
  const v = catchValue(list).sc;
  const base = st.castsDone > 0 ? Math.max(150, st.score / st.castsDone)
                                : Math.max(150, 240 * st.scoreMult);
  const r = v / base;
  zap.x = lure.x; zap.y = lure.y;
  if (r >= 4.5){ zap.t = 0.35; zap.lvl = 3; flashMode='white'; flash = Math.max(flash,.55);
                 shake = Math.max(shake,14); sfx.zap3(); }
  else if (r >= 2.5){ zap.t = 0.22; zap.lvl = 2; flashMode='white'; flash = Math.max(flash,.20); sfx.zap2(); }
  else if (r >= 1.4){ zap.t = 0.14; zap.lvl = 1; sfx.zap1(); }
}

function burstParticles(x, y, n, col){
  for (let i=0;i<n;i++){
    const p = parPool.find(o=>!o.alive); if (!p) return;
    const a = Math.random()*6.28, sp = 40 + Math.random()*190;
    p.alive=true; p.x=x; p.y=y; p.vx=Math.cos(a)*sp; p.vy=Math.sin(a)*sp-40;
    p.life=0.5+Math.random()*0.5; p.max=p.life; p.c=col; p.r=2+Math.random()*3;
  }
}

function tally(){
  let bossGot = false, rareN = 0;
  const cnt = reel.fish.length;
  for (const f of reel.fish){
    if (f.boss) bossGot = true;
    else if (f.rare) rareN++;
    else if (f.rank === 4) st.rec.tuna++;
  }
  const val = catchValue(reel.fish);
  let sc = val.sc, mo = val.mo;
  const combo = val.combo;
  const msgs = [], P = st.pend;
  st.rec.chest += reel.chests.length;
  for (const c of reel.chests){
    for (let i=0;i<st.chestTimes;i++){
      if (c.kind==='coin'){ const g = Math.round(180*Math.min(st.scoreMult,5)*st.coinMult);
                            mo += g; msgs.push('¥'+g); }
      else if (c.kind==='ticket'){ if (i===0) msgs.push(gainTicket()); }
      // ここから下は すべて 足し算（上限つき）
      else if (c.kind==='swarm'){ P.fish     = Math.min(PEND_CAP.fish,     P.fish+30);    msgs.push('つぎ 魚 +30'); }
      else if (c.kind==='storm'){ P.ring     = Math.min(PEND_CAP.ring,     P.ring+30);    msgs.push('つぎ ワッカ +30'); }
      else {                      P.scoreAdd = Math.min(PEND_CAP.scoreAdd, P.scoreAdd+0.5); msgs.push('つぎ スコア +0.5倍'); }
    }
  }
  if (bossGot){
    const B = st.bossType;
    st.bossGot = 1;
    st.legendBoost += B.legend;                 // 龍神だけ しばらく レジェンド率が上がる（確定ではない）
    for (let i=0;i<B.chest;i++) spawnChest();
    msgs.push(B.ic + ' ' + B.nm + ' ゲット！');
    if (B.chest) msgs.push('たからばこが わいた');
    flashGold(1); shake = 24; sfx.boss();
  }
  st.rec.rare += rareN;
  if (rareN){ sfx.rare(); msgs.push(gainTicket()); }   // レア魚は 1投につき 券1枚

  mo += DAILY_WAGE;                       // 今日の日当（スコアには入らない）
  st.score += sc; st.money += mo; st.earned += mo;
  st.castsDone++;
  st.rec.maxCatch = Math.max(st.rec.maxCatch, cnt);
  checkFishUp();
  st.rec.lastScore = sc;
  // 釣れた中身を ランクごとに まとめる（〇点 × 〇匹 = 〇点 と 出すため）
  const rowMap = new Map();
  for (const f of reel.fish){
    const key = f.boss ? 'B' : f.rare ? 'R' : ('F'+f.rank+(f.clone?'c':''));
    let o = rowMap.get(key);
    if (!o){
      o = { n:0, one:0, spr:'', nm:'', hot:0 };
      if (f.boss){ o.spr = BOSS_SPR[st.bossType.id]; o.nm = st.bossType.nm;
                   o.one = Math.round(st.bossType.score*st.scoreMult); o.hot = 2; }
      else if (f.rare){ o.spr = RARE_SPR[st.rareType.id]; o.nm = st.rareType.nm;
                   o.one = Math.round(st.rareType.score*st.scoreMult); o.hot = 1; }
      else { o.spr = FISH_SPR[f.rank]; o.nm = RANKS[f.rank].n + (f.clone ? '(分身)' : '');
             o.one = Math.round(nowScore(f.rank) * (f.clone ? 0.5 : 1)); }
      rowMap.set(key, o);
    }
    o.n++;
  }
  const rows = [...rowMap.values()].sort((a,b)=>(b.hot-a.hot)||(b.one*b.n-a.one*a.n));
  resultTxt = { n:cnt, sc, mo, combo, msgs, rows, t:0 };

  const lvl = cnt>=50 ? 4 : cnt>=25 ? 3 : cnt>=10 ? 2 : cnt>=4 ? 1 : 0;
  flashMode='white'; flash = Math.max(flash, [0,.12,.28,.5,.8][lvl]);
  shake = Math.max(shake, [0,3,8,16,26][lvl]);
  if (lvl>=2) sfx.big();
  const cx = lure.x, cy = WATER_T + 20;
  burstParticles(cx, cy, [0,8,20,42,70][lvl], '#ffe27a');
  if (reel.chests.length){ burstParticles(cx, cy, 26, '#ffd76a'); sfx.chest(); }
  if (rareN) burstParticles(cx, cy, 40, '#fff0a0');

  for (const f of reel.fish){ f.alive=false; f.caught=false; f.boss=false; f.rare=false; }
  for (const c of reel.chests) c.alive = false;
  // キラキラ魚は1投かぎり。釣られなかった分は 去っていく
  for (const f of fishPool) if (f.alive && f.rare) f.alive = false;

  st.pend.ring = 0; st.pend.scoreAdd = 0; st.pend.pull = 0;
  recompute();
  addFish(st.regen);
  // 3投ごとに 深いところの 形が うごく
  if (st.castsLeft > 1 && [4,7,10].includes(st.castsDone)) startMorph();
  updatePUBtn();
}

/* ============================================================
   12. 更新
   ============================================================ */
function moveFish(f, dt){
  const R = RANKS[f.rank];
  let sp = f.spd;
  if (f.miss > 0){ f.miss -= dt; sp *= 3.1; }

  if (f.rare){                                  // レア魚：速いが 規則のある動き
    const R = st.rareType;
    sp = R.spd;
    if (R.move === 'zig'){                      // ジグザグ：折れ点が多い
      f.wob += dt*5.2;
      f.y = f.homeY + (Math.asin(Math.sin(f.wob))/1.5708)*f.amp;
      f.tmr -= dt; if (f.tmr<=0){ f.tmr = 0.75+Math.random()*0.5; f.dir *= -1; }
    } else if (R.move === 'circle'){            // 円を えがいて まわる
      f.ang += dt * (sp/Math.max(30,f.rad));
      const nx = f.cx + Math.cos(f.ang)*f.rad;
      f.dir = nx > f.x ? 1 : -1;
      f.x = nx; f.y = f.homeY + Math.sin(f.ang)*f.rad*0.55;
      f.x += 0;                                  // 横移動は円で決まるので加算しない
      sp = 0;
    } else {                                    // ふくらむと おそい
      f.puff += dt*1.35;
      const inflate = (Math.sin(f.puff)+1)/2;    // 0=しぼむ 1=ふくらむ
      sp = R.spd * (0.18 + (1-inflate)*1.0);
      f.wob += dt*3.0; f.y = f.homeY + Math.sin(f.wob)*f.amp*0.6;
    }
  } else if (f.boss){
    const B = st.bossType;
    f.tmr -= dt;
    if (f.rest > 0){ f.rest -= dt; sp = 0; if (f.rest<=0){ f.tmr = 5 + Math.random()*4; f.warned = 0; } }
    else {
      sp = B.spd;
      if (B.move === 'eight'){                  // 8の字：ゆっくり→急加速
        f.wob += dt*1.5;
        f.y = f.homeY + Math.sin(f.wob*2)*30;
        sp = B.spd * (0.35 + Math.abs(Math.cos(f.wob))*1.5);
      } else if (B.move === 'wave'){            // 大きくうねる
        f.wob += dt*1.9; f.y = f.homeY + Math.sin(f.wob)*46;
      } else {                                  // まっすぐ超高速
        f.wob += dt*1.0; f.y = f.homeY + Math.sin(f.wob)*8;
      }
      if (f.tmr <= 0.8 && !f.warned){ f.warned = 1; sfx.rare(); }   // 0.8秒前に予告
      if (f.tmr <= 0) f.rest = 0.45;            // 息つぎ＝唯一のスキ
      else if (phase==='drop'){
        const d = Math.hypot(f.x-lure.x, f.y-lure.y);
        if (d < 165){
          sp = B.fsp;
          const rk = nearestRock(f.x, f.y, 230);   // ★ヌシは 岩に かくれたがる
          if (rk && Math.abs(rk.x-f.x) > 6){
            f.dir = rk.x > f.x ? 1 : -1;
            f.homeY += (rk.y - f.homeY) * Math.min(1, dt*2.4);
          } else f.dir = (f.x < lure.x) ? -1 : 1;
        }
      }
    }
  } else {
    switch (R.move){
      case 'wave':   f.wob += dt*3.2; f.y = f.homeY + Math.sin(f.wob)*7; break;
      case 'zigzag': f.wob += dt*4.4;
        f.y = f.homeY + (Math.asin(Math.sin(f.wob))/1.5708)*15; break;
      case 'swell':  f.wob += dt*1.15; f.y = f.homeY + Math.sin(f.wob)*34; sp *= .85; break;
      case 'rush':   f.wob += dt*2.2; f.y = f.homeY + Math.sin(f.wob)*5;
        f.tmr -= dt; if (f.tmr<=0){ f.tmr = 1.8+Math.random()*2.4; f.dir *= -1; } break;
      case 'dash':   f.wob += dt*1.6; f.y = f.homeY + Math.sin(f.wob)*4; f.tmr -= dt;
        if (f.burst>0){ f.burst -= dt; sp *= 3.2; if (f.burst<=0) f.tmr = .9+Math.random()*1.1; }
        else if (f.tmr<=0){ f.burst = .55; f.dir = Math.random()<.5?-1:1; }
        else sp *= .18;
        break;
    }
    // ★どの魚も逃げる。ただし「気づいてから逃げ出すまで」に ラグがある
    if (phase==='drop'){
      const M = st.fmod, wildK = lv('wild') ? 1.5 : 1;
      const det = R.det * M.det[f.rank] * wildK;
      const lag = R.lag * M.lag[f.rank];
      const d = Math.hypot(f.x-lure.x, f.y-lure.y);
      if (d < det) f.alert += dt; else f.alert = Math.max(0, f.alert - dt*1.6);
      if (f.alert >= lag){
        if (M.tele[f.rank] && !f.teled && d < 55){        // テレポート
          const tt = 0.1 + Math.random()*(maxT()-0.2), bb = bounds(tt);
          if (bb){ f.x = bb[0]+16+Math.random()*Math.max(1,bb[1]-bb[0]-32);
                   f.homeY = tToY(tt); f.y = f.homeY; f.teled = 1;
                   burstParticles(f.x, f.y, 6, '#b6f0ff'); }
        }
        sp = R.fsp * M.fsp[f.rank] * M.allFsp * wildK;
        const rk = M.rock[f.rank] ? nearestRock(f.x, f.y, 190) : null;
        if (rk && Math.abs(rk.x-f.x) > 5){       // 岩かくれ：岩へ にげこむ
          f.dir = rk.x > f.x ? 1 : -1;
          f.homeY += (rk.y - f.homeY) * Math.min(1, dt*2.2);
        } else {
          f.dir = (f.x < lure.x) ? -1 : 1;
          f.homeY += (f.homeY < lure.y ? -1 : 1) * sp * 0.42 * dt;
        }
        if (M.watch) f.spread = 1;                        // 見はり番：まわりに伝える
      }
    } else { f.alert = 0; f.teled = 0; f.spread = 0; }
  }

  f.x += f.dir * sp * dt;
  const b = bounds(yToT(f.y));
  if (b){
    if (f.x < b[0]+12){ f.x = b[0]+12; f.dir = 1; }
    if (f.x > b[1]-12){ f.x = b[1]-12; f.dir = -1; }
  }
  f.homeY = clamp(f.homeY, WATER_T+20, tToY(maxT())-20);
  f.y     = clamp(f.y,     WATER_T+12, tToY(maxT())-12);
  if (!inSea(f.x, f.y)){
    const bb = bounds(yToT(f.y));
    if (bb) f.x = clamp(f.x, bb[0]+12, bb[1]-12);
    else { f.homeY -= 26; f.y = f.homeY; }
  }
}

function moveChest(c, dt){
  const fast = lv('wildBox') ? 2.0 : 1;
  if (c.dash > 0){
    c.dash -= dt; c.x += c.vx*dt*7*fast; c.y += c.vy*dt*7*fast;
  } else if (c.warn > 0){
    c.warn -= dt;
    if (c.warn <= 0){ c.dash = 0.32;
      const a = Math.random()*6.28, sp = 70+Math.random()*50;
      c.vx = Math.cos(a)*sp; c.vy = Math.sin(a)*sp; }
  } else {
    c.tmr -= dt*fast;
    c.x += c.vx*dt*fast; c.y += c.vy*dt*0.55*fast;
    if (Math.random() < dt*0.9){ c.vx = (Math.random()<.5?-1:1)*(45+Math.random()*28);
                                 c.vy = (Math.random()-.5)*42; }
    if (c.tmr <= 0){ c.warn = 0.4; c.tmr = 1.0 + Math.random()*1.4; }
  }
  const b = bounds(yToT(c.y));
  if (b){ if (c.x < b[0]+18){ c.x = b[0]+18; c.vx = Math.abs(c.vx); }
          if (c.x > b[1]-18){ c.x = b[1]-18; c.vx = -Math.abs(c.vx); } }
  const bot = tToY(maxT());
  if (c.y < WATER_T+22){ c.y = WATER_T+22; c.vy = Math.abs(c.vy); }
  if (c.y > bot-22){ c.y = bot-22; c.vy = -Math.abs(c.vy); }
  if (!inSea(c.x, c.y)){
    const bb = bounds(yToT(c.y));
    if (bb) c.x = clamp(c.x, bb[0]+18, bb[1]-18);
    else { c.y -= 24; c.vy = Math.abs(c.vy); }
  }
}

function update(dt){
  stepMorph(dt);
  stepTalk(dt);
  const mk = st.scoreMult.toFixed(3) + '|' + st.pend.scoreAdd.toFixed(2);
  if (mk !== lastMultKey){ lastMultKey = mk; multFlash = 1; }
  if (multFlash > 0) multFlash = Math.max(0, multFlash - dt*0.5);
  if (shake > 0) shake = Math.max(0, shake - dt*60);
  if (flash > 0) flash = Math.max(0, flash - dt*2.6);
  if (zap.t > 0) zap.t = Math.max(0, zap.t - dt);
  if (Math.random() < dt*(st.stage.atmo==='ray'?26:14)){
    const b = bubPool.find(o=>!o.alive);
    if (b){ const t = maxT()-0.02, bb = bounds(t);
            if (bb){ b.alive=true; b.x=bb[0]+Math.random()*(bb[1]-bb[0]);
                     b.y=tToY(t); b.r=1.5+Math.random()*3; b.v=22+Math.random()*30; } }
  }
  for (const b of bubPool){ if(b.alive && (b.y -= b.v*dt) < WATER_T) b.alive=false; }
  for (const p of parPool){
    if (!p.alive) continue;
    p.life -= dt; if (p.life<=0){ p.alive=false; continue; }
    p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 210*dt; p.vx *= 0.985;
  }
  for (const f of fishPool){
    if (!f.alive) continue;
    if (f.grow < 1) f.grow = Math.min(1, f.grow + dt*3);
    if (f.caught){ const k = Math.min(1, reel.t/0.28);
                   f.x += (f.tx-f.x)*k*0.35; f.y += (f.ty-f.y)*k*0.35; continue; }
    moveFish(f, dt);
  }
  // 見はり番：逃げ出した魚が まわりの仲間にも 知らせる
  if (st.fmod.watch && phase==='drop'){
    for (const f of fishPool){
      if (!f.alive || f.boss || f.rare || !f.spread) continue;
      f.spread = 0;
      for (const g of fishPool){
        if (!g.alive || g===f || g.caught || g.boss || g.rare) continue;
        if (Math.hypot(g.x-f.x, g.y-f.y) < 85) g.alert = Math.max(g.alert, RANKS[g.rank].lag);
      }
    }
  }
  for (const c of chestPool){
    if (!c.alive) continue;
    if (c.grow < 1) c.grow = Math.min(1, c.grow + dt*3);
    if (c.caught){ const k=Math.min(1,reel.t/0.28); c.x+=(c.tx-c.x)*k*0.35; c.y+=(c.ty-c.y)*k*0.35; }
    else moveChest(c, dt);
  }

  if (phase === 'aim'){
    const b = bounds(0) || [WATER_L, WATER_R];
    cursor.x += cursor.dir * st.cursorSpd * dt;
    if (cursor.x > b[1]-18){ cursor.x = b[1]-18; cursor.dir = -1; }
    if (cursor.x < b[0]+18){ cursor.x = b[0]+18; cursor.dir =  1; }
  }
  else if (phase === 'drop'){
    lure.y += st.dropSpd * lure.vk * lure.dir * dt;
    const t = yToT(lure.y), bot = Math.max(WATER_T + 60, tToY(floorT(lure.x)) - 8);
    if (lure.dir > 0 && lure.y >= bot){        // 底で 折り返す
      lure.y = bot; lure.dir = -1; lure.laps++; lure.vk = Math.min(3.2, lure.vk*1.2);
      sfx.drop(); burstParticles(lure.x, lure.y, 5, '#cfe8ff');
    } else if (lure.dir < 0 && lure.y <= WATER_T + 8){   // 水面で 折り返す
      lure.y = WATER_T + 8; lure.dir = 1; lure.laps++; lure.vk = Math.min(3.2, lure.vk*1.2);
      sfx.drop(); burstParticles(lure.x, lure.y, 5, '#cfe8ff');
    }
    if (lure.dir > 0 && !inSea(lure.x, lure.y) && t > 0.02){
      lure.y = Math.max(WATER_T+8, lure.y - 4); lure.dir = -1;
      lure.laps++; lure.vk = Math.min(3.2, lure.vk*1.2); sfx.drop();
    }
  }
  else if (phase === 'reel'){
    reel.t += dt;
    const k = clamp((reel.t-0.28)/(reel.dur-0.28), 0, 1);
    const ny = reel.from + (WATER_T-30 - reel.from) * (k*k*(3-2*k));
    if (reel.t > 0.28){
      for (const f of reel.fish){ f.x += (lure.x-f.x)*0.12; f.y = ny + (f.ty0 ??= (Math.random()-0.5)*26); }
      for (const c of reel.chests){ c.x += (lure.x-c.x)*0.12; c.y = ny + (c.ty0 ??= (Math.random()-0.5)*26); }
      const want = Math.min(12, Math.floor(k*12));
      while (reel.played < want && reel.played < reel.fish.length){ sfx.fish(reel.played); reel.played++; }
    }
    lure.y = ny;
    if (reel.t >= reel.dur && !reel.tallied){ reel.tallied = true; tally(); phase = 'result'; }
  }
  else if (phase === 'result'){
    resultTxt.t += dt;
    if (resultTxt.t > 1.2){
      resultTxt = null; st.castsLeft--;
      if (st.castsLeft <= 0) gameOver(); else beginCast();
    }
  }

}

/* ============================================================
   13. 描画
   ============================================================ */
function seaPathOn(c2, k, wide, x0, y0, w, h){
  const last = k[k.length-1][0];
  c2.beginPath();
  let first = true;
  for (let t=0; t<=last+0.0001; t+=0.02){
    const b = nb(k, Math.min(t,last), wide); if (!b) break;
    const px = x0 + b[0]*w, py = y0 + Math.min(t,last)*h;
    if (first){ c2.moveTo(px,py); first=false; } else c2.lineTo(px,py);
  }
  for (let t=last; t>=-0.0001; t-=0.02){
    const b = nb(k, Math.max(t,0), wide); if (!b) continue;
    c2.lineTo(x0 + b[1]*w, y0 + Math.max(t,0)*h);
  }
  c2.closePath();
}

/* 海の中の絵。海の形の内側にだけ描く。
   毎フレーム大きな絵を描くと重いので、ステージが決まった時に
   実寸(456×550)のオフスクリーンへ 絵＋ステージの色 を焼きつけておく */
const seaImg = new Image();
let seaReady = false;
const seaTex = document.createElement('canvas');
seaTex.width = SEA_W; seaTex.height = WATER_H;
function buildSeaTexture(){
  if (!seaReady || !st) return;
  const c = seaTex.getContext('2d'), mt = maxT(), dh = WATER_H * mt;
  c.clearRect(0,0,SEA_W,WATER_H);
  // 縦の縮み具合が どのステージでも同じになるよう 絵も maxT だけ切り出す。
  // 結果、浅い海は明るい水面ちかく／深い海は暗い底まで が自然に使われる
  c.drawImage(seaImg, 0, 0, seaImg.width, seaImg.height*mt, 0, 0, SEA_W, dh);
  const g = c.createLinearGradient(0,0,0,dh);
  g.addColorStop(0, st.stage.col[0]); g.addColorStop(.45, st.stage.col[1]);
  g.addColorStop(1, st.stage.col[2]);
  c.globalAlpha = 0.55; c.fillStyle = g; c.fillRect(0,0,SEA_W,dh); c.globalAlpha = 1;
}
seaImg.onload = ()=>{ seaReady = true; buildSeaTexture(); };
seaImg.src = IMG_SEA;

let atmoT = 0;
function drawAtmo(){
  const A = st.stage.atmo, bot = tToY(maxT());
  if (A === 'ray'){
    ctx.globalAlpha = .10; ctx.fillStyle = '#bfe8ff';
    for (let i=0;i<5;i++){
      const x = WATER_L + ((i*97 + atmoT*8) % SEA_W);
      ctx.beginPath(); ctx.moveTo(x, WATER_T); ctx.lineTo(x+30, WATER_T);
      ctx.lineTo(x+120, bot); ctx.lineTo(x+50, bot); ctx.fill();
    }
    ctx.globalAlpha = 1;
  } else if (A === 'cloud'){
    ctx.globalAlpha = .13; ctx.fillStyle = '#ffffff';
    for (let i=0;i<7;i++){
      const x = WATER_L + ((i*83 + atmoT*11) % (SEA_W+120)) - 60;
      const y = WATER_T + 40 + (i*37) % Math.max(40, bot-WATER_T-60);
      ctx.beginPath(); ctx.ellipse(x, y, 56, 17, 0, 0, 6.29); ctx.fill();
    }
    ctx.globalAlpha = 1;
  } else if (A === 'rock'){
    ctx.globalAlpha = .22; ctx.fillStyle = '#0a1a26';
    for (let t=0; t<maxT(); t+=0.055){
      const b = bounds(t); if (!b) continue;
      const y = tToY(t), h = WATER_H*0.055+2;
      const w1 = 8+((t*97)%13), w2 = 8+((t*61)%15);
      ctx.fillRect(b[0], y, w1, h); ctx.fillRect(b[1]-w2, y, w2, h);
    }
    ctx.globalAlpha = 1;
  } else {
    ctx.globalAlpha = .16; ctx.fillStyle = '#d8f0ff';
    for (let i=0;i<4;i++){
      const x = WATER_L + ((i*131 + atmoT*4) % SEA_W);
      ctx.beginPath(); ctx.ellipse(x, WATER_T+18, 70, 5, 0, 0, 6.29); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
}

function draw(){
  atmoT += 0.016;
  ctx.save();
  if (shake > 0) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
  ctx.clearRect(-40,-40,W+80,H+80);

  let g = ctx.createLinearGradient(0,0,0,WATER_T);
  g.addColorStop(0,st.stage.sky[0]); g.addColorStop(1,st.stage.sky[1]);
  ctx.fillStyle=g; ctx.fillRect(-40,-40,W+80,WATER_T+40);
  ctx.fillStyle='#050d16'; ctx.fillRect(-40,WATER_T,W+80,H-WATER_T+40);

  ctx.save();
  seaPathOn(ctx, st.k, lv('umi')>0, WATER_L, WATER_T, SEA_W, WATER_H);
  ctx.clip();
  if (seaReady){
    ctx.drawImage(seaTex, WATER_L, WATER_T);
  } else {
    g = ctx.createLinearGradient(0,WATER_T,0,tToY(maxT()));
    g.addColorStop(0,st.stage.col[0]); g.addColorStop(.45,st.stage.col[1]); g.addColorStop(1,st.stage.col[2]);
    ctx.fillStyle=g; ctx.fillRect(WATER_L,WATER_T,SEA_W,WATER_H);
  }
  drawAtmo();
  ctx.fillStyle='rgba(255,255,255,.16)';
  for (const b of bubPool){ if(!b.alive) continue; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,6.29); ctx.fill(); }
  for (const o of st.objs) if (!o.solid) drawObj(o);      // かざりは 魚の うしろ
  for (const c of chestPool) if (c.alive) drawChest(c);
  for (const f of fishPool)  if (f.alive && !f.boss && !f.rare) drawFish(f);
  for (const f of fishPool)  if (f.alive && f.rare) drawRare(f);
  for (const f of fishPool)  if (f.alive && f.boss) drawBoss(f);
  ctx.globalAlpha = 0.93;
  for (const o of st.objs) if (o.solid) drawObj(o);       // 岩は 魚の まえ
  ctx.globalAlpha = 1;
  drawHiddenMarks();
  if (st.fmod.murky){        // ★海が にごった：魚の「上」にかけるので ほんとうに 見えなくなる
    const mg = ctx.createLinearGradient(0, WATER_T + WATER_H*0.22, 0, tToY(maxT()));
    mg.addColorStop(0,'rgba(10,26,38,0)'); mg.addColorStop(.5,'rgba(7,20,30,.74)');
    mg.addColorStop(1,'rgba(3,10,17,.96)');
    ctx.fillStyle = mg; ctx.fillRect(WATER_L, WATER_T, SEA_W, WATER_H);
    ctx.fillStyle = 'rgba(30,46,58,.85)';                 // にごりの つぶ
    for (let i=0;i<70;i++){
      const a = atmoT*0.5 + i*2.7;
      const x = WATER_L + ((i*97 + Math.sin(a)*30) % SEA_W);
      const y = WATER_T + WATER_H*0.3 + ((i*57 + atmoT*11) % (WATER_H*0.7));
      ctx.beginPath(); ctx.arc(x, y, 1.4 + (i%3), 0, 6.29); ctx.fill();
    }
  }
  if (phase==='drop' || phase==='reel') drawCapture(phase==='reel' ? 0.35 : 1);
  ctx.restore();

  seaPathOn(ctx, st.k, lv('umi')>0, WATER_L, WATER_T, SEA_W, WATER_H);
  if (seaGlow > 0){                              // 形が かわっている あいだ 光る
    ctx.save(); ctx.shadowColor='#8fe8ff'; ctx.shadowBlur=18;
    ctx.strokeStyle=`rgba(180,240,255,${0.35+0.55*Math.min(1,seaGlow)})`;
    ctx.lineWidth=4.5; ctx.stroke(); ctx.restore();
  }
  ctx.strokeStyle='rgba(150,215,245,.5)'; ctx.lineWidth=2.5; ctx.stroke();

  if (lure.active){
    for (const p of lurePoints()){
      ctx.strokeStyle='rgba(255,255,255,.45)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(p.x,112); ctx.lineTo(p.x,p.y); ctx.stroke();
      // ルアーは 折り返すたび 大きく・熱く なる（黄→橙→赤）
      const lp = Math.min(3, lure.laps||0);
      const lc = ['#ffe27a','#ffa53a','#ff5a2a','#ff2020'][lp];
      ctx.save();
      ctx.shadowColor = lc; ctx.shadowBlur = 8 + lp*7;
      const ls = sprAt('lure', 15 + lp*2.5, lp>=2 ? 'gold' : '');
      if (ls) ctx.drawImage(ls, p.x - ls.width/2, p.y - ls.height*0.42);
      else { ctx.fillStyle=lc; ctx.beginPath(); ctx.arc(p.x,p.y,7+lp,0,6.29); ctx.fill(); }
      if (lp > 0){                             // 熱の輪
        ctx.globalAlpha = .5; ctx.strokeStyle = lc; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(p.x, p.y, 11+lp*2, 0, 6.29); ctx.stroke();
      }
      ctx.restore();
    }
  }
  for (const p of parPool){
    if (!p.alive) continue;
    ctx.globalAlpha = clamp(p.life/p.max,0,1); ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.29); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 離した瞬間の手ごたえ（会心の一投ほど 大きく光る）
  if (zap.t > 0){
    const k = zap.t / (zap.lvl===3 ? 0.35 : zap.lvl===2 ? 0.22 : 0.14);
    const hue = (performance.now()/3) % 360;
    ctx.save(); ctx.globalAlpha = k;
    ctx.lineWidth = 3 + zap.lvl*2;
    for (let i=0;i<zap.lvl+1;i++){
      const rr = (1-k) * (60 + zap.lvl*70) + i*16;
      ctx.strokeStyle = zap.lvl===3 ? `hsl(${(hue+i*90)%360},100%,72%)`
                      : zap.lvl===2 ? '#fff0a0' : '#ffffff';
      ctx.beginPath(); ctx.arc(zap.x, zap.y, rr, 0, 6.29); ctx.stroke();
    }
    ctx.fillStyle = '#fff';
    for (let i=0;i<zap.lvl*3;i++){
      const a = i*2.1 + (1-k)*2, rr = (1-k)*(40+zap.lvl*40);
      ctx.beginPath(); ctx.arc(zap.x+Math.cos(a)*rr, zap.y+Math.sin(a)*rr, 3, 0, 6.29); ctx.fill();
    }
    ctx.restore();
  }

  if (phase === 'aim'){
    ctx.fillStyle='#ffe27a';
    ctx.beginPath(); ctx.moveTo(cursor.x,RAIL_Y+16); ctx.lineTo(cursor.x-11,RAIL_Y);
    ctx.lineTo(cursor.x+11,RAIL_Y); ctx.fill();
    ctx.strokeStyle='rgba(255,226,122,.28)'; ctx.setLineDash([5,7]); ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(cursor.x,RAIL_Y+18); ctx.lineTo(cursor.x,tToY(floorT(cursor.x))); ctx.stroke();
    ctx.setLineDash([]);
  }
  drawHUD();
  if (resultTxt) drawResult();

  ctx.restore();
  if (flash > 0){
    if (flashMode === 'red')            ctx.fillStyle = `rgba(255,58,58,${flash})`;
    else if (zap.t > 0 && zap.lvl === 3){
      const hue = (performance.now()/2.2) % 360;
      ctx.fillStyle = `hsla(${hue},100%,72%,${flash*0.55})`;
    }
    else if (flashMode === 'gold')      ctx.fillStyle = `rgba(255,238,180,${flash*0.55})`;
    else                                ctx.fillStyle = `rgba(255,255,255,${flash*0.5})`;
    ctx.fillRect(0,0,W,H);
  }
}

function drawCapture(a){
  for (const p of lurePoints()){
    if (p.band){
      ctx.fillStyle = `rgba(120,230,255,${0.16*a})`;
      if (st.hlineH) ctx.fillRect(WATER_L, p.y-st.hlineH, SEA_W, st.hlineH*2);
      if (st.vlineW) ctx.fillRect(p.x-st.vlineW, WATER_T, st.vlineW*2, WATER_H);
      if (st.xlineW){
        ctx.save(); ctx.translate(p.x,p.y);
        for (const rot of [Math.PI/4,-Math.PI/4]){
          ctx.save(); ctx.rotate(rot); ctx.fillRect(-900,-st.xlineW,1800,st.xlineW*2); ctx.restore();
        }
        ctx.restore();

    }
    const gr = ctx.createRadialGradient(p.x,p.y,st.radius*0.25,p.x,p.y,st.radius);
    gr.addColorStop(0,`rgba(140,240,255,${0.05*a})`); gr.addColorStop(1,`rgba(140,240,255,${0.22*a})`);
    ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(p.x,p.y,st.radius,0,6.29); ctx.fill();
    ctx.strokeStyle=`rgba(180,250,255,${0.75*a})`; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(p.x,p.y,st.radius,0,6.29); ctx.stroke();
    if (st.pull){
      ctx.strokeStyle=`rgba(255,180,240,${0.30*a})`; ctx.setLineDash([4,7]);
      ctx.beginPath(); ctx.arc(p.x,p.y,st.radius+PULL_RING,0,6.29); ctx.stroke(); ctx.setLineDash([]);
    }

}

/* ============================================================
   絵（スプライト）
   毎フレーム 元画像を 縮小して貼ると重いので、
   使う大きさに 1回だけ 焼いて 使いまわす。
   読みこめなかったときは これまでの 図形描画に そのまま もどる
   ============================================================ */
const SPR = {}; const sprCache = new Map();
for (const k in SPR_SRC){
  const im = new Image();
  im.onload = ()=>{ SPR[k] = im; };
  im.src = SPR_SRC[k];
}
const sprAspect = k => SPR[k] ? SPR[k].height / SPR[k].width : 1;
/* 幅 w に合わせて焼いたキャンバスを返す。mode: ''／'gray'（安い魚）／'gold'（高い魚） */
function sprAt(key, w, mode){
  const im = SPR[key]; if (!im) return null;
  const ww = Math.max(4, Math.round(w/2)*2);          // 2px きざみに まるめて キャッシュを効かせる
  const id = key + '|' + ww + '|' + (mode||'');
  let c = sprCache.get(id);
  if (c) return c;
  const hh = Math.max(2, Math.round(im.height * ww / im.width));
  c = document.createElement('canvas'); c.width = ww; c.height = hh;
  const g = c.getContext('2d');
  if (mode === 'gray') g.filter = 'grayscale(1) brightness(1.08)';
  else if (mode === 'gold') g.filter = 'saturate(1.35) brightness(1.12)';
  else if (mode === 'dark') g.filter = 'brightness(.62) saturate(.75) contrast(1.1)';
  g.drawImage(im, 0, 0, ww, hh);
  if (sprCache.size > 500) sprCache.clear();
  sprCache.set(id, c);
  return c;
}
/* (x,y) を中心に 幅 w で 貼る。dir=-1 で 左右反転（絵は すべて 左むき） */
function blit(key, x, y, w, dir, mode){
  const c = sprAt(key, w, mode); if (!c) return false;
  ctx.save(); ctx.translate(x, y);
  if (dir > 0) ctx.scale(-1, 1);
  ctx.drawImage(c, -c.width/2, -c.height/2);
  ctx.restore(); return true;
}
const FISH_SPR  = ['iwashi','aji','tai','buri','maguro'];
const BOSS_SPR  = { shark:'bshark', octo:'bocto', dragon:'bdragon' };
const RARE_SPR  = { octo:'rocto', ray:'rray', puff:'rpuff' };
function fishBody(s, col){
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.ellipse(0,0,s,s*0.55,0,0,6.29); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-s*0.85,0); ctx.lineTo(-s*1.5,-s*0.5); ctx.lineTo(-s*1.5,s*0.5); ctx.fill();
}
/* ---- 海の中の オブジェクト ----
   岩は こく・ふちを はっきり ＝「ここは 釣れない」と 一目で わかるように。
   かざりは うすく・やわらかく ＝ ただの 景色 */
function drawObj(o){
  ctx.save(); ctx.translate(o.x, o.y);
  if (!o.solid){                                   // ---- かざり ----
    const sway = Math.sin(performance.now()/900 + o.sd) * 0.09;
    ctx.globalAlpha = 0.9; ctx.rotate(sway);
    const c = sprAt(o.spr, o.w, '');
    if (c) ctx.drawImage(c, -c.width/2, -c.height/2);
    else { ctx.strokeStyle='#3fbf7a'; ctx.lineWidth=4; ctx.lineCap='round';
           ctx.beginPath(); ctx.moveTo(0,o.h/2); ctx.lineTo(0,-o.h/2); ctx.stroke(); }
    ctx.restore(); return;
  }
  // ---- かくれ岩 ---- 少し暗く落として「ここは 釣れない」を伝える
  const c = sprAt(o.spr, o.w, 'dark');
  if (c){
    ctx.drawImage(c, -c.width/2, -c.height/2);
  } else {
    ctx.beginPath(); ctx.ellipse(0,0,o.w*0.5,o.h*0.5,0,0,6.29);
    ctx.fillStyle='#1e2830'; ctx.fill();
    ctx.strokeStyle='#8fb0c4'; ctx.lineWidth=2.2; ctx.stroke();
  }
  ctx.restore();
}
/* 岩に かくれている 数を 岩ごとに ひとつだけ 見せる。
   1匹ずつ 点線で 囲むと 画面が まっ赤に なって かえって 読めなかった */
function drawHiddenMarks(){
  const O = st.objs; if (!O || !O.length) return;
  const cnt = new Map();
  for (const f of fishPool){
    if (!f.alive) continue;
    const o = hiddenBy(f.x, f.y);
    if (o) cnt.set(o, (cnt.get(o)||0) + 1);
  }
  if (!cnt.size) return;
  ctx.save();
  const pl = 0.6 + 0.4*Math.sin(performance.now()/260);
  for (const [o, n] of cnt){
    ctx.setLineDash([5,5]); ctx.lineWidth = 2;
    ctx.strokeStyle = `rgba(255,120,120,${0.45+0.35*pl})`;
    ctx.beginPath(); ctx.ellipse(o.x, o.y, o.w*0.5+5, o.h*0.5+5, 0, 0, 6.29); ctx.stroke();
    ctx.setLineDash([]);
    const by = o.y - o.h*0.5 - 9;
    ctx.fillStyle = 'rgba(150,20,26,.92)';
    ctx.beginPath();                    // roundRect が無い端末でも 出るように 手で描く
    ctx.moveTo(o.x-11, by-9); ctx.lineTo(o.x+11, by-9);
    ctx.arc(o.x+11, by, 9, -1.5708, 1.5708);
    ctx.lineTo(o.x-11, by+9); ctx.arc(o.x-11, by, 9, 1.5708, -1.5708);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffd7d7'; ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('🐟' + n, o.x, by);
  }
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.restore();
}
function drawFish(f){
  const R = RANKS[f.rank], star = f.rank===st.market.star, dull = f.rank===st.market.dull;
  const s = R.s * (0.45 + f.grow*0.55) * (star ? 1.1 : 1);
  const bp = blinkPh(f);
  if (hiddenBy(f.x,f.y)) ctx.globalAlpha = 0.45;   // 岩の うしろ＝釣れない
  if (bp === 2){                                // 消えている＝つかまらない。うすい影だけ残す
    ctx.save(); ctx.translate(f.x,f.y); ctx.globalAlpha = 0.15;
    const gs = sprAt(FISH_SPR[f.rank], s*2.9, 'gray');
    if (gs){ if (f.dir>0) ctx.scale(-1,1); ctx.drawImage(gs, -gs.width/2, -gs.height/2); }
    else { ctx.scale(f.dir,1); fishBody(s, '#dff3ff'); }
    ctx.restore();
    ctx.save(); ctx.globalAlpha = 0.5; ctx.strokeStyle = '#9fe8ff'; ctx.lineWidth = 1.2;
    ctx.setLineDash([3,4]);
    ctx.beginPath(); ctx.arc(f.x, f.y, s*0.95, 0, 6.29); ctx.stroke();
    ctx.setLineDash([]); ctx.restore();
    return;
  }
  ctx.save(); ctx.translate(f.x,f.y);
  if (bp === 1){                                // 予告のチカチカ
    ctx.globalAlpha = 0.35 + 0.65*Math.abs(Math.sin(performance.now()/45));
    ctx.shadowColor = '#bff0ff'; ctx.shadowBlur = 12;
  }
  if (star){                                    // ★ 高い魚は キラキラ
    const tw = 0.55 + 0.45*Math.sin(performance.now()/180 + f.wob);
    ctx.shadowColor = '#fff3a0'; ctx.shadowBlur = 10 + tw*12;
  }
  if (f.caught){ ctx.shadowColor='#fff'; ctx.shadowBlur=12; }
  else if (f.miss > 0) ctx.globalAlpha = 0.55 + Math.sin(f.miss*40)*0.3;
  if (dull) ctx.globalAlpha *= 0.85;
  const spr = sprAt(FISH_SPR[f.rank], s*2.9, dull ? 'gray' : star ? 'gold' : '');
  if (spr){
    if (f.dir > 0) ctx.scale(-1,1);
    ctx.drawImage(spr, -spr.width/2, -spr.height/2);
  } else {                                      // 絵が まだ 読めていないとき
    ctx.scale(f.dir,1);
    fishBody(s, dull ? '#b7c4cf' : R.c);
    ctx.fillStyle='#12202e'; ctx.beginPath(); ctx.arc(s*0.52,-s*0.13,s*0.12,0,6.29); ctx.fill();
  }
  ctx.restore();
  if (star){                                    // 星のきらめき
    const a = performance.now()/300 + f.wob, r = s*1.5;
    ctx.save(); ctx.translate(f.x + Math.cos(a)*r, f.y + Math.sin(a*1.3)*r*0.6);
    ctx.rotate(a); ctx.fillStyle='rgba(255,246,170,.95)';
    ctx.beginPath();
    for (let i=0;i<4;i++){ const k=i*Math.PI/2;
      ctx.lineTo(Math.cos(k)*4.5, Math.sin(k)*4.5);
      ctx.lineTo(Math.cos(k+Math.PI/4)*1.6, Math.sin(k+Math.PI/4)*1.6); }
    ctx.fill(); ctx.restore();
  }
}
/* レア魚：七色に光る。虹の粒を まとって泳ぐ */
function drawRare(f){
  const R = st.rareType, t = performance.now()/1000;
  const inflate = R.move==='pulse' ? (Math.sin(f.puff)+1)/2 : 0;
  const s = (R.move==='pulse' ? 24 + inflate*14 : 26) * (0.45+f.grow*0.55);
  const hue = (t*150 + f.wob*40) % 360;
  ctx.save(); ctx.translate(f.x,f.y);
  ctx.shadowColor = `hsl(${hue},100%,70%)`; ctx.shadowBlur = 26;
  const spr = sprAt(RARE_SPR[R.id], s*3.1, 'gold');
  if (spr){
    if (f.dir > 0) ctx.scale(-1,1);
    ctx.drawImage(spr, -spr.width/2, -spr.height/2);
  } else {
    ctx.scale(f.dir,1);
    const g = ctx.createLinearGradient(-s,-s,s,s);
    for (let i=0;i<=4;i++) g.addColorStop(i/4, `hsl(${(hue+i*72)%360},95%,68%)`);
    fishBody(s, g);
  }
  ctx.restore();
  for (let i=0;i<6;i++){                          // 虹の粒を まとって 泳ぐ
    const a = t*3 + i*1.05;
    ctx.globalAlpha = 0.35+0.4*Math.sin(t*4+i);
    ctx.fillStyle = `hsl(${(hue+i*60)%360},100%,72%)`;
    ctx.beginPath();
    ctx.arc(f.x - f.dir*(s+6+i*7) + Math.cos(a)*5, f.y + Math.sin(a)*10, 2.8, 0, 6.29);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}
const BOSS_COL = {
  shark : ['#dfe9f0','#7d93a6','#33465a'],
  octo  : ['#f6c0ee','#c05aae','#5a1f52'],
  dragon: ['#ffe9a8','#e8a03c','#8a4a12'],
};
function drawBoss(f){
  const B = st.bossType, C = BOSS_COL[B.id];
  const s = 46*(0.45+f.grow*0.55), pulse = 1 + Math.sin(performance.now()/260)*0.05;
  if (f.rest <= 0 && f.tmr <= 0.8){             // もうすぐ止まる、の予告
    ctx.save(); ctx.globalAlpha = (0.8 - f.tmr) * 0.9;
    ctx.strokeStyle='#fff3a0'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(f.x, f.y, s*(2.6 - (0.8-f.tmr)*1.1), 0, 6.29); ctx.stroke();
    ctx.restore();
  }
  if (f.rest > 0){                              // 休んでいる＝唯一のスキ。大きく光る
    ctx.save(); ctx.globalAlpha = 0.4 + 0.35*Math.sin(performance.now()/70);
    ctx.strokeStyle='#fff3a0'; ctx.lineWidth=5;
    ctx.beginPath(); ctx.arc(f.x, f.y, s*1.7, 0, 6.29); ctx.stroke();
    ctx.globalAlpha *= .5;
    ctx.beginPath(); ctx.arc(f.x, f.y, s*2.3, 0, 6.29); ctx.stroke(); ctx.restore();
  }
  ctx.save(); ctx.translate(f.x,f.y); ctx.scale(pulse, pulse);
  ctx.shadowColor=C[1]; ctx.shadowBlur = f.caught ? 36 : 24;
  const spr = sprAt(BOSS_SPR[B.id], s*3.1, 'gold');
  if (spr){
    if (f.dir > 0) ctx.scale(-1,1);
    ctx.drawImage(spr, -spr.width/2, -spr.height/2);
  } else {
    ctx.scale(f.dir,1);
    const g = ctx.createLinearGradient(0,-s*0.6,0,s*0.6);
    g.addColorStop(0,C[0]); g.addColorStop(0.5,C[1]); g.addColorStop(1,C[2]);
    fishBody(s, g);
  }
  ctx.restore();
}
function drawChest(c){
  const s = 19*(0.45+c.grow*0.55);
  ctx.save(); ctx.translate(c.x,c.y);
  if (c.warn > 0){ ctx.translate((Math.random()-0.5)*6,(Math.random()-0.5)*6);
                   ctx.shadowColor='#fff'; ctx.shadowBlur=15; }
  if (c.dash > 0){ ctx.globalAlpha = 0.72; ctx.shadowColor='#ffd76a'; ctx.shadowBlur=18; }
  if (c.caught){ ctx.shadowColor='#ffd76a'; ctx.shadowBlur=20; }
  const spr = sprAt('chest', s*2.05, '');
  if (spr) ctx.drawImage(spr, -spr.width/2, -spr.height/2);
  else {
    ctx.fillStyle='#8a5a2b'; ctx.fillRect(-s,-s*0.55,s*2,s*1.1);
    ctx.fillStyle='#c98a3f'; ctx.fillRect(-s,-s*0.55,s*2,s*0.34);
    ctx.fillStyle='#ffd76a'; ctx.fillRect(-s*0.16,-s*0.55,s*0.32,s*1.1);

function drawHUD(){
  ctx.fillStyle='rgba(0,0,0,.42)'; ctx.fillRect(-40,-40,W+80,196+40);
  ctx.textAlign='left';
  ctx.fillStyle='#fff'; ctx.font='bold 26px sans-serif';
  ctx.fillText(st.score.toLocaleString(), 14, 32);
  ctx.textAlign='right';
  ctx.fillStyle='#8fe0a0'; ctx.font='bold 21px sans-serif'; ctx.fillText('¥'+st.money, W-14, 31);

  // 投数ドット＋数字
  const used = CASTS - st.castsLeft;
  ctx.textAlign='left';
  ctx.fillStyle='#ffe27a'; ctx.font='bold 13px sans-serif';
  ctx.fillText(Math.min(used+1,CASTS)+' / '+CASTS, 14, 53);
  let dx = 58;
  for (let i=0;i<CASTS;i++){
    const ch = !!CHANCE[i+1] || RARE_CASTS.includes(i+1);
    const done = i < used, now = i === used;
    ctx.beginPath(); ctx.arc(dx+5, 48, ch?6:4.2, 0, 6.29);
    ctx.fillStyle = done ? 'rgba(255,255,255,.18)' : ch ? '#ff9ad0' : '#ffe27a';
    ctx.fill();
    if (now){ ctx.strokeStyle='#fff'; ctx.lineWidth=2;
              ctx.beginPath(); ctx.arc(dx+5,48,9,0,6.29); ctx.stroke(); }
    dx += 19;
  }
  // 海の魚バー
  const fw = 74, fr = clamp(aliveFish()/380, 0, 1);
  ctx.textAlign='right'; ctx.font='12px sans-serif'; ctx.fillStyle='#bfe3f2';
  ctx.fillText('🐟', W-fw-18, 52);
  ctx.fillStyle='rgba(255,255,255,.13)'; ctx.fillRect(W-fw-14, 42, fw, 11);
  ctx.fillStyle='#4fd1ff'; ctx.fillRect(W-fw-14, 42, fw*fr, 11);

  // 属性ドット
  ctx.textAlign='left'; let ex = 14;
  for (const k of ELS){
    ctx.font='12px sans-serif'; ctx.fillStyle=EL[k].c; ctx.fillText(EL[k].ic, ex, 78);
    let px = ex + 17;
    for (let i=0;i<7;i++){                 // 4個で1段目、7個で2段目。4個目のあとに くぎり
      const on = st.tag[k] > i;
      ctx.beginPath(); ctx.arc(px+3.5, 74, 3.4, 0, 6.29);
      if (on){ ctx.fillStyle=EL[k].c; ctx.fill(); }
      else { ctx.strokeStyle=EL[k].c; ctx.globalAlpha=.4; ctx.lineWidth=1.2; ctx.stroke(); ctx.globalAlpha=1; }
      px += 8.6; if (i===3) px += 3.4;
    }
    ex += 112;
  }
  if (st.syn.size){
    ctx.fillStyle='#e8b4ff'; ctx.font='bold 11px sans-serif';
    const nm = [...st.syn].map(id=>SYNS.find(s=>s.id===id).nm);
    ctx.fillText('◆ '+nm.slice(0,4).join(' ／ ')+(nm.length>4?` +${nm.length-4}`:''), 14, 96);
  }
  const P = st.pend, pend = [];
  if (P.ring    >0) pend.push('🌊+'+P.ring);
  if (P.scoreAdd>0) pend.push('✨×'+(1+P.scoreAdd).toFixed(1));
  if (P.pull    >0) pend.push('🧲+'+P.pull);
  if (pend.length){
    ctx.fillStyle='#ffe27a'; ctx.font='bold 12px sans-serif';
    ctx.fillText('▶ つぎの1投　'+pend.join('　'), 14, 109);
  }
  ctx.textAlign='center'; ctx.font='12px sans-serif'; ctx.fillStyle='rgba(255,255,255,.5)';
  if (phase==='aim')  ctx.fillText('おした しゅんかんに ヨコ ／ おしっぱなしで フカく', 240, 790);
  if (phase==='drop'){ ctx.font='bold 15px sans-serif'; ctx.fillStyle='#ffe27a';
                       ctx.fillText('はなすと 釣る！', 240, 790); }
  drawPricePanel();
  drawTalk();

function nowScore(rank){
  return Math.round(RANKS[rank].sc * st.scoreMult * mkMul(rank) * st.fmod.mult[rank]
                    * (lv('net') && rank>=3 ? 0.6 : 1));
}
function multParts(){
  const p = [];
  if (st.scoreMult > 1.001) p.push('強化×' + st.scoreMult.toFixed(1));
  if (st.pend.scoreAdd > 0) p.push('いま×' + (1+st.pend.scoreAdd).toFixed(1));
  return p;
}

function roundPath(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}

let talkBag = [], talkCur = null, talkT = 0, talkFade = 0;
function talkShuffle(){
  talkBag = TALKS.slice();
  for (let i=talkBag.length-1;i>0;i--){
    const j = (Math.random()*(i+1))|0; [talkBag[i],talkBag[j]] = [talkBag[j],talkBag[i]];
  }
}
function talkNext(){
  if (!talkBag.length) talkShuffle();
  talkCur = talkBag.pop(); talkT = 0; talkFade = 0;
}
function stepTalk(dt){
  if (!talkCur) talkNext();
  talkT += dt;
  talkFade = Math.min(1, talkFade + dt*3.5);
  if (talkT > 5.0){ talkFade = 0; talkNext(); }
}

function canTake(c){
  if (lv(c.id) >= c.max) return false;

const tradePool = ()=>CARDS.filter(c=>c.t==='t' && canTake(c));

function rollChoices(){
  const cost = puCost();
  // 2プレイに1回ほど出会える量。龍神を釣ると しばらく確率が上がる
  let wN=74, wR=10, wL=1.4;
  if (st.legendBoost > 0){ wL *= 2.2; st.legendBoost--; }
  if (st.money >= cost*3){ wR*=3.0; wL*=1.8; }
  else if (st.money >= cost*2){ wR*=2.0; wL*=1.35; }
  const perm = CARDS.filter(c=>(c.t==='n'||c.t==='r'||c.t==='l') && canTake(c));
  const temp = CARDS.filter(c=>c.t==='x');
  const nCards = lv('pricey') ? 4 : 3;
  const out = [];
  const wantPerm = st.puCount < 2 ? nCards : Math.max(out.length, nCards-1);
  for (let i=out.length; i<wantPerm && out.length<nCards; i++){
    const pool = perm.filter(c=>!out.includes(c));
    if (!pool.length) break;
    const tot = wN+wR+wL;
    let r = Math.random()*tot, tier;
    if ((r-=wN)<=0) tier='n'; else if ((r-=wR)<=0) tier='r'; else tier='l';
    let sub = [];
    for (const tr of TIER_FALL[tier]){ sub = pool.filter(c=>c.t===tr); if (sub.length) break; }
    if (!sub.length) break;
    out.push(sub[(Math.random()*sub.length)|0]);
  }
  while (out.length < nCards){
    const pool = temp.filter(c=>!out.includes(c));
    if (!pool.length) break;
    out.push(pool[(Math.random()*pool.length)|0]);
  }
  for (let i=out.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [out[i],out[j]]=[out[j],out[i]]; }
  return out;
}

function openPU(free){

  const legend = list.find(c=>c.t==='l');

}
function openTrade(){
  phase = 'powerup';
  const pool = tradePool().slice();
  for (let i=pool.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [pool[i],pool[j]]=[pool[j],pool[i]]; }
  buildSheet(pool.slice(0,3), { free:true, trade:true });
  sfx.rare();
}
function playLegend(c, done){

}
function dotsHTML(n, max){
  let h = '<span class="lvd">';

function buildSheet(list, opt){

  else if (!trade && !st.tut.puPick){ st.tut.puPick = 1;
    setTimeout(()=>showTut('3つから 1つ えらぼう！', cardsEl, false), 30); }

    setTimeout(()=>showTut('おなじ色を 4つ 集めると<br>シナジーで 大幅強化！', elArea, false), 30); }

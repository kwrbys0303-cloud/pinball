function renderSlots(){
  let h = '';
  for (const key of ['b','l','t']){
    const S = SLOT_STYLE[key], own = CARDS.filter(c=>c.slot===key && lv(c.id)>0), cap = capOf(key);
    h += `<div class="slotRow" style="color:${S.c}"><div class="lb">${S.nm}</div>`;
    for (let i=0;i<cap;i++){
      const c = own[i];
      if (c){
        let dd = '';
        if (c.max > 1){ dd = '<div class="sd">';
          for (let j=0;j<c.max;j++) dd += `<i class="${j<lv(c.id)?'on':''}"></i>`; dd += '</div>'; }
        h += `<div class="slot full" style="border-color:${S.c};background:${S.c}22"
                data-slot="${c.id}"><div class="si">${c.ic}</div>${dd}</div>`;
      } else {
        h += `<div class="slot empty" style="border-color:${S.c}" data-empty="${key}">＋</div>`;
      }
    }
    h += '</div>';
  }
  slotArea.innerHTML = h;
}

function renderElGauge(popEl, popTo){
  let h = '';
  for (const k of ELS){
    const v = (popEl===k && popTo!==undefined) ? popTo : st.tag[k], c = EL[k].c;
    let dots = '<span class="dots">';
    for (let i=0;i<7;i++){
      const on = v > i, pop = (popEl===k && v === i+1) ? ' pop' : '';
      dots += `<i class="${on?'on':''}${pop}"></i>`;
      if (i===3) dots += '<span class="sep"></span>';
    }
    dots += '</span>';
    const s4 = SYNS.find(s=>s.el===k && s.need===4), s7 = SYNS.find(s=>s.el===k && s.need===7);
    const nx = v>=7 ? null : (v>=4 ? s7 : s4);
    const left = nx ? nx.need - v : 0;
    const stx = !nx ? `<b>${s7.nm}</b> はつどう中！<br><small>${s7.big}</small>`
      : `<span class="nx">あと${left}！</span> <b>${nx.nm}</b><br><small>${nx.big}<span style="opacity:.6">（${nx.d}）</span></small>`;
    h += `<div class="elg ${left===1?'near':''}" data-el="${k}" style="color:${c}">
          <span class="ei">${EL[k].ic}</span>${dots}<span class="st">${stx}</span></div>`;
  }
  const mn = Math.min(...ELS.map(k=>st.tag[k]));
  const sA = mn>=3 ? SYNS.find(s=>s.id==='all3') : SYNS.find(s=>s.id==='all2');
  const need = mn>=3 ? 0 : (mn>=2 ? 3 : 2);
  h += `<div class="elg" style="color:#e8b4ff"><span class="ei">🌈</span>
        <span class="st">${need===0 ? `<b>${sA.nm}</b>　${sA.d}`
          : `ぜんぶ${need}こで <b>${sA.nm}</b>　${sA.d}`}</span></div>`;
  elArea.innerHTML = h;
}

function localRect(el){
  const sr = stage.getBoundingClientRect(), r = el.getBoundingClientRect();
  return { x:(r.left-sr.left)/curScale, y:(r.top-sr.top)/curScale,
           w:r.width/curScale, h:r.height/curScale };
}
function slamInto(cardEl, card, done){
  const target = slotArea.querySelector(`[data-slot="${card.id}"]`)
              || slotArea.querySelector(`[data-empty="${card.slot}"]`);
  if (!target || !cardEl){ done(); return; }
  const a = localRect(cardEl), b = localRect(target);
  for (const el of cardsEl.children) if (el !== cardEl) el.style.opacity = '0';
  passBtn.style.display = 'none';
  cardEl.style.visibility = 'hidden';
  const fx = document.createElement('div');
  fx.className = 'flyCard ' + TIER[card.t];
  fx.style.cssText += `left:${a.x}px;top:${a.y}px;width:${a.w}px;height:${a.h}px;`;
  fx.textContent = card.ic;
  flyEl.appendChild(fx);
  requestAnimationFrame(()=>{
    fx.style.transform =
      `translate(${b.x-a.x + (b.w-a.w)/2}px, ${b.y-a.y + (b.h-a.h)/2}px) scale(${b.w/a.w},${b.h/a.h})`;
  });
  setTimeout(()=>{ fx.remove(); shake = Math.max(shake, 9); sfx.slot(); done(); }, 275);
}

function choose(card, free, cardEl){
  if (phase !== 'powerup') return;
  hideTut();
  if (!canTake(card)) return;          // 枠が埋まったあとの多重クリック対策
  phase = 'slam';
  // ①タグが大きく光る → ②枠へ飛んで着地、の順で見せる
  const el = st.elem[card.id];
  renderElGauge(el, st.tag[el] + 1);
  const row = elArea.querySelector(`[data-el="${el}"]`);
  if (row) row.classList.add('hit');
  sfx.zap1();
  setTimeout(()=>slamInto(cardEl, card, ()=>applyPick(card, free)), 260);
}

function applyPick(c, free){
  if (!free){ st.money -= cardCost(c); sfx.buy(); }
  // かけひきタイムは 決まった回数しか来ない催しなので 値段カーブには数えない
  if (!curSheet.trade) st.puCount++; else st.tradeUsed++;
  const wasMax = isMaxed(c);
  st.lvl[c.id] = lv(c.id) + 1;
  const elKey = st.elem[c.id];
  st.tag[elKey] += 1;
  st.picks.push(c.nm);
  if (c.t === 'x'){
    const P = st.pend;
    if (c.id==='tFish')  P.fish     = Math.min(PEND_CAP.fish, P.fish+20);
    if (c.id==='tRing')  P.ring     = Math.min(PEND_CAP.ring, P.ring+40);
    if (c.id==='tScore') P.scoreAdd = Math.min(PEND_CAP.scoreAdd, P.scoreAdd+0.8);
    if (c.id==='tChest') P.chest   += 3;
    if (c.id==='tPull')  P.pull     = Math.min(PEND_CAP.pull, P.pull+3);
    st.lvl[c.id] = 0; st.rec.temp++;
  }
  let slotBorn = false;
  // 枠は増えるが 際限なくは増やさない（終盤に何でも取れると 選ぶ意味が消える）
  if (c.slot==='b' && !wasMax && isMaxed(c) && st.slotMax < 7){ st.slotMax++; slotBorn = true; }
  if (c.id==='fish')    addFish(18);
  if (c.id==='fishBig') addFish(60);
  if (c.id==='umi')     addFish(40);
  if (c.id==='chibi')   addFish(Math.round(aliveFish()*0.6));
  if (c.id==='scatter') addFish(50);

  const fresh = recompute();
  applySynBurst(fresh); recompute();
  checkFishUp();
  renderSlots(); renderElGauge();
  const tgt = slotArea.querySelector(`[data-slot="${c.id}"]`);
  if (tgt) tgt.classList.add('hit');
  if (slotBorn){
    const e = slotArea.querySelector('[data-empty="b"]');
    if (e) e.classList.add('born');
    notify({ kind:'max', ic:'★', title:'レベル MAX ！', big:'わく ＋1 ！',
             dur:1500, snd:()=>sfx.max(), flash:()=>flashGold(.4), shake:9 });
  }
  flushPendSpawns(); updatePUBtn();

  setTimeout(()=>{
    modal.classList.remove('show');
    for (const el of cardsEl.children){ el.style.opacity = ''; el.style.visibility = ''; }
    fresh.forEach((id,i)=>setTimeout(()=>showSyn(SYNS.find(s=>s.id===id)), i*2100));
    // beginCast なら「無料パワーアップの直後にかけひきタイム」も取りこぼさない
    if (st.castsLeft <= 0) gameOver(); else beginCast();
  }, slotBorn ? 1100 : 350);
}

/* --- 告知はすべて この待ち行列を通す。同時に2つ出ることは起きない --- */
const noteEl = $('note'), tutEl = $('tut');
const noteQ = [];
let noteBusy = false, noteTimer = null, noteThen = null;
function notify(o){ noteQ.push(o); drainNote(); }
function closeNote(){
  if (!noteBusy) return;
  clearTimeout(noteTimer);
  noteEl.className = 'ov';
  legendBox.classList.remove('show');       // ★レジェンド枠も 必ず 閉じる
  if (noteThen){ const f = noteThen; noteThen = null; f(); }
  noteBusy = false;
  setTimeout(drainNote, 130);
}
function drainNote(){
  if (noteBusy || !noteQ.length) return;
  const o = noteQ.shift();
  noteBusy = true;
  if (o.kind === 'legend'){                       // レジェンドだけは全画面
    legendBox.querySelector('.li').textContent = o.ic;
    legendBox.querySelector('.ln').textContent = o.title;
    legendBox.querySelector('.ld').textContent = o.sub || '';
    legendBox.classList.add('show'); sfx.legend();
    noteThen = o.then || null;
    noteTimer = setTimeout(()=>{ legendBox.classList.remove('show'); noteBusy=false;
      if (noteThen){ const f = noteThen; noteThen = null; f(); }
      setTimeout(drainNote,130); }, 1750);
    return;
  }
  const fast = noteQ.length >= 2;                 // たまっていたら短く
  noteEl.className = 'ov show ' + o.kind;
  noteEl.innerHTML = `<div class="nBox">
      ${o.w   ? `<div class="nW">${o.w}</div>` : ''}
      ${o.img ? `<div class="nP"><img src="${SPR_SRC[o.img]||''}" alt="">${
                    o.ic ? `<b>${o.ic}</b>` : ''}</div>` : ''}
      ${!o.img && o.ic ? `<div class="nI">${o.ic}</div>` : ''}
      <div class="nT">${o.title}</div>
      ${o.sub ? `<div class="nS">${o.sub}</div>` : ''}
      ${o.big ? `<div class="nB">${o.big}</div>` : ''}
    </div>`;
  if (o.snd) o.snd();
  if (o.flash) o.flash();
  if (o.shake) shake = Math.max(shake, o.shake);
  noteThen = o.then || null;
  noteTimer = setTimeout(()=>{ noteEl.className='ov'; noteBusy=false;
    if (noteThen){ const f = noteThen; noteThen = null; f(); }
    setTimeout(drainNote,130); }, (o.dur||1700) * (fast?0.6:1));
}

/* --- チュートリアル（毎プレイ 初回のみ・タップで消える） --- */
/* 吹き出しは 対象ボタンの真上（または真下）に出す。
   以前は画面中央固定だったので かけひきボタンを指せていなかった */
function showTut(msg, target, below){
  const r = !target ? { x:W/2-60, y:300, w:120, h:0 }
          : (target.nodeType ? localRect(target) : target);   // DOM でも 座標でも OK
  const cx = r.x + r.w/2;
  tutEl.style.left = '0px'; tutEl.style.right = '0px';
  tutEl.style.top = (below ? r.y + r.h + 4 : r.y - 92) + 'px';
  const inner = below
    ? `<div class="tArrow" style="transform:rotate(180deg)">▼</div><div class="tMsg">${msg}</div>`
    : `<div class="tMsg">${msg}</div><div class="tArrow">▼</div>`;
  tutEl.innerHTML = `<div style="display:inline-block;transform:translateX(${(cx-W/2).toFixed(0)}px)">${inner}</div>`;
  tutEl.classList.add('show');
  clearTimeout(tutTimer);                    // ★3秒で 必ず 消える（重なって 読めなくなるので）
  tutTimer = setTimeout(hideTut, 3000);
}
let tutTimer = null;
const hideTut = ()=>{ clearTimeout(tutTimer); tutEl.classList.remove('show'); };
function checkTut(){
  if (!st || phase!=='aim'){ return; }
  if (!st.tut.pu && st.money >= puCost()){
    showTut('おかねが たまった！<br>ここを おそう', puBtn, false); return;
  }
  if (!st.tut.td && st.tickets > 0 && tradePool().length){
    showTut('かけひき券！<br>ここを おそう', tdBtn, false); return;
  }
  if (!st.tut.rock){                       // ★岩の うしろは 釣れない
    const rk = (st.objs||[]).find(o=>o.solid);
    if (rk){
      st.tut.rock = 1;
      showTut('岩の うしろの 魚は 釣れない！<br>出てくるのを 待とう',
              { x:rk.x-40, y:rk.y-rk.h/2, w:80, h:0 }, false);
      return;
    }
  }
  hideTut();
}

function showSyn(s){

    const s4 = SYNS.find(x=>x.el===k && x.need===4), s7 = SYNS.find(x=>x.el===k && x.need===7);
    const cards = showCards
      ? CARDS.filter(c=>st.elem[c.id]===k).map(c=>`<span class="ec">${c.ic}${c.nm}</span>`).join('')
      : '‥‥';
    return `<div class="elBlk" style="color:${EL[k].c}">
      <div class="eh">${EL[k].ic} ${EL[k].n}　${EL[k].dir}</div>
      <div class="ee"><b>4こ</b>あつめると <b class="hot">${s4.big}</b></div>
      <div class="ee"><b>7こ</b>あつめると <b class="hot">${s7.big}</b></div>
      <div class="el">${cards}</div></div>`;
  }).join('');
}
function pickMarket(sg){
  const ok = MARKETS.filter(m=>MARKET_OK[sg.depth].includes(m.star));
  return ok[(Math.random()*ok.length)|0];
}

function startRoll(){
  dealElements();
  rollScreen.classList.add('show');
  rollGo.style.display='none'; rollTap.style.display='block';
  rollAgain.style.display='none'; elMore.style.display='none';
  rollLocked = false;
  for (const el of rollScreen.querySelectorAll('.rSec')) el.classList.add('spin');
  rollTimer = setInterval(()=>{
    st.stage = STAGES[(Math.random()*STAGES.length)|0];
    st.k = varyShape(st.stage.k);
    st.market = pickMarket(st.stage);
    st.bossType = BOSSES[(Math.random()*BOSSES.length)|0];
    st.rareType = RARES[(Math.random()*RARES.length)|0];
    drawStagePrev(st.stage, st.k);
    $('stageNm').textContent = st.stage.ic + ' ' + st.stage.nm;
    $('stageNote').innerHTML = '';
    renderMarket(st.market);
    renderFoeBox(false); renderElBox(false);
  }, 65);
}
function stopRoll(){
  if (rollLocked) return;
  rollLocked = true;
  clearInterval(rollTimer); rollTimer = null;
  st.stage = STAGES[(Math.random()*STAGES.length)|0];
  st.k = varyShape(st.stage.k);          // 海の形は 毎プレイ ちがう
  st.market = pickMarket(st.stage);
  st.bossType = BOSSES[(Math.random()*BOSSES.length)|0];
  st.rareType = RARES[(Math.random()*RARES.length)|0];
  drawStagePrev(st.stage, st.k);
  $('stageNm').textContent = st.stage.ic + ' ' + st.stage.nm;
  $('stageNote').innerHTML = st.stage.note;
  renderMarket(st.market);
  renderFoeBox(true); renderElBox(true);
  for (const el of rollScreen.querySelectorAll('.rSec')) el.classList.remove('spin');
  rollTap.style.display='none'; rollGo.style.display='block';
  // ひきなおしは 2回まで。3回目からは「はじめる」だけ
  if (rerollLeft > 0){
    rollAgain.style.display = 'block';
    rollAgain.textContent = `ひきなおす（あと${rerollLeft}回）`;
  } else rollAgain.style.display = 'none';
  const eb = elBoxEl;
  elMore.style.display = eb.scrollHeight > eb.clientHeight + 4 ? 'block' : 'none';
  eb.scrollTop = 0;
  recompute(); buildObjs(); buildSeaTexture(); sfx.syn();
}
rollAgain.addEventListener('pointerdown', e=>{
  e.preventDefault(); e.stopPropagation(); audioUnlock();
  if (rerollLeft <= 0) return;
  rerollLeft--; dealElements(); startRoll();
});
elBoxEl.addEventListener('scroll', ()=>{
  const eb = elBoxEl;
  elMore.style.display =
    (eb.scrollHeight - eb.scrollTop - eb.clientHeight > 6) ? 'block' : 'none';
});
rollScreen.addEventListener('pointerdown', e=>{
  if (e.target === rollGo || e.target === rollAgain) return;
  // ストップ後は もう横取りしない。ここで preventDefault すると
  // タグ欄が タッチで スクロールできなくなる
  if (rollLocked) return;
  if (elBoxEl.contains(e.target)) return;
  e.preventDefault(); e.stopPropagation(); audioUnlock(); stopRoll();
});
rollGo.addEventListener('pointerdown', e=>{
  e.stopPropagation();
  rollScreen.classList.remove('show');
  for (const f of fishPool)  f.alive=false;
  for (const c of chestPool) c.alive=false;
  recompute();
  addFish(Math.round(BASE_FISH * st.fishScale));
  beginCast();
});

/* ============================================================
   17. タイトル / リザルト（ランクと称号）
   ============================================================ */
const screen=$('screen'), scTtl=$('scTtl'), scBody=$('scBody'),
      scBtn=$('scBtn'), hsTxt=$('hsTxt'), buildList=$('buildList');

/* 自動プレイ（12投完走）の実測分布から決めた。
   適当に投げて 9〜11万、狙って投げて 20〜53万 あたりに落ちる */
/* v8 の実測分布から引き直した。6戦で 1.96万／3.22万／4.62万／5.41万／17.7万／33.0万。
   デカい魚の点数と「強くなった魚は1.4倍」で 天井が上がったぶん 全体を上へ */
const RANK_TH = [
  [420000,'SSS','#ff7ad0'], [260000,'SS','#ffd76a'], [150000,'S','#ffe9a8'],
  [85000,'A','#8fe0a0'], [42000,'B','#7fd0ff'], [18000,'C','#9fb8d0'],
  [7000,'D','#a0a8b0'], [0,'E','#8a8f96'],
];
function rankOf(sc){ for (const r of RANK_TH) if (sc >= r[0]) return r; return RANK_TH[RANK_TH.length-1]; }

/* 称号は「ヌシ」「できごと」「遊びかた」の3カテゴリから1つずつ選ぶ。
   ひとつの表から上から2つ取ると、毎回おなじ組み合わせになってしまう */
function titlesOf(){
  const s = st, out = [];
  const maxedN = CARDS.filter(c=>c.slot==='b' && c.max>1 && isMaxed(c)).length;
  const tradeN = usedIn('t'), legN = usedIn('l');
  const topEl  = Math.max(...ELS.map(k=>s.tag[k]));
  const topKey = ELS.find(k=>s.tag[k]===topEl);
  const minEl  = Math.min(...ELS.map(k=>s.tag[k]));

  const nushi = [
    [s.bossGot,                '🐉 ヌシハンター'],
    [s.bossSeen && !s.bossGot, '😭 ヌシに にげられた人'],
  ];
  const event = [                                   // できごと（めずらしい順）
    [s.rec.rare>=6,            '✨ 星をつかんだ人'],
    [s.rec.maxCatch>=120,      '🕸 一網打尽の達人'],
    [s.rec.tuna>=15,           '🐋 マグロ漁師'],
    [s.rec.chest>=12,          '🏴‍☠️ トレジャーハンター'],
    [legN>=2,                  '🍀 もってる人'],
    [s.score>0 && s.rec.lastScore/s.score>=0.45, '🚀 ラストスパート'],
    [s.rec.maxCatch>=60,       '🎏 大漁ずき'],
    [s.money>=20000,           '💰 ためこみ屋'],
  ];
  const style = [                                   // 遊びかた
    [minEl>=3,                 '🌈 オールラウンダー'],
    [topEl>=6,                 `${EL[topKey].ic} ${EL[topKey].n}の申し子`],
    [maxedN>=3,                '🔨 一点集中の職人'],
    [Math.round(s.radius)>=220,'🌊 海をのみこむ者'],
    [s.pull>=6,                '🧲 引きよせマスター'],
    [s.rec.temp>=5,            '⏱ その場しのぎの天才'],
    [tradeN>=3,                '😈 かけひきの鬼'],
    [tradeN===0,               '🛡 安全運転'],
    [s.dual,                   '🎣 二刀流の使い手'],
  ];
  for (const list of [nushi, event, style]){
    const hit = list.find(x=>x[0]);
    if (hit) out.push(hit[1]);
  }
  if (!out.length) out.push('🎣 つりびと');
  return out;
}

/* ============================================================
   ハイスコア
   アーティファクトには 保存の しくみが ないので 3段がまえ。
   ① このタブを 開いている あいだは メモリで 上位10件
   ② localStorage が 使えるなら そこにも 置く（使えなくても 何も起きない）
   ③ どこでも 確実に 残せるように「セーブコード」を 発行・読みこみ
   ============================================================ */
let hiList = [];          // {sc, sg, mk, rk, sy:[], d}
const HS_KEY = 'tsuritsuri9';
function hiLoad(){
  try { const t = localStorage.getItem(HS_KEY);
        if (t) hiList = JSON.parse(t).slice(0,10); } catch(e){}
}
function hiStore(){ try { localStorage.setItem(HS_KEY, JSON.stringify(hiList)); } catch(e){} }
function hiAdd(rec){
  hiList.push(rec);
  hiList.sort((a,b)=>b.sc-a.sc);
  hiList = hiList.slice(0,10);
  hiStore();
  return hiList.indexOf(rec);          // 0始まりの順位。-1 なら ランク外
}
const hiScoreTop = ()=> hiList.length ? hiList[0].sc : 0;
/* --- セーブコード（数字とハイフンだけ。コピペで 持ち運べる） --- */
function hiCode(){
  const body = hiList.map(r=>[r.sc, r.sg, r.mk, r.rk, (r.sy||[]).join('-'), r.d].join(',')).join(';');
  let sum = 0; for (let i=0;i<body.length;i++) sum = (sum*31 + body.charCodeAt(i)) % 9973;
  return 'TB9-' + sum.toString(36).toUpperCase() + '-' + body;
}
function hiLoadCode(code){
  try {
    const m = String(code).trim().match(/^TB9-([0-9A-Z]+)-([\s\S]*)$/);
    if (!m) return 'コードの かたちが ちがいます';
    const body = m[2];
    let sum = 0; for (let i=0;i<body.length;i++) sum = (sum*31 + body.charCodeAt(i)) % 9973;
    if (sum.toString(36).toUpperCase() !== m[1]) return 'コードが こわれています';
    const list = body.split(';').filter(Boolean).map(t=>{
      const a = t.split(',');
      return { sc:+a[0]|0, sg:+a[1]|0, mk:+a[2]|0, rk:+a[3]|0,
               sy:(a[4]?a[4].split('-').map(Number):[]), d:a[5]||'' };
    }).filter(r=>r.sc>0);
    if (!list.length) return 'なかみが からっぽです';
    // いまの記録と 合わせて 上位10件
    const key = r=>r.sc+'|'+r.d;
    const map = new Map();
    for (const r of hiList.concat(list)) map.set(key(r), r);
    hiList = [...map.values()].sort((a,b)=>b.sc-a.sc).slice(0,10);
    hiStore(); return '';
  } catch(e){ return 'よみこめませんでした'; }
}
/* --- 一覧のHTML。newIdx の行だけ 上から 割りこんで 光る --- */
function hiListHTML(newIdx){
  if (!hiList.length) return '<div class="hiEmpty">まだ 記録が ありません</div>';
  return hiList.map((r,i)=>{
    const sg = STAGES[r.sg] || STAGES[0], mk = MARKETS[r.mk] || MARKETS[0];
    const rk = RANK_TH[r.rk] || RANK_TH[RANK_TH.length-1];
    const sy = (r.sy||[]).map(k=>SYNS[k] && SYNS[k].nm).filter(Boolean);
    return `<div class="hiRow${i===newIdx?' hiNew':''}" style="--d:${i*0.05}s">
      <div class="hiNo">${i+1}</div>
      <div class="hiMain">
        <div class="hiSc">${r.sc.toLocaleString()}<span class="hiRk" style="color:${rk[2]}">${rk[1]}</span></div>
        <div class="hiSub">${sg.ic} ${sg.nm}　${mk.nm}</div>
        ${sy.length ? `<div class="hiSyn">◆ ${sy.join(' ／ ')}</div>` : ''}
      </div>
      <div class="hiDt">${r.d||''}</div>
    </div>`;
  }).join('');
}
function showTitle(){
  phase='title'; screen.classList.remove('hide'); screen.classList.remove('result');
  scTtl.innerHTML = 'ツリツリバースト<small>さ か な の 逆 襲</small>';
  scBody.innerHTML = 'おした しゅんかんに <b>ヨコ</b>、おしっぱなしで <b>フカさ</b>。<br>'
    + '魚は みんな 逃げる。しかも <b>だんだん つよくなる</b>。<br>'
    + '<b>12投</b>で どこまで いけるか。<br>'
    + '<span style="opacity:.6;font-size:12px">タップ ／ スペースキー</span>';
  buildList.innerHTML = '<div class="hiBox"><div class="hiTtl">ハイスコア</div>'
    + hiListHTML(-1) + '</div>';
  scBtn.textContent='はじめる';
  hsTxt.innerHTML = '<span class="codeBtn" id="codeBtn">セーブコード</span>';
  $('codeBtn').addEventListener('pointerdown', e=>{ e.stopPropagation(); openCode(); });
}
function gameOver(){
  phase='over'; sfx.over(); screen.classList.add('result');
  if (st.score > hiScore) hiScore = st.score;
  const now = new Date();
  const rec = { sc: st.score, sg: STAGES.indexOf(st.stage), mk: MARKETS.indexOf(st.market),
                rk: RANK_TH.findIndex(r=>r === rankOf(st.score)),
                sy: [...st.syn].map(id=>SYNS.findIndex(x=>x.id===id)),
                d: (now.getMonth()+1) + '/' + now.getDate() };
  const newIdx = hiAdd(rec);
  screen.classList.remove('hide');
  scTtl.innerHTML = 'つりおわり！<small>お つ か れ さ ま</small>';
  const [,rk,col] = rankOf(st.score);
  scBody.innerHTML =
    `<div id="rankBig" style="color:${col}">${rk}</div>
     <div style="font-size:38px;font-weight:bold;color:#ffe27a;margin-top:4px">${st.score.toLocaleString()}</div>
     <div style="margin-top:6px">${titlesOf().map(t=>`<span class="titleChip">${t}</span>`).join('')}</div>
     <div style="font-size:12px;opacity:.65;margin-top:6px">${st.stage.ic} ${st.stage.nm}　${st.market.nm}</div>`;
  const seen = [...new Set(st.picks)];
  buildList.innerHTML = seen.map(p=>`<span>${p}</span>`).join('')
    + (st.syn.size ? '<br>' + [...st.syn].map(id=>
        `<span style="background:rgba(232,180,255,.25)">◆${SYNS.find(s=>s.id===id).nm}</span>`).join('') : '')
    + `<div class="hiBox"><div class="hiTtl">ハイスコア　${
        newIdx===0 ? '<b class="hiBang">あたらしい 1位！</b>'
        : newIdx>0 ? `<b class="hiBang">${newIdx+1}位に 入った！</b>`
        : `<span style="opacity:.6">あと ${(hiList[9].sc - st.score + 1).toLocaleString()}点で 10位</span>`
      }</div>${hiListHTML(newIdx)}</div>`;
  scBtn.textContent='もう1回';
  hsTxt.innerHTML = '<span class="codeBtn" id="codeBtn">セーブコード</span>';
  $('codeBtn').addEventListener('pointerdown', e=>{ e.stopPropagation(); openCode(); });
  if (newIdx >= 0) setTimeout(()=>sfx.max(), 620);
}
/* --- セーブコードの 出し入れ --- */
function openCode(){
  codeSheet.classList.add('show');
  codeOut.value = hiCode();
  codeMsg.textContent = hiList.length
    ? 'このコードを メモに はっておくと、あとで ここに はりつけて もどせます。'
    : 'まだ 記録が ありません。';
}
function newGame(){
  audioUnlock();
  st = newState(); noteQ.length = 0; noteBusy = false; clearTimeout(noteTimer);
  noteEl.className='ov'; legendBox.classList.remove('show');
  for (const f of fishPool)  f.alive=false;
  for (const c of chestPool) c.alive=false;
  for (const p of parPool)   p.alive=false;
  recompute();
  screen.classList.add('hide');
  modal.classList.remove('show'); statusSheet.classList.remove('show');
  updatePUBtn();
  rerollLeft = 2; phase = 'roll'; startRoll();
}
scBtn.addEventListener('pointerdown', e=>{ e.stopPropagation(); newGame(); });
$('codeClose').addEventListener('pointerdown', e=>{
  e.stopPropagation(); codeSheet.classList.remove('show'); codeRes.textContent=''; });
$('codeCopy').addEventListener('pointerdown', e=>{
  e.stopPropagation(); codeOut.select(); codeOut.setSelectionRange(0, 99999);
  let ok = false;
  try { ok = document.execCommand('copy'); } catch(err){}
  if (!ok && navigator.clipboard){ navigator.clipboard.writeText(codeOut.value).catch(()=>{}); ok = true; }
  codeRes.style.color = '#8fe0a0';
  codeRes.textContent = ok ? 'コピーしました！' : '長おしで コピーしてね';
});
$('codeLoad').addEventListener('pointerdown', e=>{
  e.stopPropagation();
  const err = hiLoadCode(codeIn.value);
  codeRes.style.color = err ? '#ff9a9a' : '#8fe0a0';
  codeRes.textContent = err || 'よみこみました！';
  if (!err){ codeOut.value = hiCode();
             if (phase==='title') showTitle(); }
});

/* ============================================================
   18. 入力・ループ
   ============================================================ */
const stage = $('stage');
const inUI = e => [puBtn,tdBtn,$('stBtn'),$('muBtn'),modal,statusSheet,screen,rollScreen,legendBox,flyEl,noteEl,codeSheet]
                    .some(el=>el===e.target || el.contains(e.target));
stage.addEventListener('pointerdown', e=>{
  if(inUI(e)) return; e.preventDefault();
  if (noteBusy){ closeNote(); return; }        // 告知はタップで飛ばせる
  onPress();
});
window.addEventListener('pointerup',     ()=>onRelease());
window.addEventListener('pointercancel', ()=>onRelease());
window.addEventListener('blur',          ()=>onRelease());
window.addEventListener('keydown', e=>{
  if (e.code!=='Space' && e.code!=='Enter') return;
  e.preventDefault(); audioUnlock();
  if (phase==='title'||phase==='over'){ newGame(); return; }
  if (phase==='roll'){ rollLocked ? rollGo.dispatchEvent(new Event('pointerdown')) : stopRoll(); return; }
  if (!e.repeat) onPress();
});
window.addEventListener('keyup', e=>{ if(e.code==='Space'||e.code==='Enter') onRelease(); });
document.addEventListener('touchmove', e=>e.preventDefault(), { passive:false });

function resize(){
  const iw=window.innerWidth, ih=window.innerHeight;
  curScale = Math.min(iw/W, ih/H);
  stage.style.transform =
    `translate(${(iw-W*curScale)/2}px, ${(ih-H*curScale)/2}px) scale(${curScale})`;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', ()=>setTimeout(resize,120));
resize();
$('screen').style.backgroundImage = `url(${IMG_SCENE})`;
$('roll').style.backgroundImage   = `url(${IMG_SCENE})`;

hiLoad();
st = newState(); dealElements(); recompute(); showTitle();

let last = performance.now();
function loop(now){
  const dt = Math.min(0.05,(now-last)/1000); last = now;
  if (phase!=='title' && phase!=='over' && phase!=='powerup' && phase!=='slam' && phase!=='roll')
    update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>

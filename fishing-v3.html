<!DOCTYPE html>
<!--
  ツリツリバースト  v3
  ============================================================
  v2 → v3 で変えたこと
  - 12投に変更。4投目=魚群 / 8投目=ヌシ出現 / 12投目=大漁タイム の
    チャンスを固定タイミングで用意（全プレイ平等）
  - ヌシ（ボス魚）は釣り上げるまで海に居つづける。時間制限なし
  - パワーアップ画面を全面作り直し
      ・レアリティ表示を文字から「カードの背景色」へ
      ・枠は数字をやめて 下部の枠イラストに。選ぶとガンッと入る
      ・属性は数字をやめて ●を6個ならべ 3個目と6個目に区切り線
      ・シナジーは名前だけでなく 効果まで書く
      ・所持金と 1枚ごとの値段を大きく表示
  - 属性タグは全カード一律 +1（レア・レジェンドの +2 を廃止）
  - 海の形が7種類。毎プレイ ランダムに決まる
  - トレードオフを11種に拡充。マイナスが状況しだいでプラスに転ぶ設計
  - 宝箱は不規則に漂い、予備動作のあと高速でダッシュして逃げる
  - 引きよせを弱体化（最大11匹→8匹、範囲 ワッカ+165→+100）
  - 釣り上げの演出と効果音を追加（文字は出さず 光と揺れだけで表現）
-->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ツリツリバースト v3</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#05121f;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif; color:#fff;
    user-select:none; touch-action:none; }
  #wrap  { position:fixed; inset:0; overflow:hidden; }
  #stage { position:absolute; left:0; top:0; width:480px; height:800px; transform-origin:top left; }
  canvas#cv { position:absolute; inset:0; width:480px; height:800px; border-radius:14px; }
  .ov { position:absolute; }
  #puBtn,#stBtn,#muBtn { z-index:10; }
  #modal  { z-index:30; }
  #stBtn,#muBtn { z-index:40; }
  #status { z-index:50; }
  #synPop { z-index:55; }
  #fly    { z-index:58; }
  #legend, #roll, #screen { z-index:60; }

  /* ---------- 下部ボタン ---------- */
  #stBtn,#muBtn,#puBtn { border-radius:14px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; font-weight:bold; transition:.12s; }
  #stBtn:active,#muBtn:active,#puBtn:active { transform:scale(.95); }
  #stBtn { left:14px;  top:708px; width:92px;  height:76px; font-size:11px;
    background:#16324a; border:2px solid #2f5a7c; color:#9fd0e8; }
  #muBtn { left:112px; top:708px; width:52px;  height:76px; font-size:22px;
    background:#16324a; border:2px solid #2f5a7c; color:#9fd0e8; }
  #stBtn .ic { font-size:19px; margin-bottom:2px; }
  #puBtn { left:170px; top:708px; width:296px; height:76px; font-size:16px;
    background:#1b3346; border:2px solid #2c4d68; color:#5c7a92; }
  #puBtn.ready { background:linear-gradient(180deg,#ffd76a,#f2a63b); border-color:#fff3c4;
    color:#4a2c00; box-shadow:0 0 22px rgba(255,200,80,.75); animation:pulse 1.1s infinite; }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.04)} }
  #puGauge { width:200px; height:8px; background:#0d2033; border-radius:4px; margin-top:6px;
    overflow:hidden; position:relative; }
  #puFill { height:100%; width:0%; background:#4fd1ff; transition:width .25s; }
  .tick { position:absolute; top:0; width:2px; height:100%; background:rgba(255,255,255,.55); }
  #puSub { font-size:11px; margin-top:5px; font-weight:normal; opacity:.92; }

  /* ---------- パワーアップ画面 ---------- */
  #modal { inset:0; background:#050f19; display:none;
    flex-direction:column; align-items:stretch; justify-content:center;
    border-radius:14px; padding:12px 14px 10px; overflow-y:auto; }
  #modal.show { display:flex; }
  #puHead { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:9px; }
  #puHead .t { font-size:19px; font-weight:bold; letter-spacing:2px; }
  #puHead .m { font-size:13px; color:#8fe0a0; }
  #puHead .m b { font-size:25px; }
  #cards { display:flex; flex-direction:column; gap:8px; }

  .card { border-radius:14px; border:2px solid; padding:9px 11px; display:flex;
    align-items:center; gap:10px; position:relative; overflow:hidden; }
  .card:active { transform:scale(.985); }
  .card .ic { font-size:30px; width:42px; text-align:center; flex:none;
    filter:drop-shadow(0 1px 1px rgba(0,0,0,.35)); }
  .card .tx { flex:1; min-width:0; }
  .card .l1 { display:flex; align-items:center; gap:7px; margin-bottom:3px; }
  .card .nm { font-size:18px; font-weight:bold; letter-spacing:.5px; }
  .card .el { font-size:19px; line-height:1; }
  .card .lvd { display:flex; gap:3px; }
  .card .lvd i { width:7px; height:7px; border-radius:50%; display:block;
    background:currentColor; opacity:.25; }
  .card .lvd i.on { opacity:1; }
  .card .pr { margin-left:auto; font-size:20px; font-weight:bold; white-space:nowrap; }
  .card .ds { font-size:12.5px; line-height:1.35; opacity:.9; }
  .card .syn { font-size:12.5px; font-weight:bold; margin-top:4px;
    padding:2px 7px; border-radius:7px; display:inline-block; }
  .card .cheap { font-size:11px; font-weight:bold; margin-left:6px;
    padding:1px 6px; border-radius:6px; background:rgba(0,0,0,.16); }

  .r-n { background:#fdf4c8; border-color:#d4b845; color:#3f3300; }
  .r-r { background:#ffd6a0; border-color:#e8913a; color:#4a2600; }
  .r-x { background:#dbe2e8; border-color:#8fa2b2; color:#25313d; }
  .r-t { background:#231c30; border-color:#a06fd0; color:#f0e2ff;
         box-shadow:0 0 16px rgba(160,111,208,.4); }
  .r-l { border-color:#fff6cf; color:#2b1d00;
         background:linear-gradient(115deg,#ff9fb0,#ffd36a,#a8f08a,#7fdcff,#c4a6ff,#ff9fb0);
         background-size:320% 320%; animation:rainbow 4s linear infinite;
         box-shadow:0 0 30px rgba(255,235,160,.85); }
  @keyframes rainbow { 0%{background-position:0% 50%} 100%{background-position:320% 50%} }
  .r-n .syn,.r-r .syn,.r-l .syn,.r-x .syn { background:rgba(120,40,160,.16); color:#5b1f7a; }
  .r-t .syn { background:rgba(232,180,255,.2); color:#e8b4ff; }

  /* ---------- 枠イラスト ---------- */
  #slotArea { margin-top:11px; }
  .slotRow { display:flex; align-items:center; gap:6px; margin-bottom:6px; }
  .slotRow .lb { font-size:10px; color:#7fb6d4; width:52px; flex:none; letter-spacing:0; }
  .slot { width:52px; height:52px; border-radius:11px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; flex:none; transition:.2s; }
  .slot.empty { border:2px dashed rgba(127,182,212,.4); background:rgba(127,182,212,.05); }
  .slot.full  { border:2px solid #4fd1ff; background:rgba(79,209,255,.14); }
  .slot.relic.full { border-color:#ffd76a; background:rgba(255,215,106,.14); }
  .slot .si { font-size:22px; line-height:1; }
  .slot .sd { display:flex; gap:2px; margin-top:3px; height:5px; }
  .slot .sd i { width:5px; height:5px; border-radius:50%; background:#4fd1ff; opacity:.28; }
  .slot .sd i.on { opacity:1; }
  .slot.hit { animation:slotHit .42s cubic-bezier(.2,1.7,.4,1); }
  @keyframes slotHit { 0%{transform:scale(1)} 22%{transform:scale(1.45); filter:brightness(2.6)}
    100%{transform:scale(1); filter:brightness(1)} }
  .slot.born { animation:slotBorn .5s ease-out; }
  @keyframes slotBorn { 0%{transform:scale(0); opacity:0} 65%{transform:scale(1.3)} 100%{transform:scale(1)} }

  /* ---------- 属性ゲージ ---------- */
  #elArea { margin-top:10px; }
  .elg { display:flex; align-items:center; gap:7px; height:25px; }
  .elg .ei { font-size:17px; width:22px; text-align:center; flex:none; }
  .elg .dots { display:flex; align-items:center; gap:3px; flex:none; }
  .elg .dots i { width:11px; height:11px; border-radius:50%; display:block;
    border:1.5px solid currentColor; opacity:.35; }
  .elg .dots i.on { background:currentColor; opacity:1; box-shadow:0 0 7px currentColor; }
  .elg .dots i.pop { animation:dotPop .45s cubic-bezier(.2,1.8,.4,1); }
  @keyframes dotPop { 0%{transform:scale(0)} 60%{transform:scale(1.8)} 100%{transform:scale(1)} }
  .elg .sep { width:2px; height:13px; background:currentColor; opacity:.55; border-radius:1px; }
  .elg .st { font-size:11.5px; margin-left:3px; white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis; }
  .elg .st b { font-weight:bold; }

  /* ---------- 飛んでいくカード ---------- */
  #fly { pointer-events:none; }
  .flyCard { position:absolute; border-radius:14px; border:2px solid; display:flex;
    align-items:center; justify-content:center; font-size:30px;
    transition:transform .27s cubic-bezier(.5,-0.25,.6,1), opacity .27s; }

  /* ---------- ステータス ---------- */
  #status { inset:0; background:rgba(3,12,22,.96); display:none; flex-direction:column;
    align-items:center; border-radius:14px; padding:14px 0; }
  #status.show { display:flex; }
  #stTtl { font-size:20px; font-weight:bold; letter-spacing:2px; }
  #stSub { font-size:12px; opacity:.7; margin:3px 0 8px; }
  #stBody { flex:1; width:100%; overflow-y:auto; padding:0 15px 8px; }
  .stSec { font-size:12px; font-weight:bold; color:#7fb6d4; margin:13px 0 6px;
    border-bottom:1px solid rgba(127,182,212,.25); padding-bottom:4px; }
  .synLine { display:flex; align-items:center; gap:8px; font-size:12px; padding:5px 8px;
    border-radius:8px; margin-bottom:4px; background:rgba(255,255,255,.05); }
  .synLine.on { background:rgba(232,180,255,.18); }
  .synLine .sn { font-weight:bold; width:104px; flex:none; }
  .synLine.on .sn { color:#e8b4ff; }
  .synLine .sc { width:70px; flex:none; opacity:.8; font-size:11px; }
  .synLine .se { flex:1; opacity:.88; font-size:11px; }
  .bRow { display:flex; align-items:center; gap:8px; font-size:13px; padding:5px 8px;
    border-radius:8px; margin-bottom:4px; background:rgba(255,255,255,.05); }
  .bRow .bi { font-size:18px; width:26px; text-align:center; }
  .bRow .bn { flex:1; }
  .bRow .bl { font-size:11px; opacity:.75; }
  .statGrid { display:grid; grid-template-columns:1fr 1fr; gap:4px 12px; font-size:12px; }
  .statGrid div { display:flex; justify-content:space-between;
    border-bottom:1px dotted rgba(255,255,255,.14); padding:3px 0; }
  .statGrid b { color:#ffe27a; }
  .poolGrid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .poolBox { border:2px solid; border-radius:11px; padding:7px 9px; }
  .poolBox .ph { font-weight:bold; font-size:13px; margin-bottom:4px; }
  .poolBox .pn { font-size:10.5px; opacity:.9; line-height:1.55; }
  .closeBtn { margin:9px 0 0; padding:12px 44px; border-radius:30px; font-size:17px;
    font-weight:bold; background:#2f5a7c; color:#fff; border:none; flex:none; }

  /* ---------- シナジー告知 ---------- */
  #synPop { left:0; right:0; top:246px; text-align:center; pointer-events:none; opacity:0; }
  #synPop .box { display:inline-block; padding:11px 24px; border-radius:14px;
    background:linear-gradient(135deg,#7a3fd8,#c94fa8); border:2px solid #ffb3ec;
    box-shadow:0 0 30px rgba(220,90,200,.6); }
  #synPop .n { font-size:25px; font-weight:bold; margin-bottom:3px; }
  #synPop .d { font-size:13px; opacity:.95; }

  /* ---------- レジェンド演出 ---------- */
  #legend { inset:0; display:none; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 47%, rgba(255,205,80,.5) 0%,
      rgba(120,70,10,.9) 22%, rgba(4,12,20,.985) 46%);
    border-radius:14px; pointer-events:none; }
  #legend.show { display:flex; }
  #legend .inner { text-align:center; animation:legendIn .55s cubic-bezier(.2,1.6,.4,1); }
  #legend .inner::before { content:''; position:absolute; left:50%; top:50%;
    width:340px; height:340px; margin:-170px 0 0 -170px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,225,140,.45), transparent 65%);
    animation:legendGlow 1.7s ease-out; }
  @keyframes legendGlow { 0%{transform:scale(.1);opacity:0} 25%{transform:scale(1);opacity:1}
    100%{transform:scale(1.5);opacity:0} }
  #legend .li { font-size:74px; }
  #legend .ln { font-size:40px; font-weight:bold; margin:2px 0 5px;
    background:linear-gradient(180deg,#fff6d0,#ffb733); -webkit-background-clip:text;
    background-clip:text; color:transparent; text-shadow:0 0 30px rgba(255,190,60,.8); }
  #legend .ld { font-size:15px; color:#fff3c4; }
  @keyframes legendIn { 0%{transform:scale(.2) rotate(-12deg); opacity:0}
    60%{transform:scale(1.12) rotate(3deg); opacity:1} 100%{transform:scale(1) rotate(0)} }

  /* ---------- 開始の抽選演出 ---------- */
  #roll { inset:0; background:#061726; display:none; flex-direction:column;
    align-items:center; justify-content:center; gap:8px; border-radius:14px; padding:0 16px; }
  #roll.show { display:flex; }
  #rollTtl { font-size:19px; font-weight:bold; letter-spacing:2px; }
  #rollSub { font-size:11.5px; opacity:.65; margin-bottom:6px; }
  #seaWrap { display:flex; align-items:center; gap:14px; padding:8px 14px; border-radius:13px;
    border:2px solid #2f5a7c; background:rgba(47,90,124,.14); margin-bottom:4px; }
  #seaNm { font-size:17px; font-weight:bold; color:#8fd8ff; }
  #seaNote { font-size:11px; opacity:.7; margin-top:3px; }
  .rBox { width:100%; border:2px solid; border-radius:12px; padding:7px 10px; transition:.25s; }
  .rBox .rh { font-size:15px; font-weight:bold; margin-bottom:2px; }
  .rBox .rn { font-size:11.5px; line-height:1.6; opacity:.95; min-height:18px; }
  .rBox.spin { filter:blur(.4px); }
  #rollGo { margin-top:10px; padding:14px 38px; border-radius:34px; font-size:18px; font-weight:bold;
    background:linear-gradient(180deg,#ffd76a,#f2a63b); color:#4a2c00; border:none;
    box-shadow:0 0 24px rgba(255,200,80,.6); display:none; }
  #rollTap { margin-top:10px; font-size:17px; font-weight:bold; color:#ffe27a;
    animation:pulse 1s infinite; }

  /* ---------- タイトル / リザルト ---------- */
  #screen { inset:0; background:rgba(3,12,22,.95); display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:12px; border-radius:14px;
    text-align:center; padding:0 18px; }
  #screen.hide { display:none; }
  #scTtl { font-size:38px; font-weight:bold; letter-spacing:2px;
    background:linear-gradient(180deg,#bff0ff,#3aa6dd); -webkit-background-clip:text;
    background-clip:text; color:transparent; }
  #scTtl small { display:block; font-size:12px; letter-spacing:4px; margin-top:7px;
    color:#7fb6d4; -webkit-text-fill-color:#7fb6d4; }
  #scBody { font-size:14px; line-height:1.9; opacity:.92; }
  #scBtn { margin-top:4px; padding:15px 46px; border-radius:40px; font-size:19px; font-weight:bold;
    background:linear-gradient(180deg,#4fd1ff,#2b8fd0); color:#022; border:none;
    box-shadow:0 0 24px rgba(79,209,255,.5); }
  #scBtn:active { transform:scale(.96); }
  .hs { font-size:13px; opacity:.75; }
  #buildList { display:flex; flex-wrap:wrap; gap:5px; justify-content:center; max-width:430px; }
  #buildList span { font-size:11px; padding:3px 8px; border-radius:9px; background:rgba(255,255,255,.1); }
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="cv" width="480" height="800"></canvas>

  <div class="ov" id="stBtn"><div class="ic">📋</div>ステータス</div>
  <div class="ov" id="muBtn">🔊</div>
  <div class="ov" id="puBtn">
    <div>パワーアップ</div>
    <div id="puGauge"><div id="puFill"></div></div>
    <div id="puSub"></div>
  </div>

  <div class="ov" id="modal">
    <div id="puHead"><div class="t">パワーアップ</div>
      <div class="m">しょじきん <b id="puMoney">¥0</b></div></div>
    <div id="cards"></div>
    <div id="slotArea"></div>
    <div id="elArea"></div>
  </div>

  <div class="ov" id="fly"></div>

  <div class="ov" id="status">
    <div id="stTtl">ステータス</div>
    <div id="stSub"></div>
    <div id="stBody"></div>
    <button class="closeBtn" id="stClose">とじる</button>
  </div>

  <div class="ov" id="roll">
    <div id="rollTtl">きょうの 海</div>
    <div id="rollSub">海の形と ぞくせいは 毎回かわるよ</div>
    <div id="seaWrap"><canvas id="seaPrev" width="120" height="96"></canvas>
      <div><div id="seaNm">‥‥</div><div id="seaNote"></div></div></div>
    <div class="rBox" id="rb-fire"><div class="rh">🔥 火</div><div class="rn"></div></div>
    <div class="rBox" id="rb-water"><div class="rh">💧 水</div><div class="rn"></div></div>
    <div class="rBox" id="rb-wind"><div class="rh">💨 風</div><div class="rn"></div></div>
    <div class="rBox" id="rb-earth"><div class="rh">⛰️ 土</div><div class="rn"></div></div>
    <div id="rollTap">タップで ストップ！</div>
    <button id="rollGo">この海で はじめる</button>
  </div>

  <div class="ov" id="legend"><div class="inner">
    <div class="li"></div><div class="ln"></div><div class="ld"></div>
  </div></div>

  <div class="ov" id="synPop"><div class="box">
    <div class="n"></div><div class="d"></div>
  </div></div>

  <div class="ov" id="screen">
    <div id="scTtl">ツリツリバースト<small>1 2 と う で 大 漁 ビ ル ド</small></div>
    <div id="scBody"></div>
    <div id="buildList"></div>
    <button id="scBtn">はじめる</button>
    <div class="hs" id="hsTxt"></div>
  </div>
</div></div>

<script>
"use strict";
/* ============================================================
   1. 定数
   ============================================================ */
const W = 480, H = 800;
const RAIL_Y  = 116;
const WATER_T = 140, WATER_B = 690;
const WATER_L = 12,  WATER_R = 468;
const WATER_H = WATER_B - WATER_T, SEA_W = WATER_R - WATER_L;

const CASTS      = 12;
const CHANCE     = { 4:'school', 8:'boss', 12:'rush' };   // 何投目に何が起きるか
const BASE_R     = 62;
const BASE_FISH  = 95;
const FISH_REGEN = 15;
const FISH_FLOOR = 40;
const FISH_CAP   = 620;
const BASE_CHEST = 3;
const MONEY_RATE = 0.6;
const FREE_PU_MAX = 4;
const CURSOR_SPD = 330;
const DROP_SPD   = 300;
const PULL_RING  = 100;            // 引きよせの届く距離（ワッカ + これ）
const PULL_CAP   = 8;

const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const $ = id=>document.getElementById(id);

const ELS = ['fire','water','wind','earth'];
const EL  = {
  fire : { n:'火', ic:'🔥', c:'#ff8a5c' },
  water: { n:'水', ic:'💧', c:'#4fd1ff' },
  wind : { n:'風', ic:'💨', c:'#8fe86a' },
  earth: { n:'土', ic:'⛰️', c:'#ffd76a' },
};

const RANKS = [
  { n:'イワシ', c:'#a8dcea', s:9,  sc:10,  sp:36, school:1.0, move:'wave',   flee:0 },
  { n:'アジ',   c:'#93da86', s:12, sc:26,  sp:34, school:0.7, move:'zigzag', flee:0 },
  { n:'タイ',   c:'#f28d8d', s:16, sc:65,  sp:27, school:0.35,move:'swell',  flee:0 },
  { n:'ブリ',   c:'#7aa6ef', s:21, sc:160, sp:52, school:0.15,move:'rush',   flee:1 },
  { n:'マグロ', c:'#f5c85a', s:28, sc:420, sp:66, school:0,   move:'dash',   flee:2 },
];
const DEPTH_PREF = [0.10, 0.27, 0.47, 0.68, 0.87];
const BOSS_SCORE = 2600;

/* ============================================================
   2. 海の形（深さ t=0..1 ごとの 左右の端）
   ============================================================ */
const SEAS = [
  { nm:'ふつうの海',   note:'クセなし。なんでも来い',
    k:[[0,0,1],[1,0,1]] },
  { nm:'たてながの海', note:'ほそくて深い。タテがつよい',
    k:[[0,0.24,0.76],[1,0.24,0.76]] },
  { nm:'よこながの海', note:'ひろくて浅い。ヨコがつよい',

/* 正規化された左右端（0..1）。うみびらきで横にひろがる */
function nb(k, t, wide){
  const last = k[k.length-1][0];
  if (t < 0 || t > last) return null;
  let a = k[0];
  for (let i=1;i<k.length;i++){
    const b = k[i];
    if (t <= b[0]){
      const span = b[0]-a[0], u = span>0 ? (t-a[0])/span : 1;
      let xl = a[1] + (b[1]-a[1])*u, xr = a[2] + (b[2]-a[2])*u;
      if (wide){ xl = 0.5-(0.5-xl)*1.3; xr = 0.5+(xr-0.5)*1.3; }
      return [clamp(xl,0,1), clamp(xr,0,1)];
    }
    a = b;
  }
  return null;
}
/* 画面座標での左右端。無い深さなら null */
function bounds(t){
  const r = nb(st.sea.k, t, lv('umi')>0);
  return r ? [WATER_L + r[0]*SEA_W, WATER_L + r[1]*SEA_W] : null;
}
const yToT = y => (y - WATER_T) / WATER_H;
const tToY = t => WATER_T + t * WATER_H;
function inSea(x, y){
  const b = bounds(yToT(y));
  return !!b && x >= b[0]+8 && x <= b[1]-8;
}
function seaArea(k, wide){
  let a = 0;
  for (let t=0; t<1; t+=0.01){ const b = nb(k,t,wide); if (b) a += (b[1]-b[0])*0.01; }
  return a;
}
/* その列の海底の深さ */
function floorT(x){
  const last = st.sea.k[st.sea.k.length-1][0];
  for (let t=0; t<=last; t+=0.012){
    const b = bounds(t);
    if (!b || x < b[0]+6 || x > b[1]-6) return Math.max(0, t-0.012);
  }
  return last;
}

let actx = null, muted = false;
function audioUnlock(){
  if (actx) return;
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ actx = null; }
}
function snd(freq, dur, type, vol, slideTo){
  if (muted || !actx) return;
  const t = actx.currentTime;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol || 0.14, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur + 0.03);
}

function pickRank(){
  let w = [40,26,18,11,5];
  if (lv('deep')) { w[3] += 7*lv('deep'); w[4] += 5*lv('deep'); }
  if (lv('sink')) { w[3] += 9; w[4] += 7; }
  const tot = w.reduce((a,b)=>a+b,0);
  let x = Math.random()*tot, k = 0;
  for (; k<5; k++){ x -= w[k]; if (x<=0) break; }
  k = Math.min(4,k);
  if (Math.random() < st.rankP) k = Math.min(4, k+1);
  if (lv('chibi')) k = Math.max(0, k-1);
  return k;
}

function spawnFishAt(rank, cx, cy, spread){
  const f = fishPool.find(o=>!o.alive); if (!f) return null;
  const R = RANKS[rank];
  let x = cx + (Math.random()-0.5)*spread, y = cy + (Math.random()-0.5)*spread*0.55;
  y = clamp(y, WATER_T+14, WATER_B-14);
  const b = bounds(yToT(y));
  if (!b || b[1]-b[0] < 26) return null;
  x = clamp(x, b[0]+12, b[1]-12);
  f.alive=true; f.boss=false; f.rank=rank; f.x=x; f.y=y; f.homeY=y;
  f.dir  = Math.random()<0.5 ? -1 : 1;
  f.spd  = R.sp * (0.75 + Math.random()*0.5);
  f.wob  = Math.random()*6.28; f.tmr = Math.random()*2; f.burst = 0;
  f.caught=false; f.byBand=false; f.byCircle=false; f.miss=0; f.ty0=null; f.grow=0;
  return f;
}

function spawnSchool(limit, forceRank, atX, atY){
  const r = (forceRank !== undefined) ? forceRank : pickRank();
  const schoolP = lv('scatter') ? 0 : RANKS[r].school;
  let n = (schoolP>0 && Math.random()<schoolP) ? 2+((Math.random()*4)|0) : 1;
  n = Math.min(n, limit);
  let cy, cx;
  if (atY !== undefined){ cy = atY; cx = atX; }
  else {
    const d = DEPTH_PREF[r] + (Math.random()-0.5)*0.26;
    cy = tToY(clamp(d, 0.03, 0.97));
    const b = bounds(yToT(cy));
    if (!b) return 0;
    cx = b[0] + 16 + Math.random()*Math.max(1, b[1]-b[0]-32);
  }
  let made = 0;
  for (let i=0;i<n;i++) if (spawnFishAt(r, cx, cy, n>1 ? 58 : 0)) made++;
  return made;
}

  let room = Math.min(n, FISH_CAP - aliveFish());

  while (room > 0 && guard++ < 600){
    const made = spawnSchool(room, undefined, atX, atY);
    if (!made) { if (guard > 60) break; continue; }
    room -= made;
  }

}

function flushPendSpawns(){
  if (st.pend.fish > 0){
    const t = 0.15 + Math.random()*0.7, b = bounds(t);
    if (b){ addFish(st.pend.fish, b[0]+40+Math.random()*Math.max(1,b[1]-b[0]-80), tToY(t)); }
    else addFish(st.pend.fish);
    banner('魚が あつまってきた', '');
    st.pend.fish = 0;
  }
  while (st.pend.chest > 0){ spawnChest(); st.pend.chest--; }
  recompute();
}

function prepareOcean(){
  // チャンスタイム
  const ev = CHANCE[castNo()];
  if (ev === 'school'){
    const t = 0.2 + Math.random()*0.6, b = bounds(t);
    if (b) addFish(46, b[0]+40+Math.random()*Math.max(1,b[1]-b[0]-80), tToY(t));
    banner('魚群 チャンス！', 'ここを ねらえ'); sfx.chest();
  } else if (ev === 'boss'){
    if (!st.bossGot && !bossFish()) spawnBoss();
  } else if (ev === 'rush'){
    st.pend.ringMul *= 1.3;
    const base = aliveFish();                 // ループ中に増えた分を数えないよう先に固定
    for (let i=0;i<3;i++){
      const t = 0.2 + Math.random()*0.65, b = bounds(t);
      if (b) addFish(Math.round(base*0.5)+30,
                     b[0]+40+Math.random()*Math.max(1,b[1]-b[0]-80), tToY(t));
    }
    banner('さいごの 大漁タイム！', ''); sfx.boss();
  }
  let n = aliveFish();
  if (n < FISH_FLOOR){ addFish(FISH_FLOOR-n); banner('潮が かわった','魚が もどってきた'); }
  let m = chestPool.reduce((a,c)=>a+(c.alive?1:0),0);
  while (m < st.chestTarget){ spawnChest(); m++; }
  flushPendSpawns();
}

/* ============================================================
   8. ルアー・入力
   ============================================================ */
let cursor = { x:W/2, dir:1 };
let lure   = { active:false, x:0, y:0 };
let reel   = { t:0, dur:1.15, fish:[], chests:[], from:0, tallied:true };
let held = false, resultTxt = null, bannerTxt = null;

function startCast(){
  phase='aim'; lure.active=false;
  const b = bounds(0) || [WATER_L, WATER_R];
  cursor.x = (b[0]+b[1])/2; cursor.dir = 1;
  prepareOcean(); updatePUBtn();
}

function onPress(){
  audioUnlock();
  if (phase==='result' && resultTxt && resultTxt.t>0.35){ resultTxt.t = 1.5; return; }
  if (phase !== 'aim') return;
  lure.active = true; lure.x = cursor.x; lure.y = WATER_T - 6;
  phase = 'drop'; held = true; sfx.drop();
}
function onRelease(){ if (phase==='drop' && held){ held=false; resolveCatch(); } }

function lurePoints(){
  if (!st.dual) return [{ x:lure.x, y:lure.y, band:true }];
  const b = bounds(yToT(lure.y)) || [WATER_L, WATER_R];
  return [
    { x:clamp(lure.x-58, b[0]+10, b[1]-10), y:lure.y, band:true },
    { x:clamp(lure.x+58, b[0]+10, b[1]-10), y:lure.y, band:true },
  ];
}

/* ============================================================
   9. 捕獲
   ============================================================ */
const inCircle = (x,y,lx,ly)=>{ const dx=x-lx, dy=y-ly; return dx*dx+dy*dy <= st.radius*st.radius; };
function inBands(x,y,lx,ly){
  if (st.hlineH && Math.abs(y-ly) <= st.hlineH) return true;
  if (st.vlineW && Math.abs(x-lx) <= st.vlineW) return true;
  if (st.xlineW){
    const dx=x-lx, dy=y-ly, K=0.70710678;
    if (Math.abs((dx+dy)*K) <= st.xlineW || Math.abs((dx-dy)*K) <= st.xlineW) return true;
  }
  return false;
}

function resolveCatch(){
  const pts = lurePoints(), got = [], gotC = [];
  for (const f of fishPool){
    if (!f.alive || f.caught) continue;
    for (const p of pts){
      const c = inCircle(f.x,f.y,p.x,p.y), b = p.band && inBands(f.x,f.y,p.x,p.y);
      if (c || b){ f.caught=true; f.byCircle=c; f.byBand=(!c&&b); f.tx=p.x; f.ty=p.y; got.push(f); break; }
    }
    if (!f.caught){
      const p = pts[0], d = Math.hypot(f.x-p.x, f.y-p.y);
      if (d < st.radius + 34){ f.miss = 0.9; f.dir = (f.x < p.x) ? -1 : 1; }
    }
  }
  if (st.pull > 0){
    const p = pts[0];
    fishPool.filter(f=>f.alive && !f.caught)
      .map(f=>({ f, d:Math.hypot(f.x-p.x, f.y-p.y) }))
      .filter(o=>o.d < st.radius + PULL_RING)
      .sort((a,b)=>a.d-b.d).slice(0, st.pull)
      .forEach(o=>{ o.f.caught=true; o.f.miss=0; o.f.tx=p.x; o.f.ty=p.y; got.push(o.f); });
  }
  for (const c of chestPool){
    if (!c.alive || c.caught) continue;
    for (const p of pts){
      if (inCircle(c.x,c.y,p.x,p.y) || (p.band && inBands(c.x,c.y,p.x,p.y))){
        c.caught=true; c.tx=p.x; c.ty=p.y; gotC.push(c); break;
      }
    }
  }
  reel = { t:0, dur:1.15, fish:got, chests:gotC, from:lure.y, tallied:false, played:0 };
  phase = 'reel';
}

function burstParticles(x, y, n, col){
  for (let i=0;i<n;i++){
    const p = parPool.find(o=>!o.alive); if (!p) return;
    const a = Math.random()*6.28, sp = 40 + Math.random()*190;
    p.alive=true; p.x=x; p.y=y; p.vx=Math.cos(a)*sp; p.vy=Math.sin(a)*sp-40;
    p.life=0.5+Math.random()*0.5; p.max=p.life; p.c=col; p.r=2+Math.random()*3;
  }
}

function tally(){
  let sc = 0, mo = 0, bossGot = false;
  const cnt = reel.fish.length;
  for (const f of reel.fish){
    if (f.boss){ bossGot = true; sc += Math.round(BOSS_SCORE * st.scoreMult);
                 mo += Math.round(BOSS_SCORE * st.scoreMult * MONEY_RATE); continue; }
    let m = st.scoreMult;
    if (lv('net') && f.rank >= 3) m *= 0.6;
    const v = Math.round(RANKS[f.rank].sc * m);
    sc += v; mo += Math.round(v * MONEY_RATE);
  }
  const combo = cnt>=25 ? 2.0 : cnt>=15 ? 1.6 : cnt>=8 ? 1.3 : cnt>=4 ? 1.15 : 1;
  sc = Math.round(sc*combo); mo = Math.round(mo*combo);

  const msgs = [];
  for (const c of reel.chests){
    for (let i=0;i<st.chestTimes;i++){
      if (c.kind==='coin'){ const g = Math.round(180*Math.min(st.scoreMult,5)*st.coinMult);
                            mo += g; msgs.push('¥'+g); }
      else if (c.kind==='pu'){
        if (i===0 && st.forcePU<2 && st.freeGiven<FREE_PU_MAX){
          st.forcePU++; st.freeGiven++; msgs.push('パワーアップ！');
        } else if (i===0){
          const g = Math.round(220*Math.min(st.scoreMult,5)*st.coinMult);
          mo += g; msgs.push('¥'+g);
        }
      }
      else if (c.kind==='swarm'){ st.pend.fish += 30;   msgs.push('つぎ 魚の大群'); }
      else if (c.kind==='storm'){ st.pend.ringMul = Math.min(4, st.pend.ringMul*2);
                                  msgs.push('つぎ ワッカ2倍'); }
      else {                      st.pend.score = Math.min(6, st.pend.score*2.5);
                                  msgs.push('つぎ スコア2.5倍'); }
    }
  }
  if (bossGot){
    st.bossGot = 1; st.bossOut = 0;
    st.forcePU++; st.legendForce++;   // ヌシは レジェンド確定の無料パワーアップ
    msgs.push('ヌシ ゲット！');
    flash = 1; shake = 22; sfx.boss();
  }

  st.score += sc; st.money += mo; st.earned += mo;
  resultTxt = { n:cnt, sc, mo, combo, msgs, boss:bossGot, t:0 };

  // 演出（文字は出さず 光・粒・ゆれ で表現）
  const lvl = cnt>=50 ? 4 : cnt>=25 ? 3 : cnt>=10 ? 2 : cnt>=4 ? 1 : 0;
  flash = Math.max(flash, [0,.12,.28,.5,.8][lvl]);
  shake = Math.max(shake, [0,3,8,16,26][lvl]);
  if (lvl>=2) sfx.big();
  const cx = lure.x, cy = WATER_T + 20;
  burstParticles(cx, cy, [0,8,20,42,70][lvl], '#ffe27a');
  if (reel.chests.length) { burstParticles(cx, cy, 26, '#ffd76a'); sfx.chest(); }

  for (const f of reel.fish){ f.alive=false; f.caught=false; f.boss=false; }
  for (const c of reel.chests) c.alive = false;

  st.pend.ring = 0; st.pend.ringMul = 1; st.pend.score = 1; st.pend.pull = 0;
  recompute();
  addFish(st.regen);
  updatePUBtn();
}

/* ============================================================
   10. 更新
   ============================================================ */
function moveFish(f, dt){
  const R = RANKS[f.rank];
  let sp = f.spd;
  if (f.miss > 0){ f.miss -= dt; sp *= 3.1; }

  if (f.boss){
    f.wob += dt*1.1; f.y = f.homeY + Math.sin(f.wob)*16;
    sp = 30;
    if (phase==='drop'){
      const d = Math.hypot(f.x-lure.x, f.y-lure.y);
      if (d < 105){ f.dir = (f.x < lure.x) ? -1 : 1; sp = 66; }   // 逃げるが 追いつける
    }
  } else {
    switch (R.move){
      case 'wave':   f.wob += dt*3.2; f.y = f.homeY + Math.sin(f.wob)*7; break;
      case 'zigzag': f.wob += dt*4.4;
        f.y = f.homeY + (Math.asin(Math.sin(f.wob))/1.5708)*15; break;
      case 'swell':  f.wob += dt*1.15; f.y = f.homeY + Math.sin(f.wob)*34; sp *= .85; break;
      case 'rush':   f.wob += dt*2.2; f.y = f.homeY + Math.sin(f.wob)*5;
        f.tmr -= dt; if (f.tmr<=0){ f.tmr = 1.8+Math.random()*2.4; f.dir *= -1; } break;
      case 'dash':   f.wob += dt*1.6; f.y = f.homeY + Math.sin(f.wob)*4; f.tmr -= dt;
        if (f.burst>0){ f.burst -= dt; sp *= 3.2; if (f.burst<=0) f.tmr = .9+Math.random()*1.1; }
        else if (f.tmr<=0){ f.burst = .55; f.dir = Math.random()<.5?-1:1; }
        else sp *= .18;
        break;
    }
    const fleeLv = lv('wild') ? 2 : R.flee;
    if (phase==='drop' && fleeLv){
      const d = Math.hypot(f.x-lure.x, f.y-lure.y);
      if (d < 100 + fleeLv*40){
        f.dir = (f.x < lure.x) ? -1 : 1;
        sp *= 1.8 + fleeLv*0.7;
        f.homeY += (f.homeY < lure.y ? -1 : 1) * sp * 0.4 * dt;
      }
    }
  }

  f.x += f.dir * sp * dt;
  const b = bounds(yToT(f.y));
  if (!b){ f.homeY = clamp(f.homeY, WATER_T+20, tToY(st.sea.k[st.sea.k.length-1][0])-20); }
  else {
    if (f.x < b[0]+12){ f.x = b[0]+12; f.dir = 1; }
    if (f.x > b[1]-12){ f.x = b[1]-12; f.dir = -1; }
  }
  f.homeY = clamp(f.homeY, WATER_T+20, WATER_B-20);
  f.y     = clamp(f.y,     WATER_T+12, WATER_B-12);
  if (!inSea(f.x, f.y)){                       // 海の外へ出たら中へ押し戻す
    const bb = bounds(yToT(f.y));
    if (bb) f.x = clamp(f.x, bb[0]+12, bb[1]-12);
    else { f.homeY -= 26; f.y = f.homeY; }
  }
}

function moveChest(c, dt){
  const fast = lv('wildBox') ? 2.2 : 1;
  if (c.dash > 0){
    c.dash -= dt;
    c.x += c.vx * dt * 7 * fast; c.y += c.vy * dt * 7 * fast;
  } else if (c.warn > 0){
    c.warn -= dt;
    if (c.warn <= 0){ c.dash = 0.34;
      const a = Math.random()*6.28, sp = 60+Math.random()*45;
      c.vx = Math.cos(a)*sp; c.vy = Math.sin(a)*sp; }
  } else {
    c.tmr -= dt * fast;
    c.x += c.vx * dt * fast; c.y += c.vy * dt * 0.5 * fast;
    if (Math.random() < dt*0.7){ c.vx = (Math.random()<.5?-1:1)*(26+Math.random()*24);
                                 c.vy = (Math.random()-.5)*28; }
    if (c.tmr <= 0){ c.warn = 0.42; c.tmr = 1.6 + Math.random()*2.6; }
  }
  const b = bounds(yToT(c.y));
  if (b){ if (c.x < b[0]+18){ c.x = b[0]+18; c.vx = Math.abs(c.vx); }
          if (c.x > b[1]-18){ c.x = b[1]-18; c.vx = -Math.abs(c.vx); } }
  if (c.y < WATER_T+22){ c.y = WATER_T+22; c.vy = Math.abs(c.vy); }
  if (c.y > WATER_B-22){ c.y = WATER_B-22; c.vy = -Math.abs(c.vy); }
  if (!inSea(c.x, c.y)){
    const bb = bounds(yToT(c.y));
    if (bb) c.x = clamp(c.x, bb[0]+18, bb[1]-18);
    else { c.y -= 24; c.vy = Math.abs(c.vy); }
  }
}

function update(dt){
  if (shake > 0) shake = Math.max(0, shake - dt*60);
  if (flash > 0) flash = Math.max(0, flash - dt*2.2);

  if (Math.random() < dt*14){
    const b = bubPool.find(o=>!o.alive);
    if (b){ const t = 0.98, bb = bounds(t) || bounds(0.5);
            if (bb){ b.alive=true; b.x=bb[0]+Math.random()*(bb[1]-bb[0]);
                     b.y=tToY(t); b.r=1.5+Math.random()*3; b.v=22+Math.random()*30; } }
  }
  for (const b of bubPool){ if(b.alive && (b.y -= b.v*dt) < WATER_T) b.alive=false; }

  for (const p of parPool){
    if (!p.alive) continue;
    p.life -= dt; if (p.life<=0){ p.alive=false; continue; }
    p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 210*dt; p.vx *= 0.985;
  }

  for (const f of fishPool){
    if (!f.alive) continue;
    if (f.grow < 1) f.grow = Math.min(1, f.grow + dt*3);
    if (f.caught){ const k = Math.min(1, reel.t/0.28);
                   f.x += (f.tx-f.x)*k*0.35; f.y += (f.ty-f.y)*k*0.35; continue; }
    moveFish(f, dt);
  }
  for (const c of chestPool){
    if (!c.alive) continue;
    if (c.grow < 1) c.grow = Math.min(1, c.grow + dt*3);
    if (c.caught){ const k=Math.min(1,reel.t/0.28); c.x+=(c.tx-c.x)*k*0.35; c.y+=(c.ty-c.y)*k*0.35; }
    else moveChest(c, dt);
  }

  if (phase === 'aim'){
    const b = bounds(0) || [WATER_L, WATER_R];
    cursor.x += cursor.dir * st.cursorSpd * dt;
    if (cursor.x > b[1]-18){ cursor.x = b[1]-18; cursor.dir = -1; }
    if (cursor.x < b[0]+18){ cursor.x = b[0]+18; cursor.dir =  1; }
  }
  else if (phase === 'drop'){
    lure.y += st.dropSpd * dt;
    const t = yToT(lure.y);
    if (!inSea(lure.x, lure.y) && t > 0.02){ held = false; resolveCatch(); }
    else if (lure.y >= WATER_B - 8){ lure.y = WATER_B - 8; held = false; resolveCatch(); }
  }
  else if (phase === 'reel'){
    reel.t += dt;
    const k = clamp((reel.t-0.28)/(reel.dur-0.28), 0, 1);
    const ny = reel.from + (WATER_T-30 - reel.from) * (k*k*(3-2*k));
    if (reel.t > 0.28){
      for (const f of reel.fish){ f.x += (lure.x-f.x)*0.12; f.y = ny + (f.ty0 ??= (Math.random()-0.5)*26); }
      for (const c of reel.chests){ c.x += (lure.x-c.x)*0.12; c.y = ny + (c.ty0 ??= (Math.random()-0.5)*26); }
      const want = Math.min(12, Math.floor(k*12));
      while (reel.played < want && reel.played < reel.fish.length){ sfx.fish(reel.played); reel.played++; }
    }
    lure.y = ny;
    if (reel.t >= reel.dur && !reel.tallied){ reel.tallied = true; tally(); phase = 'result'; }
  }
  else if (phase === 'result'){
    resultTxt.t += dt;
    if (resultTxt.t > 1.5){
      resultTxt = null; st.castsLeft--;
      if (st.forcePU > 0 && st.castsLeft > 0){ st.forcePU--; openPU(true); }
      else if (st.castsLeft <= 0) gameOver();
      else startCast();
    }
  }
  if (bannerTxt){ bannerTxt.t += dt; if (bannerTxt.t > 1.7) bannerTxt = null; }
}

/* ============================================================
   11. 描画
   ============================================================ */
function seaPathOn(c2, k, wide, x0, y0, w, h){
  const last = k[k.length-1][0];
  c2.beginPath();
  let first = true;
  for (let t=0; t<=last+0.0001; t+=0.02){
    const b = nb(k, Math.min(t,last), wide); if (!b) break;
    const px = x0 + b[0]*w, py = y0 + Math.min(t,last)*h;
    if (first){ c2.moveTo(px,py); first=false; } else c2.lineTo(px,py);
  }
  for (let t=last; t>=-0.0001; t-=0.02){
    const b = nb(k, Math.max(t,0), wide); if (!b) continue;
    c2.lineTo(x0 + b[1]*w, y0 + Math.max(t,0)*h);
  }
  c2.closePath();
}

function draw(){
  ctx.save();
  if (shake > 0) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
  ctx.clearRect(-40,-40,W+80,H+80);

  let g = ctx.createLinearGradient(0,0,0,WATER_T);
  g.addColorStop(0,'#0d2b45'); g.addColorStop(1,'#1c4e6e');
  ctx.fillStyle=g; ctx.fillRect(-40,-40,W+80,WATER_T+40);
  ctx.fillStyle='#071320'; ctx.fillRect(-40,WATER_T,W+80,H-WATER_T+40);

  // 海（形つき）
  ctx.save();
  seaPathOn(ctx, st.sea.k, lv('umi')>0, WATER_L, WATER_T, SEA_W, WATER_H);
  ctx.clip();
  g = ctx.createLinearGradient(0,WATER_T,0,WATER_B);
  g.addColorStop(0,'#1b6f96'); g.addColorStop(.45,'#0f4a72'); g.addColorStop(1,'#04203c');
  ctx.fillStyle=g; ctx.fillRect(WATER_L,WATER_T,SEA_W,WATER_H);

  ctx.fillStyle='rgba(255,255,255,.16)';
  for (const b of bubPool){ if(!b.alive) continue; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,6.29); ctx.fill(); }
  for (const c of chestPool) if (c.alive) drawChest(c);
  for (const f of fishPool)  if (f.alive && !f.boss) drawFish(f);
  for (const f of fishPool)  if (f.alive &&  f.boss) drawBoss(f);
  if (phase==='drop' || phase==='reel') drawCapture(phase==='reel' ? 0.35 : 1);
  ctx.restore();

  // 海のふち
  seaPathOn(ctx, st.sea.k, lv('umi')>0, WATER_L, WATER_T, SEA_W, WATER_H);
  ctx.strokeStyle='rgba(150,215,245,.5)'; ctx.lineWidth=2.5; ctx.stroke();

  if (lure.active){
    for (const p of lurePoints()){
      ctx.strokeStyle='rgba(255,255,255,.45)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(p.x,96); ctx.lineTo(p.x,p.y); ctx.stroke();
      ctx.fillStyle='#ffe27a'; ctx.beginPath(); ctx.arc(p.x,p.y,7,0,6.29); ctx.fill();
      ctx.fillStyle='#e2453b'; ctx.beginPath(); ctx.arc(p.x,p.y-2,3.5,0,6.29); ctx.fill();
    }
  }

  for (const p of parPool){
    if (!p.alive) continue;
    ctx.globalAlpha = clamp(p.life/p.max,0,1);
    ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.29); ctx.fill();
  }
  ctx.globalAlpha = 1;

  if (phase === 'aim'){
    ctx.fillStyle='#ffe27a';
    ctx.beginPath(); ctx.moveTo(cursor.x,RAIL_Y+16); ctx.lineTo(cursor.x-11,RAIL_Y);
    ctx.lineTo(cursor.x+11,RAIL_Y); ctx.fill();
    ctx.strokeStyle='rgba(255,226,122,.28)'; ctx.setLineDash([5,7]); ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(cursor.x,RAIL_Y+18); ctx.lineTo(cursor.x,tToY(floorT(cursor.x))); ctx.stroke();
    ctx.setLineDash([]);
  }

  drawHUD();
  if (resultTxt) drawResult();
  if (bannerTxt) drawBanner();
  ctx.restore();

  if (flash > 0){ ctx.fillStyle = `rgba(255,255,255,${flash*0.5})`; ctx.fillRect(0,0,W,H); }
}

function drawCapture(a){
  for (const p of lurePoints()){
    if (p.band){
      ctx.fillStyle = `rgba(120,230,255,${0.16*a})`;
      if (st.hlineH) ctx.fillRect(WATER_L, p.y-st.hlineH, SEA_W, st.hlineH*2);
      if (st.vlineW) ctx.fillRect(p.x-st.vlineW, WATER_T, st.vlineW*2, WATER_H);
      if (st.xlineW){
        ctx.save(); ctx.translate(p.x,p.y);
        for (const rot of [Math.PI/4,-Math.PI/4]){
          ctx.save(); ctx.rotate(rot); ctx.fillRect(-900,-st.xlineW,1800,st.xlineW*2); ctx.restore();
        }
        ctx.restore();
      }
    }
    const gr = ctx.createRadialGradient(p.x,p.y,st.radius*0.25,p.x,p.y,st.radius);
    gr.addColorStop(0,`rgba(140,240,255,${0.05*a})`); gr.addColorStop(1,`rgba(140,240,255,${0.22*a})`);
    ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(p.x,p.y,st.radius,0,6.29); ctx.fill();
    ctx.strokeStyle=`rgba(180,250,255,${0.75*a})`; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(p.x,p.y,st.radius,0,6.29); ctx.stroke();
    if (st.pull){
      ctx.strokeStyle=`rgba(255,180,240,${0.30*a})`; ctx.setLineDash([4,7]);
      ctx.beginPath(); ctx.arc(p.x,p.y,st.radius+PULL_RING,0,6.29); ctx.stroke(); ctx.setLineDash([]);
    }
  }
}

function drawFish(f){
  const R = RANKS[f.rank], s = R.s * (0.45 + f.grow*0.55);
  ctx.save(); ctx.translate(f.x,f.y); ctx.scale(f.dir,1);
  if (f.caught){ ctx.shadowColor='#fff'; ctx.shadowBlur=12; }
  else if (f.miss > 0) ctx.globalAlpha = 0.55 + Math.sin(f.miss*40)*0.3;
  ctx.fillStyle = R.c;
  ctx.beginPath(); ctx.ellipse(0,0,s,s*0.55,0,0,6.29); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-s*0.85,0); ctx.lineTo(-s*1.5,-s*0.5); ctx.lineTo(-s*1.5,s*0.5); ctx.fill();
  if (f.rank >= 3){ ctx.fillStyle='rgba(255,255,255,.28)';
    ctx.beginPath(); ctx.ellipse(s*0.1,-s*0.18,s*0.55,s*0.16,0,0,6.29); ctx.fill(); }
  ctx.fillStyle='#12202e'; ctx.beginPath(); ctx.arc(s*0.52,-s*0.13,s*0.12,0,6.29); ctx.fill();
  ctx.restore();
}

function drawBoss(f){
  const s = 46 * (0.45 + f.grow*0.55), pulse = 1 + Math.sin(performance.now()/260)*0.05;
  ctx.save(); ctx.translate(f.x,f.y); ctx.scale(f.dir*pulse, pulse);
  ctx.shadowColor='#ffd76a'; ctx.shadowBlur = f.caught ? 34 : 22;
  const g = ctx.createLinearGradient(0,-s*0.6,0,s*0.6);
  g.addColorStop(0,'#ffe9a8'); g.addColorStop(0.5,'#e8a03c'); g.addColorStop(1,'#8a4a12');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(0,0,s,s*0.56,0,0,6.29); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-s*0.88,0); ctx.lineTo(-s*1.55,-s*0.62); ctx.lineTo(-s*1.55,s*0.62); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle='#fff6d0';
  ctx.beginPath(); ctx.moveTo(-s*0.2,-s*0.55); ctx.lineTo(-s*0.05,-s*0.95);
  ctx.lineTo(s*0.1,-s*0.55); ctx.fill();
  ctx.fillStyle='#3a2000'; ctx.beginPath(); ctx.arc(s*0.55,-s*0.14,s*0.11,0,6.29); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.9)'; ctx.beginPath(); ctx.arc(s*0.58,-s*0.17,s*0.04,0,6.29); ctx.fill();

}

function drawChest(c){
  const s = 19*(0.45+c.grow*0.55);

function drawHUD(){

  ctx.textAlign='left';

  let dx = 14;
  for (let i=0;i<CASTS;i++){

    ctx.fillStyle = done ? 'rgba(255,255,255,.18)' : ch ? '#ff9ad0' : '#ffe27a';
    ctx.fill();
    if (now){ ctx.strokeStyle='#fff'; ctx.lineWidth=2;
              ctx.beginPath(); ctx.arc(dx+5,48,9,0,6.29); ctx.stroke(); }

  if (st.pend.score  >1) pend.push('スコア×'+(+st.pend.score.toFixed(1)));

  if (pend.length){

  ctx.textAlign='center'; ctx.font='12px sans-serif'; ctx.fillStyle='rgba(255,255,255,.5)';
  if (phase==='aim')  ctx.fillText('おした しゅんかんに ヨコ ／ おしっぱなしで フカく', 240, 702);

                       ctx.fillText('はなすと 釣る！', 240, 702); }

   12. パワーアップ画面

const puBtn=$('puBtn'), puFill=$('puFill'), puSub=$('puSub'), modal=$('modal'),
      cardsEl=$('cards'), slotArea=$('slotArea'), elArea=$('elArea'),
      puMoney=$('puMoney'), synPop=$('synPop'), legendBox=$('legend'), flyEl=$('fly');
let curScale = 1, lastPU = { list:[], free:false };

{ const g=$('puGauge'); for (const p of [66.6,100]){
    const d=document.createElement('div'); d.className='tick'; d.style.left=p+'%'; g.appendChild(d); } }

function updatePUBtn(){
  const c = puCost();
  puFill.style.width = Math.min(1, st.money/(c*3))*100 + '%';
  if (st.money >= c){
    puBtn.classList.add('ready');
    puSub.textContent = '¥'+c+'　' + (st.money>=c*3 ? '★★' : st.money>=c*2 ? '★' : 'ためると ★');
  } else {
    puBtn.classList.remove('ready');
    puSub.textContent = 'あと ¥'+(c-st.money);
  }
}

function synAfter(c){
  const t = { ...st.tag }; t[st.elem[c.id]] += 1;
  return SYNS.filter(s=>synHas(t,s) && !st.syn.has(s.id));
}
function canTake(c){
  if (lv(c.id) >= c.max) return false;
  if (c.t==='t' && st.puCount < 2) return false;
  if (lv(c.id) > 0) return true;
  if (c.slot === true)  return slotUsed() < st.slotMax;
  if (c.slot === false){
    if (relicUsed() >= st.relicMax) return false;
    if (c.t === 't' && CARDS.filter(x=>x.t==='t' && lv(x.id)>0).length >= 2) return false;
    return true;
  }
  return true;
}

function rollChoices(){
  const cost = puCost();
  let wN=74, wR=20, wL=2.0, wT=6;
  if (st.money >= cost*3){ wR*=3.0; wL*=1.8; wT*=1.5; }
  else if (st.money >= cost*2){ wR*=2.0; wL*=1.35; wT*=1.3; }
  if (st.puCount < 2) wT = 0;
  if (lv('pricey')) wR *= 1.6;

  const perm = CARDS.filter(c=>c.t!=='x' && canTake(c));
  const temp = CARDS.filter(c=>c.t==='x');
  const nCards  = lv('pricey') ? 4 : 3;
  const out = [];

  // ヌシを釣ったときは レジェンド確定
  if (st.legendForce > 0){
    const legs = perm.filter(c=>c.t==='l');
    if (legs.length) out.push(legs[(Math.random()*legs.length)|0]);
    st.legendForce--;
  }
  // 5回目と9回目は トレードオフを1枚 確定で出す
  if ((st.puCount===4 || st.puCount===8)){
    const tds = perm.filter(c=>c.t==='t' && !out.includes(c));
    if (tds.length) out.push(tds[(Math.random()*tds.length)|0]);
  }

  const wantPerm = st.puCount < 2 ? nCards
                 : Math.min(nCards-1, Math.max(out.length, perm.length>=2 ? nCards-1 : perm.length));
  for (let i=out.length; i<wantPerm && out.length<nCards; i++){
    const pool = perm.filter(c=>!out.includes(c));
    if (!pool.length) break;
    const tot = wN+wR+wL+wT;
    let r = Math.random()*tot, tier;
    if ((r-=wN)<=0) tier='n'; else if ((r-=wR)<=0) tier='r'; else if ((r-=wL)<=0) tier='l'; else tier='t';
    let sub = [];
    for (const tr of TIER_FALL[tier]){ sub = pool.filter(c=>c.t===tr); if (sub.length) break; }
    if (!sub.length) break;
    out.push(sub[(Math.random()*sub.length)|0]);
  }
  while (out.length < nCards){
    const pool = temp.filter(c=>!out.includes(c));
    if (!pool.length) break;
    out.push(pool[(Math.random()*pool.length)|0]);
  }
  for (let i=out.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [out[i],out[j]]=[out[j],out[i]]; }
  return out;
}

function openPU(free){
  phase = 'powerup';
  const list = rollChoices();
  lastPU = { list, free };
  const legend = list.find(c=>c.t==='l');
  const show = ()=>buildPU(list, free);
  if (legend){ st.legendSeen++; playLegend(legend, show); } else show();
}

function playLegend(c, done){
  legendBox.querySelector('.li').textContent = c.ic;
  legendBox.querySelector('.ln').textContent = c.nm;
  legendBox.querySelector('.ld').textContent = c.ds;
  legendBox.classList.add('show'); sfx.legend();
  setTimeout(()=>{ legendBox.classList.remove('show'); done(); }, 1900);
}

function dotsHTML(n, max){
  let h = '<span class="lvd">';
  for (let i=0;i<max;i++) h += `<i class="${i<n?'on':''}"></i>`;
  return h + '</span>';
}

function buildPU(list, free){
  puMoney.textContent = '¥' + st.money.toLocaleString();
  cardsEl.innerHTML = '';
  for (const c of list){
    const el = EL[st.elem[c.id]], gain = synAfter(c);
    const d = document.createElement('div');
    d.className = 'card ' + TIER[c.t];
    d.dataset.cid = c.id;
    const price = free ? 'ムリョウ' : '¥' + cardCost(c).toLocaleString();
    d.innerHTML =
      `<div class="ic">${c.ic}</div><div class="tx">
         <div class="l1"><span class="nm">${c.nm}</span><span class="el">${el.ic}</span>
           ${c.t==='x' ? '' : dotsHTML(lv(c.id)+1, c.max)}
           <span class="pr">${price}${c.t==='x' && !free ? '<span class="cheap">やすい</span>' : ''}</span></div>
         <div class="ds">${c.ds}</div>
         ${gain.length ? `<div class="syn">◆ ${gain.map(g=>g.nm+'　'+g.d).join('／')}</div>` : ''}
       </div>`;
    d.onclick = ()=>choose(c, free, d);
    cardsEl.appendChild(d);
  }
  renderSlots();
  renderElGauge();
  modal.classList.add('show');
}

function renderSlots(){
  const build = CARDS.filter(c=>c.slot===true  && lv(c.id)>0);
  const relic = CARDS.filter(c=>c.slot===false && lv(c.id)>0);
  let h = '<div class="slotRow"><div class="lb">ビルド</div>';
  for (let i=0;i<st.slotMax;i++){
    const c = build[i];
    if (c){
      let dd = '<div class="sd">';
      for (let j=0;j<c.max;j++) dd += `<i class="${j<lv(c.id)?'on':''}"></i>`;
      h += `<div class="slot full" data-slot="${c.id}"><div class="si">${c.ic}</div>${dd}</div></div>`;
    } else h += `<div class="slot empty" data-empty="build"></div>`;
  }
  h += '</div><div class="slotRow"><div class="lb">おたから</div>';
  for (let i=0;i<st.relicMax;i++){
    const c = relic[i];
    h += c ? `<div class="slot relic full" data-slot="${c.id}"><div class="si">${c.ic}</div></div>`
           : `<div class="slot relic empty" data-empty="relic"></div>`;
  }
  slotArea.innerHTML = h + '</div>';
}

function renderElGauge(popEl){
  let h = '';
  for (const k of ELS){
    const v = st.tag[k], c = EL[k].c;
    let dots = '<span class="dots">';
    for (let i=0;i<6;i++){
      const on = v > i, pop = (popEl===k && v === i+1) ? ' pop' : '';
      dots += `<i class="${on?'on':''}${pop}"></i>`;
      if (i===2) dots += '<span class="sep"></span>';
    }
    dots += '</span>';
    const s3 = SYNS.find(s=>s.el===k && s.need===3), s6 = SYNS.find(s=>s.el===k && s.need===6);
    let stx;
    if (v >= 6)      stx = `<b>${s6.nm}</b>　${s6.d}`;
    else if (v >= 3) stx = `あと${6-v} → <b>${s6.nm}</b>　${s6.d}`;
    else             stx = `あと${3-v} → <b>${s3.nm}</b>　${s3.d}`;
    h += `<div class="elg" style="color:${c}"><span class="ei">${EL[k].ic}</span>${dots}
          <span class="st">${stx}</span></div>`;
  }
  const mn = Math.min(...ELS.map(k=>st.tag[k]));
  const sA = mn >= 3 ? SYNS.find(s=>s.id==='all3') : SYNS.find(s=>s.id==='all2');
  const need = mn >= 3 ? 0 : (mn >= 2 ? 3 : 2);
  h += `<div class="elg" style="color:#e8b4ff"><span class="ei">🌈</span>
        <span class="st">${need===0 ? `<b>${sA.nm}</b>　${sA.d}`
          : `ぜんぶ${need}こで <b>${sA.nm}</b>　${sA.d}`}</span></div>`;
  elArea.innerHTML = h;
}

/* --- ガンッと枠に入る演出 --- */
function localRect(el){
  const sr = stage.getBoundingClientRect(), r = el.getBoundingClientRect();
  return { x:(r.left-sr.left)/curScale, y:(r.top-sr.top)/curScale,
           w:r.width/curScale, h:r.height/curScale };
}

function slamInto(cardEl, card, done){
  const target = slotArea.querySelector(`[data-slot="${card.id}"]`)
              || slotArea.querySelector(card.slot===false ? '[data-empty="relic"]' : '[data-empty="build"]');
  if (!target || !cardEl){ done(); return; }
  const a = localRect(cardEl), b = localRect(target);
  for (const el of cardsEl.children) if (el !== cardEl) el.style.opacity = '0';
  cardEl.style.visibility = 'hidden';

  const fx = document.createElement('div');
  fx.className = 'flyCard ' + TIER[card.t];
  fx.style.cssText += `left:${a.x}px;top:${a.y}px;width:${a.w}px;height:${a.h}px;`;
  fx.textContent = card.ic;
  flyEl.appendChild(fx);
  requestAnimationFrame(()=>{
    const sx = b.w/a.w, sy = b.h/a.h;
    fx.style.transform =
      `translate(${b.x-a.x + (b.w-a.w)/2}px, ${b.y-a.y + (b.h-a.h)/2}px) scale(${sx},${sy})`;
  });
  setTimeout(()=>{
    fx.remove(); done();
    shake = Math.max(shake, 9); sfx.slot();
  }, 275);
}

function choose(card, free, cardEl){
  if (phase !== 'powerup') return;
  phase = 'slam';
  slamInto(cardEl, card, ()=>applyPick(card, free));
}

function applyPick(c, free){
  if (!free) st.money -= cardCost(c);
  st.puCount++;
  if (!free) sfx.buy();

  const wasMax = isMaxed(c);
  st.lvl[c.id] = lv(c.id) + 1;
  const elKey = st.elem[c.id];
  st.tag[elKey] += 1;
  st.picks.push(c.nm);

  if (c.t === 'x'){
    if (c.id==='tFish')  st.pend.fish  += 20;
    if (c.id==='tRing')  st.pend.ring  += 40;
    if (c.id==='tScore') st.pend.score *= 1.8;
    if (c.id==='tChest') st.pend.chest += 3;
    if (c.id==='tPull')  st.pend.pull  += 3;
    st.lvl[c.id] = 0;
  }
  let slotBorn = false;
  if (c.slot===true && !wasMax && isMaxed(c)){ st.slotMax++; slotBorn = true; }
  if (c.id==='fish')    addFish(18);
  if (c.id==='fishBig') addFish(60);
  if (c.id==='umi')     addFish(40);
  if (c.id==='chibi')   addFish(Math.round(aliveFish()*0.6));
  if (c.id==='scatter') addFish(50);

  const fresh = recompute();
  applySynBurst(fresh); recompute();

  // 枠と属性ドットを更新して 着地を見せる
  renderSlots(); renderElGauge(elKey);
  const tgt = slotArea.querySelector(`[data-slot="${c.id}"]`);
  if (tgt) tgt.classList.add('hit');
  if (slotBorn){
    const e = slotArea.querySelector('[data-empty="build"]');
    if (e) e.classList.add('born');
  }
  flushPendSpawns(); updatePUBtn();

  setTimeout(()=>{
    modal.classList.remove('show');
    for (const el of cardsEl.children) el.style.opacity = '';
    fresh.forEach((id,i)=>setTimeout(()=>showSyn(SYNS.find(s=>s.id===id)), i*2100));
    if (st.forcePU > 0 && free && st.castsLeft > 0){ st.forcePU--; openPU(true); return; }
    if (st.castsLeft <= 0) gameOver(); else startCast();
  }, slotBorn ? 620 : 430);
}

function showSyn(s){
  synPop.querySelector('.n').textContent = s.nm;
  synPop.querySelector('.d').textContent = s.d;
  synPop.style.transition='none'; synPop.style.opacity='1'; sfx.syn();
  setTimeout(()=>{ synPop.style.transition='opacity .8s'; synPop.style.opacity='0'; }, 1300);
}

});

function openStatus(){

    const on = s.syn.has(sy.id);
    let cond;
    if (on) cond = '✅ はつどう中';
    else if (sy.el==='all') cond = 'あと ' + ELS.filter(e=>s.tag[e]<sy.need)
                                  .map(e=>EL[e].n+(sy.need-s.tag[e])).join(' ');
    else cond = `あと ${EL[sy.el].n} ${sy.need - s.tag[sy.el]}`;
    h += `<div class="synLine ${on?'on':''}"><div class="sn">${sy.nm}</div>
      <div class="sc">${synShort(sy)}</div><div class="se">${on?sy.d:cond+' → '+sy.d}</div></div>`;
  }

  h += '<div class="stSec">いまのビルド</div>';
  const owned = CARDS.filter(c=>c.t!=='x' && lv(c.id)>0);
  if (!owned.length) h += '<div class="bRow"><div class="bn" style="opacity:.6">まだ なにも ありません</div></div>';
  for (const c of owned){
    const el = EL[s.elem[c.id]];
    h += `<div class="bRow"><div class="bi">${c.ic}</div>
      <div class="bn">${c.nm}${isMaxed(c)&&c.max>1?' <span style="color:#ffe27a">★</span>':''}</div>
      <div class="bl" style="color:${el.c}">${el.ic}</div>
      <div class="bl">${c.max>1?('Lv '+lv(c.id)+'/'+c.max):''}</div></div>`;
  }

  h += '<div class="stSec">いまの つよさ</div><div class="statGrid">';
  const rows = [
    ['ワッカ', Math.round(s.radius)],
    ['ヨコ帯', s.hlineH?('±'+Math.round(s.hlineH)):'なし'],
    ['タテ帯', s.vlineW?('±'+Math.round(s.vlineW)):'なし'],
    ['ナナメ帯', s.xlineW?('±'+Math.round(s.xlineW)):'なし'],
    ['引きよせ', s.pull+'匹'],
    ['ルアー', s.dual?'2本':'1本'],
    ['海の魚', aliveFish()+'匹'],
    ['毎投の わき', '+'+s.regen+'匹'],
    ['たからばこ', s.chestTarget+'こ'],
    ['たから効果', s.chestTimes+'回'],
    ['スコア倍率', '×'+s.scoreMult.toFixed(2)],
    ['デカ魚率', '+'+Math.round(s.rankP*100)+'%'],
  ];
  h += rows.map(([a,b])=>`<div><span>${a}</span><b>${b}</b></div>`).join('') + '</div>';

  h += '<div class="stSec">この海の ぞくせい</div><div class="poolGrid">';
  for (const k of ELS){
    const list = CARDS.filter(c=>s.elem[c.id]===k);
    h += `<div class="poolBox" style="border-color:${EL[k].c}">
      <div class="ph" style="color:${EL[k].c}">${EL[k].ic} ${EL[k].n}</div>
      <div class="pn">${list.map(c=>c.ic+' '+c.nm).join('<br>')}</div></div>`;
  }
  h += '</div>';

  stSub.textContent = `のこり ${s.castsLeft}投`;
  stBody.innerHTML = h; stBody.scrollTop = 0;
  statusSheet.classList.add('show');
}
$('stBtn').addEventListener('pointerdown', e=>{
  e.stopPropagation();
  if (st && (phase==='aim' || phase==='powerup')) openStatus();
});
$('stClose').addEventListener('pointerdown', e=>{ e.stopPropagation(); statusSheet.classList.remove('show'); });

$('muBtn').addEventListener('pointerdown', e=>{
  e.stopPropagation(); audioUnlock();
  muted = !muted; $('muBtn').textContent = muted ? '🔇' : '🔊';
  $('muBtn').style.opacity = muted ? '.5' : '1';
  if (!muted) sfx.buy();
});

/* ============================================================
   14. 開始の抽選演出
   ============================================================ */
const rollScreen=$('roll'), rollGo=$('rollGo'), rollTap=$('rollTap'),
      seaPrev=$('seaPrev'), seaCtx=seaPrev.getContext('2d');
let rollTimer = null, rollLocked = false;

function drawSeaPrev(sea){
  seaCtx.clearRect(0,0,120,96);
  seaCtx.fillStyle='#08202f'; seaCtx.fillRect(0,0,120,96);
  seaPathOn(seaCtx, sea.k, false, 6, 6, 108, 84);
  const g = seaCtx.createLinearGradient(0, 6, 0, 90);
  g.addColorStop(0, '#2a8fbb'); g.addColorStop(1, '#083550');
  seaCtx.fillStyle = g; seaCtx.fill();
  seaCtx.strokeStyle = '#8fd8ff'; seaCtx.lineWidth = 2; seaCtx.stroke();
}

function startRoll(){
  dealElements();
  rollScreen.classList.add('show');
  rollGo.style.display='none'; rollTap.style.display='block';
  rollLocked = false;
  for (const k of ELS) $('rb-'+k).classList.add('spin');
  const all = CARDS.map(c=>c.ic+' '+c.nm);
  rollTimer = setInterval(()=>{
    st.sea = SEAS[(Math.random()*SEAS.length)|0];
    drawSeaPrev(st.sea);
    $('seaNm').textContent = st.sea.nm; $('seaNote').textContent = '';
    for (const k of ELS){
      const box = $('rb-'+k);
      box.style.borderColor = EL[k].c;
      box.querySelector('.rh').style.color = EL[k].c;
      box.querySelector('.rn').textContent = all[(Math.random()*all.length)|0];
    }
  }, 60);
}

function stopRoll(){
  if (rollLocked) return;
  rollLocked = true;
  clearInterval(rollTimer); rollTimer = null;
  st.sea = SEAS[(Math.random()*SEAS.length)|0];
  drawSeaPrev(st.sea);
  $('seaNm').textContent = st.sea.nm;
  $('seaNote').textContent = st.sea.note;
  for (const k of ELS){
    const box = $('rb-'+k);
    box.classList.remove('spin');
    box.querySelector('.rn').innerHTML =
      CARDS.filter(c=>st.elem[c.id]===k).map(c=>c.ic+' '+c.nm).join('　');
  }
  rollTap.style.display='none'; rollGo.style.display='block';
  recompute(); sfx.syn();
}
rollScreen.addEventListener('pointerdown', e=>{
  if (e.target === rollGo) return;
  e.preventDefault(); e.stopPropagation(); audioUnlock(); stopRoll();
});
rollGo.addEventListener('pointerdown', e=>{
  e.stopPropagation();
  rollScreen.classList.remove('show');
  for (const f of fishPool)  f.alive=false;
  for (const c of chestPool) c.alive=false;
  recompute();
  addFish(Math.round(BASE_FISH * st.fishScale));
  startCast();
});

/* ============================================================
   15. タイトル / リザルト
   ============================================================ */
const screen=$('screen'), scTtl=$('scTtl'), scBody=$('scBody'),
      scBtn=$('scBtn'), hsTxt=$('hsTxt'), buildList=$('buildList');

function showTitle(){
  phase='title'; screen.classList.remove('hide');
  scTtl.innerHTML = 'ツリツリバースト<small>1 2 と う で 大 漁 ビ ル ド</small>';
  scBody.innerHTML = 'おした しゅんかんに <b>ヨコ</b>、おしっぱなしで <b>フカさ</b>。<br>'
    + 'ぜんぶで <b>12投</b>。ハイスコアを ねらえ！<br>'
    + '<span style="opacity:.6;font-size:12px">タップ ／ スペースキー</span>';
  buildList.innerHTML=''; scBtn.textContent='はじめる';
  hsTxt.textContent = hiScore ? 'ハイスコア '+hiScore.toLocaleString() : '';
}

function gameOver(){
  phase='over'; sfx.over();
  if (st.score > hiScore) hiScore = st.score;
  screen.classList.remove('hide');
  scTtl.innerHTML = 'つりおわり！<small>お つ か れ さ ま</small>';
  const r = st.score>=60000?'🏆':st.score>=30000?'🥇':st.score>=12000?'🥈':st.score>=4000?'🥉':'🐟';
  scBody.innerHTML = `<div style="font-size:44px;font-weight:bold;color:#ffe27a">${st.score.toLocaleString()}</div>
    <div style="font-size:34px;margin:2px 0 4px">${r}</div>
    <div style="font-size:12px;opacity:.7">${st.sea.nm}${st.bossGot?'　🐉ヌシ ゲット':''}</div>`;
  const seen = [...new Set(st.picks)];
  buildList.innerHTML = seen.map(p=>`<span>${p}</span>`).join('')
    + (st.syn.size ? '<br>' + [...st.syn].map(id=>
        `<span style="background:rgba(232,180,255,.25)">◆${SYNS.find(s=>s.id===id).nm}</span>`).join('') : '');
  scBtn.textContent='もう1回'; hsTxt.textContent='ハイスコア '+hiScore.toLocaleString();
}

function newGame(){
  audioUnlock();
  st = newState();
  for (const f of fishPool)  f.alive=false;
  for (const c of chestPool) c.alive=false;
  for (const p of parPool)   p.alive=false;
  recompute();
  screen.classList.add('hide');
  modal.classList.remove('show'); statusSheet.classList.remove('show');
  updatePUBtn();
  phase = 'roll';
  startRoll();
}
scBtn.addEventListener('pointerdown', e=>{ e.stopPropagation(); newGame(); });

/* ============================================================
   16. 入力・ループ
   ============================================================ */
const stage = $('stage');
const inUI = e => [puBtn,$('stBtn'),$('muBtn'),modal,statusSheet,screen,rollScreen,legendBox,flyEl]
                    .some(el=>el===e.target || el.contains(e.target));
stage.addEventListener('pointerdown', e=>{ if(inUI(e)) return; e.preventDefault(); onPress(); });
window.addEventListener('pointerup',     ()=>onRelease());
window.addEventListener('pointercancel', ()=>onRelease());
window.addEventListener('blur',          ()=>onRelease());
window.addEventListener('keydown', e=>{
  if (e.code!=='Space' && e.code!=='Enter') return;
  e.preventDefault(); audioUnlock();
  if (phase==='title'||phase==='over'){ newGame(); return; }
  if (phase==='roll'){ rollLocked ? rollGo.dispatchEvent(new Event('pointerdown')) : stopRoll(); return; }
  if (!e.repeat) onPress();
});
window.addEventListener('keyup', e=>{ if(e.code==='Space'||e.code==='Enter') onRelease(); });
document.addEventListener('touchmove', e=>e.preventDefault(), { passive:false });

function resize(){
  const iw=window.innerWidth, ih=window.innerHeight;
  curScale = Math.min(iw/W, ih/H);
  stage.style.transform =
    `translate(${(iw-W*curScale)/2}px, ${(ih-H*curScale)/2}px) scale(${curScale})`;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', ()=>setTimeout(resize,120));
resize();

st = newState(); dealElements(); recompute(); showTitle();

let last = performance.now();
function loop(now){
  const dt = Math.min(0.05,(now-last)/1000); last = now;
  if (phase!=='title' && phase!=='over' && phase!=='powerup' && phase!=='slam' && phase!=='roll')
    update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
